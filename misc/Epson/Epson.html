    strong_tag {

    }

    big_title {

    .notes-block {

    .invoice-wrap {

      font-weight: bold;
      font-size: 12px;
      width: 21cm;

    }

    .grid {

      position: absolute;
    }

      <div class="invoice-inner">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td align="right" valign="top">
              <h1>
                <p id="invoice_title" class="editable-area invoice-name">
                  {%invoice_title%}
                </p>
              </h1>
            </td>
            <td align="left" valign="top">
              <img
                style="vertical-align: top; margin-bottom: 10px"
                id="logo"
                class="editable-area"
                src="{%logo%}"
                width="{%logo-width%}"
                height="{%logo-height%}"
              />
              <div id="business_info" class="editable-area">
                <p>{%business_info%}</p>
              </div>
            </td>
          </tr>
        </table>

        <div class="invoice-address">
          <table border="0" cellspacing="0" cellpadding="0" width="100%">
            <tr>
              <td align="right" valign="top">
                <div
                  style="vertical-align: top"
                  align="right"
                  id="client_info"
                  class="editable-area"
                >
                  <strong id="field1" class="editable-area">{%field1%}</strong
                  ><br />
                  {%client_info%}
                </div>
              </td>
              <td
                id="shipping_options"
                style="display: none"
                align="right"
                valign="top"
              >
                <div
                  style="vertical-align: top"
                  align="right"
                  id="ship_info"
                  class="editable-area"
                >
                  <strong id="label_ship" class="editable-area"
                    >{%label_ship%}</strong
                  ><br />
                  {%ship_info%}
                </div>
              </td>
              <td valign="top" align="left">
                <table
                  id="invoice_basics"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_invoice_no"
                        >{%label_invoice_no%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_number%}
                    </td>
                  </tr>
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_date"
                        >{%label_date%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_date%}
                    </td>
                  </tr>
                </table>
                <custom_field
                  id="custom_fields"
                  class="editable-area"
                  style="clear: both"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  {%custom_fields%}
                </custom_field>
              </td>
            </tr>
          </table>
        </div>

        <div id="items-list">{%items_list%}</div>
        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>
