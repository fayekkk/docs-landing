<div style="padding-top: 10px">
  <table
    style="
      width: 100%;
      font-weight: bold;
      border: 0;
      margin: 0;
      font-size: 11px;
    "
  >
    <tr>
      <td style="text-align: right; width: 100%; padding-right: 10px">
        صفحة <span class="page"></span> / <span class="topage"></span>
        <!-- الصفحة <span class="page"></span> -->
      </td>
    </tr>
  </table>
</div>
<script>
  function subst() {
    // Decoding the invoice page url to detect page number
    var vars = {};
    var x = document.location.search.substring(1).split("&");
    for (var i in x) {
      var z = x[i].split("=", 2);
      vars[z[0]] = unescape(z[1]);
    }
    // Adding Pagination Text
    var x = [
      "frompage",
      "topage",
      "page",
      "webpage",
      "section",
      "subsection",
      "subsubsection",
    ];
    for (var i in x) {
      var y = document.getElementsByClassName(x[i]);
      for (var j = 0; j < y.length; ++j) y[j].textContent = vars[x[i]];
    }
  }
  try {
    subst();
  } catch (error) {
    console.log(error);
  }
</script>
