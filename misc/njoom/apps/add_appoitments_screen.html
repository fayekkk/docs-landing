  }

  function formatTime(timeString) {
    var timeParts = timeString.split(":");
    var hours = parseInt(timeParts[0], 10);
    var minutes = parseInt(timeParts[1], 10);

    // Pad the hours and minutes with zeros if necessary
    var paddedHours = hours < 10 ? "0" + hours : hours;
    var paddedMinutes = minutes < 10 ? "0" + minutes : minutes;

    return paddedHours + ":" + paddedMinutes + ":00";
  }

    return new Promise((res) => {

  function getBookedAppointments(idArray, startDate, endDate) {
    return new Promise(async (res) => {
      //  console.log("idArray");
      //  console.log(idArray);
      let end_date = endDate;
      let afterEndDate = convertDateToString(addDays(new Date(endDate), 1));

      if (idArray != null && idArray.length != 0) {
        let allAppointmnets = [];
        for (const empId of idArray) {
          let appointmentList = await $.get(
            `/v2/api/entity/item_staff/list/1?filter[item_type]=9&filter[staff_id]=${empId}&filter[follow_up_reminder.date][lte]=${afterEndDate}&filter[follow_up_reminder.date][gte]=${startDate}&filter[follow_up_reminder.status]=0&per_page=100`
          );

          if (appointmentList.data.length != 0) {
            //  console.log({ appointmentListdorrrrrrrrrmeeeee: appointmentList });
            appointmentList.data.map((val) => {
              allAppointmnets.push({
                appointment_id: val["follow_up_reminder"]["id"],
                star_date_time: val["follow_up_reminder"]["date"],
                end_date_time: val["follow_up_reminder"]["end_date"],
                invoice_Id: val["follow_up_reminder"]["item_id"],
              });
            });
          }
        }
        // /v2/api/entity/item_staff/list/1?filter[item_type]=9&filter[follow_up_reminder.status]=0&per_page=100`
        res(allAppointmnets);
      } else {
        res(null);
      }
    });
  }

  function convertDecimalToTime(decimal) {
    var hours = Math.floor(decimal);
    var minutes = Math.round((decimal - hours) * 60);
    return hours + ":" + (minutes < 10 ? "0" : "") + minutes;
  }

        .toISOString()
        .slice(0, 10)}</span> <div class='overlay'></div>`;

      // Create time shift cells

      for (let i = parseFloat(startTime); i < totalTime; i++) {
        let timeCell = row.insertCell(-1);
        let fromTime = convertDecimalToTime(i);
        let toTime = convertDecimalToTime(i + 1);

        if (isDisabledDay) {
          timeCell.className = "time-shift disabled-day";
        } else {
          timeCell.className = "time-shift";
        }

        let isTimeBooked = false;
        if (TimePeriod.length != 0) {
          isTimeBooked = TimePeriod.some((val) => {
            let newToTime = formatTime(toTime);
            let newFromTIme = formatTime(fromTime);
            let toTimeConveted = new Date("1970-01-01T" + newToTime + "Z");
            let fromTimeConverted = new Date("1970-01-01T" + newFromTIme + "Z");
            let startTimeConverted = new Date(
              "1970-01-01T" + val["start_time"] + "Z"
            );
            let endTimeConverted = new Date(
              "1970-01-01T" + val["end_time"] + "Z"

            //  console.log("on day " + d.toISOString().slice(0, 10));
            //  console.log(fromTime, toTime, val["start_time"], val["end_time"]);
            return (
              (fromTimeConverted.getTime() >= startTimeConverted.getTime() &&
                toTimeConveted.getTime() <= endTimeConverted.getTime()) ||
              (startTimeConverted.getTime() >= fromTimeConverted.getTime() &&
                startTimeConverted.getTime() < toTimeConveted.getTime()) ||
              (endTimeConverted.getTime() > fromTimeConverted.getTime() &&
                endTimeConverted.getTime() < toTimeConveted.getTime())
            );
          });

  function selectAllShifts(index, selected) {
    var table = document.getElementById("myTable");

    for (var i = 1; i < table.rows.length; i++) {
      if (!$(table.rows[i].cells[index]).hasClass("unavailable")) {
        if (!$(table.rows[i].cells[index]).hasClass("disabled-day")) {
          if (selected) {
            $(table.rows[i].cells[index]).addClass("selected");
          } else {
            $(table.rows[i].cells[index]).removeClass("selected");
          }
        }
      } else {
        return false;
        break;
      }
    }
    return true;
  }

  function deSelectAllShifts(index) {
    var table = document.getElementById("myTable");

    for (var i = 1; i < table.rows.length; i++) {
      $(table.rows[i].cells[index]).removeClass("selected");

    alert(
      "هذه الفترة غير متاحة في جميع الأيام المحددة، لا يمكن تحديد هذه الفترة"
    );
  }

            if (dates[0] != null && dates[1] != undefined) {
              $(".date_from").val(dates[0].replace(" ", ""));

            let selectSecondDate = date[1];

              if (

            if (selectedTds.length > 0) {
              const firstIndex = tds.findIndex((td) => td === selectedTds[0]);
              const lastIndex = tds.findIndex(

              );
              //  console.log(thenewCreated);
              console.log("start reselecting");
              if (selectedTds.length == 1) {
                thenewCreated[firstIndex].click();
              } else {
                thenewCreated[firstIndex].click();
                thenewCreated[lastIndex].click();
              }
              console.log("Index of the first selected <td>:", firstIndex);
              console.log("Index of the last selected <td>:", lastIndex);

              console.log('No <td> elements with the class "selected" found.');

          }, 2500);
          setTimeout(() => {

                    postFunction();
                    setTimeout(() => {
                      // $(".loading-overlay").hide();

                  }
                });

                return false;
              }

            }

          setTimeout(() => {
            //  console.log("open again");
          }, 1000);
        });
        setTimeout(() => {
          $("#main-content").css("opacity", 1);
        }, 500);
      }
    });
  });
