          });
          const scannerVideo = document.getElementById("scanner-video");
          scannerVideo.srcObject = videoStream;

          // Set up barcode detection using Quagga
          Quagga.init(
            {
              inputStream: {
                name: "Live",
                type: "LiveStream",
                target: scannerVideo,
                constraints: {
                  width: {
                    min: 840,
                  },
                  height: {
                    min: 680,
                  },
                  aspectRatio: {
                    min: 1,
                    max: 100,
                  },
                  facingMode: "environment",
                },
              },
              locator: {
                patchSize: "small",
                halfSample: false,
              },
              numOfWorkers: 4,
              decoder: {
                readers: ["ean_8_reader", "code_128_reader"],
                debug: {
                  showCanvas: true,
                  showPatches: true,
                  showFoundPatches: true,
                  showSkeleton: true,
                  showLabels: true,
                  showPatchLabels: true,
                  showRemainingPatchLabels: true,
                  boxFromPatches: {
                    showTransformed: true,
                    showTransformedBox: true,
                    showBB: true,
                  },
                },
              },
              locate: false,
            },
            function (err) {
              if (err) {
                console.error("Error initializing Quagga:", err);
                return;
              }
              Quagga.start();
              Quagga.onDetected(async function (result) {
                console.log(
                  "Barcode detected and processed : [" +
                    result.codeResult.code +
                    "]",
                  result
                );
                console.log(
                  "Barcode detected and processed : [" +
                    result.codeResult.format +
                    "]"
                );
                document.getElementById("result_value").value =
                  result.codeResult.code;
                let allmyTableRows = document.querySelectorAll(".myTable tr");
                document.querySelector("#scannerContainer").style.display =
                  "flex";
                // document.querySelector("#result_value").style.display = "flex";

                for (let i = 1; i < allmyTableRows.length; i++) {
                  if (
                    result.codeResult.code ==
                    allmyTableRows[i].querySelector("td:nth-child(4)").innerText
                  ) {
                    allmyTableRows[i].classList.add("yellow");
                    // console.log(allmyTableRows[i]);
                    stopVideoStream(); // Stop the video stream
                    Quagga.stop(); // Stop the Quagga barcode detection
                    document.querySelector("#scannerContainer").style.display =
                      "none";

                    //   // let roomUpdateData = {
                    //   //     req_id: requestionID,
                    //   // };
                    // }

                    // let dataToUpdate = {
                    //   req_id: requestionID,
                    // };

                    // $.ajax({

                    //   error: (error) => {
                    //     console.error("Error:", error);
                    //   },
                    // });

                    // result.codeResult.code = "";
                    break; // Exit the loop since we found the match

                  // if (
                  //   result.codeResult.code ==
                  //   allmyTableRows[i].querySelector("td:nth-child(4)").innerText
                  // ) {
                  //   allmyTableRows[i].classList.add("yellow");
                  //   result.codeResult.code = "";
                  //   matchFound = true;
                  //   break; // Exit the loop since we found the match
                  // }
                }
                // if (matchFound) {
                //   stopVideoStream(); // Stop the video stream
                //   Quagga.stop(); // Stop the Quagga barcode detection
                //   document.querySelector("#scannerContainer").style.display =

                //   document.querySelector("#result_value").style.display =

                //   document.querySelector("#result_value").style.display =

                // }
              });
            }
          );

  function showPopup() {
    let popup = $(".popup");

    if (popup.length === 0) {
      // Create a new popup if it doesn't exist
      popup = $(
        '<div class="popup">\
              <div class="popup-content">\
                <div class="loader"></div>\
              </div>\
            </div>'
      );
      $("body").append(popup);

      var windowHeight = $(window).height();
      var popupHeight = popup.outerHeight();
      var topPosition = (windowHeight - popupHeight) / 2;
      popup.css("top", topPosition + "px");

      popupCreated = true; // Set the flag to true
    } else {
      // Show the existing popup
      popup.css("display", "flex");
    }

    // Set focus on the popup
    popup.focus();

    $(document).on("keydown", function (e) {
      if (e.key === "Escape") {
        closePopup();
      }
    });

    $(document).on("click", ".cancel-btn", function () {
      closePopup();
    });
  }
