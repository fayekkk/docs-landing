<style>
  .hidden {
    display: none;
  }
</style>
<script>
  $(document).ready(() => {
    let sections = $(".form-row div:not(:last-child)");
    $.each(sections, (idx, newDiv) => {
      if (idx <= 10) {
        sections.eq(idx + 1).addClass("hidden");
      }
    });

    setTimeout((e) => {
      $("#le_workflow-type-entity-3_custom_data-emp_ids").val(
        $("#le_workflow-type-entity-3_custom_data-employees").val()
      );
    }, 500);

    $("#le_workflow-type-entity-3_custom_data-employees").on("change", (e) => {
      $("#le_workflow-type-entity-3_custom_data-emp_ids").val(
        $("#le_workflow-type-entity-3_custom_data-employees").val()
      );
    });
  });
</script>
