<script>
  // TO BE ADDED IN THE EMPLOYEES GROUPS WORK FLOW

  $(document).ready(() => {
    let employeeArr = [];
    const idArr = [];

    async function getData() {
      console.log("start fetching");
      document.querySelector(
        "#le_workflow-type-entity-3_custom_data-employees"
      ).disabled = "true";

      const instanceId = location.pathname.split("/")[5];
      const url =
        "/v2/api/entity/le_workflow-type-entity-3/list/1?filter[status]=status-1&per_page=200";
      const response = await fetch(url);
      const data = await response.json();
      const myData = data.data;

      const employeeCustomDataPromises = [];
      console.log({ myData: myData });
      for (let i = 0; i < myData.length; i += 5) {
        const batch = myData.slice(i, i + 5);
        employeeCustomDataPromises.push(
          fetchEmployeeCustomData(batch, instanceId)
        );
      }

      const employeeCustomDataResults = await Promise.all(
        employeeCustomDataPromises
      );
      const flattenedEmployeeCustomData = employeeCustomDataResults.flat();

      const staffUrlPromises = [];
      console.log({ flattenedEmployeeCustomData: flattenedEmployeeCustomData });
      for (let i = 0; i < flattenedEmployeeCustomData.length; i += 15) {
        let staffurl = `/v2/api/entity/staff/list/1?`;
        for (let j = 0; j < 15; j++) {
          let k = j + i;
          if (flattenedEmployeeCustomData[k] != undefined) {
            staffurl += `&filter[id][in][]=${flattenedEmployeeCustomData[k]}`;
          }
        }
        staffUrlPromises.push(
          $.get(staffurl).then((responses) => {
            responses.data.forEach((empdata) => {
              const empName = empdata.name;
              employeeArr.push(empName);
              idArr.push(empdata.id);
            });
          })
        );
      }

      await Promise.all(staffUrlPromises);
      console.log({ employeeArr: employeeArr });

      document
        .querySelector("#le_workflow-type-entity-3_custom_data-employees")
        .removeAttribute("disabled");
    }

    async function fetchEmployeeCustomData(batch, instanceId) {
      const employeeCustomData = [];
      console.log({ employeeCustomData: employeeCustomData });
      console.log({ batch: batch });
      for (const item of batch) {
        if (item.id != instanceId) {
          const customfieldId =
            item["le_workflow-type-entity-3_custom_data"].id;
          const getInstanceData = await fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-3/${customfieldId}`
          );
          const instanceData = await getInstanceData.json();
          console.log({ instanceData: instanceData });
          employeeCustomData.push(...instanceData.employees);
        }
      }

      return employeeCustomData;
    }

    getData();

    // REMOVE THE ASSIGNED USERS FROM THE UL MENU

        console.log(options[i].innerText.replace("#", ""));
        if (employeeArr.includes(options[i].innerText.replace("#", ""))) {
          options[i].style.display = "none";
          options[i].setAttribute("class", "none");
          console.log(options[i].innerText.replace("#", ""), "is Assigned");
        } else {

        }
      }
    });

    // IF THE USER SEARCHED FOR ONE OF THE ASSIGNED USER AN ALERT WILL POP-UP
