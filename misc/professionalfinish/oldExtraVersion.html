<style>
  .extraction-select {
    display: block;
  }
</style>
<script>
  $(document).ready(function () {
    setTimeout(() => {
      // subbition
      document.getElementById("le_clientextraction").onsubmit = function (e) {
        e.preventDefault();
        $("input:disabled").prop("disabled", false);
        const formData = new FormData(e.target);
        const formDataObj = {};
        formData.forEach((value, key) => {
          // Split the key on the square brackets
          const keys = key.match(/[^\[\]]+/g);
          let tempObj = formDataObj;

          // Loop through the keys to build the nested structure
          keys.forEach((k, i) => {
            // If we're at the last key, set the value
            if (i === keys.length - 1) {
              tempObj[k] = value;
            } else {
              // If the key doesn't exist, create an empty object
              if (!tempObj[k]) {
                tempObj[k] = {};
              }
              tempObj = tempObj[k];
            }
          });
        });
        console.log(formDataObj);

        fetch(`/v2/api/entity/le_clientextraction`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(formDataObj),
        }).then((response) => {
          response
            .json()
            .then((res) => {
              console.log("Success:", res);
              uptadeprojectdata(formDataObj);
            })
            .catch((error) => {
              console.error("Error:", error);
            });
        });
      };
      function uptadeprojectdata(formDataObj) {
        let projID = parseInt(window.location.href.split("/")[8]);
        console.log({ formDataObj: formDataObj });

        let projectdata = parsetoarray(
          formDataObj[
            "le_clientextraction_le_clientextraction_extraction_items1"
          ]
        );
        console.log({ projectdata: projectdata });
        // get project items to update
        if (projectdata.length > 0) {
          // /v2/api/entity/le_custom_data_le_workflow-type-entity-1/list/1?filter[reference_id]=2
          fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-1/list/1?filter[reference_id]=${projID}`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
            }
          )
            .then((response) => response.json())
            .then((refrenceIds) => {
              console.log("refrenceIds:", refrenceIds);
              for (let i = 0; i < projectdata.length; i++) {
                console.log(
                  `/v2/api/entity/le_custom_data_le_workflow-type-entity-1_project_items/list/1?filter[reference_id]${refrenceIds.data[0].id}={}&filter[item_number_in_contract]=${projectdata[i].item_number1}`
                );
                fetch(
                  `/v2/api/entity/le_custom_data_le_workflow-type-entity-1_project_items/list/1?filter[reference_id]=${refrenceIds.data[0].id}&filter[item_number_in_contract]=${projectdata[i].item_number1}`,
                  {
                    method: "GET",
                    headers: {
                      Accept: "application/json",
                      "Content-Type": "application/json",
                    },
                  }
                )
                  .then((response) => response.json())
                  .then((data) => {
                    console.log("Response:", data);
                    if (data.length > 0) {
                      fetch(
                        `/v2/api/entity/le_custom_data_le_workflow-type-entity-1_project_items/${data.id}/1`,
                        {
                          method: "GET",
                          headers: {
                            Accept: "application/json",
                            "Content-Type": "application/json",
                          },
                        }
                      )
                        .then((response) => response.json())
                        .then((data) => {
                          console.log("Responsetosend:", data);
                        });
                    }
                  });
              }
            });
        }
      }
      // get date from form and convert it to arr
      function parsetoarray(returnedData) {
        let parsedData;
        try {
          parsedData = JSON.parse(returnedData);
        } catch (e) {
          parsedData = returnedData;
        }
        let dataArray;
        if (Array.isArray(parsedData)) {
          dataArray = parsedData;
        } else if (typeof parsedData === "object" && parsedData !== null) {
          dataArray = Object.values(parsedData);
        } else {
          dataArray = [parsedData];
        }
        return dataArray;
      }
      async function fetchProjectData() {
        let projectId = parseInt(window.location.href.split("/")[8]);

        try {
          const response = await fetch(
            `/v2/api/entity/le_workflow-type-entity-1/${projectId}/4`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
            }
          );

          const data = await response.json();
          console.log("Response:", data);
          return data;
        } catch (error) {
          console.error("Error:", error);
          return null;
        }
      }

      async function main() {
        const projectData = await fetchProjectData();
        console.log(projectData);

        if (projectData) {
          //
          if (projectData.client_id) {
            let clientId = projectData.work_order_client.id;
            let clientName = projectData.work_order_client.business_name;
            let newOption = new Option(clientName, clientId);
            $("#client_project").append(newOption);
            $("#client_project").val(clientId).change();
          }
          if (projectData.number) {
            $("#single_line_field").val(projectData.number).change();
          }
          //   extraction

          function addSelectorsAfterInputs() {
            $("[id$='--extraction_item1']").each(function () {
              const inputId = $(this).attr("id");
              const selectId = inputId + "_select";
              if ($("#" + selectId).length === 0) {
                const $input = $(this);

                let customData =
                  projectData["le_workflow-type-entity-1_custom_data"];
                let projectItems =
                  customData[
                    "le_custom_data_le_workflow-type-entity-1_le_custom_data_le_workflow-type-entity-1_project_items"
                  ];
                const data = projectItems;

                const select = document.createElement("select");
                select.id = selectId;
                select.className = "extraction-select";

                const defaultOption = document.createElement("option");
                defaultOption.textContent = "Select an option";
                defaultOption.value = -1;
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                data.forEach((item, index) => {
                  const option = document.createElement("option");

                  for (const [key, value] of Object.entries(item)) {
                    if (typeof value === "object" && value !== null) {
                      for (const [nestedKey, nestedValue] of Object.entries(
                        value
                      )) {
                        option.dataset[nestedKey] = nestedValue ?? "";
                      }
                    } else {
                      option.dataset[key] = value ?? "";
                    }
                    console.log(key);
                    console.log(value);
                    if (
                      key ==
                      "le_custom_data_le_workflow-type-entity-1_project_items_project_item_name"
                    ) {
                      option.value = value.item_name + "(" + value.id + ")";
                      option.textContent = value.item_name;
                    }
                  }

                  select.appendChild(option);
                });

                $input.after(select);
                const $select = $("#" + selectId);
                $select.css({
                  width: $input.css("width"),
                  height: $input.css("height"),
                  padding: $input.css("padding"),
                  margin: $input.css("margin"),
                  border: $input.css("border"),
                  borderRadius: $input.css("border-radius"),
                  backgroundColor: $input.css("background-color"),
                  color: $input.css("color"),
                  fontSize: $input.css("font-size"),
                  fontFamily: $input.css("font-family"),
                });
                $input.hide();
                $(document).on("change", `#${selectId}`, function () {
                  const currentValue = $(this).val();
                  const currentId = $(this).attr("id");

                  // Check if any other selector has the same value
                  const duplicate =
                    $(".extraction-select")
                      .not(`#${currentId}`)
                      .filter(function () {
                        return $(this).val() === currentValue;
                      }).length > 0;

                  if (duplicate && currentValue !== "-1") {
                    alert("تم إختيار هذا البند مسبقاً");
                    $(this).val("-1"); // Reset to default option
                  } else {
                    const selectedValue = $(this).val();
                    $input.val(selectedValue);
                    const selectedOption = $(this).find("option:selected");
                    //   create selevted iputs
                    let unitInput = $(this)
                      .closest("tr")
                      .find("[id$='--unit1']");
                    let item_number1 = $(this)
                      .closest("tr")
                      .find("[id$='--item_number1']");
                    let price1 = $(this).closest("tr").find("[id$='--price1']");
                    let ttlqty1 = $(this)
                      .closest("tr")
                      .find("[id$='--ttlqty1']");
                    let current_process1 = $(this)
                      .closest("tr")
                      .find("[id$='--current_process1']");
                    let prev_process1 = $(this)
                      .closest("tr")
                      .find("[id$='--prev_process1']");
                    let remain_process1 = $(this)
                      .closest("tr")
                      .find("[id$='--remain_process1']");
                    let ta3lyattlqty = $(this)
                      .closest("tr")
                      .find("[id$='--ta3lyattlqty']");
                    let prev_ta3lya_per = $(this)
                      .closest("tr")
                      .find("[id$='--prev_ta3lya_per']");
                    let curr_ta3lya_per = $(this)
                      .closest("tr")
                      .find("[id$='--curr_ta3lya_per']");
                    let remain_ta3lya_per = $(this)
                      .closest("tr")
                      .find("[id$='--remain_ta3lya_per']");
                    console.log(selectedOption[0].dataset);
                    let itemvalues = selectedOption[0].dataset;
                    unitInput.val(itemvalues.unit);
                    unitInput.attr("disabled", "disabled");
                    item_number1.val(itemvalues.item_number_in_contract);
                    item_number1.attr("disabled", "disabled");
                    ttlqty1.val(itemvalues.quantity);
                    ttlqty1.attr("disabled", "disabled");
                    price1.val(itemvalues.ttl_price);
                    price1.attr("disabled", "disabled");
                    prev_process1.val(itemvalues.process_percent);
                    prev_process1.attr("disabled", "disabled");
                    ta3lyattlqty.val(itemvalues.ta3lya);
                    ta3lyattlqty.attr("disabled", "disabled");
                    prev_ta3lya_per.val(itemvalues.ta3lya_percent);
                    prev_ta3lya_per.attr("disabled", "disabled");
                    remain_ta3lya_per.attr("disabled", "disabled");
                    remain_process1.val(
                      100 - parseFloat(itemvalues.process_percent)
                    );
                    remain_process1.attr("disabled", "disabled");
                    //   curr_ta3lya_per.val(itemvalues);
                    //   current_process1.val(itemvalues);
                  }
                });
              }
            });
          }

          // add change event on current process change
          function validate(prev, curr, remain) {
            // "[id$='--current_process1']"  "[id$='--remain_process1']" "[id$='--prev_process1']"
            $(document).on("input", curr, function () {
              let currValue = $(this).val();
              if (currValue == "") {
                currValue = 0;
              }
              let prevprocess = $(this).closest("tr").find(prev).val();
              if (prevprocess == "") {
                prevprocess = 0;
              }
              $(this)
                .closest("tr")
                .find(remain)
                .val(100 - (parseFloat(prevprocess) + parseFloat(currValue)));
              if (100 - (parseFloat(prevprocess) + parseFloat(currValue)) < 0) {
                $(this)
                  .val(100 - parseFloat(prevprocess))
                  .change();
                $(this).closest("tr").find(remain).val(0).change();
              }
            });
          }
          validate(
            "[id$='--prev_process1']",
            "[id$='--current_process1']",
            "[id$='--remain_process1']"
          );
          //   Validate the ta3lya
          validate(
            "[id$='--prev_ta3lya_per']",
            "[id$='--curr_ta3lya_per']",
            "[id$='--remain_ta3lya_per']"
          );
          // Function to add new input fields dynamically
          function addNewInput() {
            const existingInputs = $("[id$='--extraction_item1']");
            const newIndex = existingInputs.length;
            const newInputId = `le_clientextraction_le_clientextraction_extraction_items1-${newIndex}--extraction_item1`;
            const newInput = `<input type="text" id="${newInputId}" class="extraction-input" placeholder="Enter text" />`;

            $("#inputContainer").append(newInput);
            addSelectorsAfterInputs();
          }

          addSelectorsAfterInputs();

          $(
            "#le_clientextraction > div.form-row > div.col-lg-12.col-md-12.col-xs-12 > div > div > div > div.card-body.p-0 > div > div > div > div > div > div.btn-group.add-row.dropdown > button"
          ).on("click", addNewInput);
        } else {
          window.location.reload();
        }
      }

      main();
    }, 400);
  });
</script>
