            await $.get(
              `https://silverscreen.daftra.com/v2/api/entity/le_banks/list`
            ).then((banks) => {
              let bankslist = banks.data;
              var option = document.createElement("option");
              option.innerText = "select bank";
              option.value = "-1";
              option.style.textAlign = "center";
              selector.appendChild(option);
              for (let i = 0; i < bankslist.length; i++) {
                var option = document.createElement("option");
                option.innerText =

                  bankslist[i].name_of_bank;
                option.value = bankslist[i].id;
                option.style.textAlign = "center";
                selector.appendChild(option);
              }
              newTd.appendChild(selector);
              newTr.appendChild(newTd);
              if (!document.querySelector("#ClientSection #bankselector")) {
                var newTBL = document.createElement("table");
                newTBL.appendChild(newTr);
                newTBL.style.marginTop = "15px";
                document.querySelector("#ClientSection").appendChild(newTBL);
              }
              document
                .getElementById("bankselector")
                .addEventListener("change", (e) => {
                  addclasses();
                  if (e.target.value == "-1") {
                    document.querySelector(".BankBranch").value = "";
                    document.querySelector(".NameofBank").value = "";
                    document.querySelector(".AccountName").value = "";
                    document.querySelector(".SwiftCode").value = "";
                    document.querySelector(".IBAN").value = "";
                    document.querySelector(".AccountNumber").value = "";
                  } else {
                    for (let i = 0; i < bankslist.length; i++) {
                      if (bankslist[i].id == e.target.value) {
                        document.querySelector(".BankBranch").value =
                          bankslist[i].bank_branch;
                        document.querySelector(".NameofBank").value =
                          bankslist[i].name_of_bank;
                        document.querySelector(".AccountName").value =
                          bankslist[i].account_name;
                        document.querySelector(".SwiftCode").value =
                          bankslist[i].swift_code;
                        document.querySelector(".IBAN").value =
                          bankslist[i].iban;
                        document.querySelector(".AccountNumber").value =
                          bankslist[i].account_number;
                      }
                    }
                  }
                });
