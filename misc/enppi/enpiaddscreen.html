<style>
  .hidden-elem {
    display: none !important;
  }
  .rtl-span {
    display: inline-block;
    direction: rtl;
  }
  .error-box span {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid rgba(224, 25, 49, 0.8);
    background: rgba(224, 25, 49, 0.7);
    color: #fff;
    border-radius: 3px;
  }
  .error-box {
    display: inline-block;
    position: inherit;
    margin-right: 20px;
  }
  .error-box:after {
    border: 0;
  }
</style>
<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
      <div class="m-r-md d-inline-flex">
        <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">احسب ضمان الأعمال</a>
      </div>
      <div style="display: inline-block; max-width: 100px;">
        <label class="ui-input-label l-input-label adjust-tab-input-label">النسبة</label>
        <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
      </div>
      <div class="error-box hidden">
        <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
        <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
      </div>
    </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);

    // getting second tax
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#InvoiceAdjustmentLabel").val("خصم ضمان أعمال");
    }

    // calculating retention funtion
    function calcRetention() {
      var retentionValue = $("#InvoiceAdjustmentValue");
      var total =
        parseFloat($("#SubtotalValue").text().replace(/,/g, "")) + tax;
      if (isNaN(total)) {
        total = 0;
      }

      // calculating retention from subtotal
      $("#InvoiceAdjustmentValue").val(
        (parseFloat($("#InvoiceRetention").val() * 0.01) * total * -1).toFixed(
          2
        )
      );
      $("#InvoiceAdjustmentValue").change();

      // getting retention value
      function getRetPerc() {
        let retPer = $("#InvoiceRetention").val();
        return retPer;
      }

      // changing the adjustment label with the retention percentage
      $("#InvoiceAdjustmentLabel").val(`خصم ضمان أعمال (${getRetPerc()}%)`);

      // LOCAL STORAGE (saving new retention value)
      localStorage.setItem("retention", $("#InvoiceRetention").val());
    }

    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    if (adjLbl.text() == "التسوية") {
      adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    }

    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }
  });
</script>

<script>
  $(document).ready(() => {
    var templateLayout = document.querySelector("#InvoiceLayout").value;
    function manageCustomFields() {
      if (templateLayout == "1" || templateLayout == "2") {
        // deal with client Info

        /* *********************** payment selectors **************************** */
        // assign classes to custom feild
        setTimeout(() => {
          let cstLbls = $(".field-row td:first-child input");
          let cstVals = $(".field-row td:nth-child(2)");
          for (i = 0; i < cstLbls.length; i++) {
            if (cstLbls.eq(i).val() == "Payment Method") {
              cstVals[i].classList.add("Payment_Method");
            } else if (cstLbls.eq(i).val() == "Bank Name") {
              cstVals[i].classList.add("BankName");
            } else if (cstLbls.eq(i).val() == "Bank Adress") {
              cstVals[i].classList.add("BankAdress");
            } else if (cstLbls.eq(i).val() == "IBAN") {
              cstVals[i].classList.add("IBAN");
            } else if (cstLbls.eq(i).val() == "Account No") {
              cstVals[i].classList.add("AccountNo");
            } else if (cstLbls.eq(i).val() == " Contract No") {
              cstVals[i].classList.add("ContractNo");
            }
          }
          // add payment selector
          document.querySelector(".Payment_Method div").style.display = "none";
          if (!document.querySelector(".Payment_Method #progressOption")) {
            document.querySelector(
              ".Payment_Method"
            ).innerHTML += `<select class="" id="progressOption" style="width: 100%;">
      <option value="0" selected> اختر طريقة الدفع</option>
      <option value="1">PROGRESS</option>
      <option value="2">RETENTION</option>
      <option value="3">ADVANCED PAYMENT</option>
      <option value="4">CHANGE ORDER</option>
  </select>`;
          }
          document
            .getElementById("progressOption")
            .addEventListener("change", function () {
              document.querySelector(".Payment_Method input").value =
                document.getElementById("progressOption").value;
            });
          $.get(
            `https://ayoubmohamed.daftra.com/v2/api/entity/treasury/2`
          ).then((BANKData) => {
            console.log(BANKData);
            document.querySelector(".BankName input").value =
              BANKData.description;
            document.querySelector(".BankAdress input").value = BANKData.name;
            document.querySelector(".IBAN input").value = BANKData.type_name;
            document.querySelector(".AccountNo input").value =
              BANKData.type_account_number + " " + BANKData.currency_code;
          });
          // /**********************************************************************************
          let clientId = $("#InvoiceClientId").val();
          let PrevMonthTotals = "0";
          console.log(clientId);
          if (clientId > 0) {
            $.get(
              `https://ayoubmohamed.daftra.com/v2/api/entity/client/${clientId}/4`
            ).then((clientData) => {
              document.querySelector(".ContractNo input").value =
                clientData.custom_data.field_1;
            });
          }
          // get client on change client
          $(document).on("change", "#InvoiceClientId", function () {
            let clientId = $(this).val();
            let PrevMonthTotals = "0";
            if (clientId > 0) {
              $.get(
                `https://ayoubmohamed.daftra.com/v2/api/entity/client/${clientId}/4`
              ).then((clientData) => {
                document.querySelector(".ContractNo input").value =
                  clientData.custom_data.field_1;
              });
            }
          });

          /*

$.ajax({
  url: "https://ayoubmohamed.daftra.com/v2/api/entity/client/9/fields",
  method: "POST",
  data: {
    notes: "1515151"
  },
  success: function(response) {
    console.log("Success:", response);
  },
  error: function(error) {
    console.error("Error:", error);
  }
});
*/
        }, 500);
      }
      document
        .querySelector("#InvoiceLayout")
        .addEventListener("change", function () {
          manageCustomFields();
        });
    }
    manageCustomFields();
  });
</script>
