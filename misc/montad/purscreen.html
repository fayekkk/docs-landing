<script>
  $(document).ready(() => {
    setTimeout(() => {
      function screenCode() {
        var allPurchaseOrderCustomFields = document.querySelectorAll(
          "#PurchaseOrderCustomFields .field-row"
        );
        let invDate = $("#PurchaseOrderDate").val();
        const gregorianDate = new Date(Date.parse(invDate));
        // Subtract one day from the Gregorian date
        const previousGregorianDate = new Date(gregorianDate.getTime());
        // Create an instance of Intl.DateTimeFormat with the appropriate options
        const formatter = new Intl.DateTimeFormat("ar-EG-u-ca-islamic", {
          timeZone: "Africa/Cairo",
          day: "numeric",
          month: "long",
          year: "numeric",
        }); 
        // Format the previous Gregorian date to Hijri
        const hijriDate = formatter.format(previousGregorianDate);
        console.log(hijriDate);
        let flag = 0;
        for (let i = 0; i < allPurchaseOrderCustomFields.length; i++) {
          if (
            allPurchaseOrderCustomFields[i].cells[0].querySelector("input")
              .value == "التاريخ الهجرى"
          ) {
            flag = 1;

            allPurchaseOrderCustomFields[i].cells[1].querySelector(
              "input"
            ).value = hijriDate;
          }
        }
        if (flag == 0) {
          $(".MoreFieldsListDropDown").click();
          document.querySelector(
            "#PurchaseOrderCustomFields .field-row:last-child td:nth-child(1) input"
          ).value = "التاريخ الهجرى";
          document.querySelector(
            "#PurchaseOrderCustomFields .field-row:last-child td:nth-child(2) input"
          ).value = hijriDate;
        }
      }
      screenCode();
      $(document).on("change", "#InvoiceLayout", function () {
        setTimeout(() => {
          screenCode();
        }, 250);
      });
    }, 500);
  });
</script>
