<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }

    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }

    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }

    .invoice-address {
      border-top: 3px double #000000;
      margin: 35px 0;
      padding-top: 25px;
    }

    bold_title {
      font-weight: bold;
    }

    big_title {
      font-size: 18px;
      font-weight: 100;
    }

    .bussines-name {
      font-size: 18px;
      font-weight: 100;
    }

    .invoice-name {
      font-size: 22px;
      font-weight: 700;
    }

    .listing-table th {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }

    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }

    .total-table td {
      border-right: 1px solid #555555;
    }

    .total-row {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }

    .row-items {
      margin: 5px 0;
      display: block;
    }
    /* 
    .notes-block {
      margin: 50px 0 0 0;
    } */

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }

    #business_info {
      line-height: 1.4;
    }

    #listing_table th:last-child,
    #listing_table td:last-child {
      border-left: 1px solid #555555;
    }

    #label_subtotal {
      width: 65px;
    }

    #label_field3,
    #label_field4 {
      width: 55px;
    }

    #items-list > table:nth-child(2) tr td:nth-child(1) {
      width: 60%;
    }

    #listing_table th,
    #listing_table td {
      text-align: center;
    }

    #listing_table th:nth-child(2),
    #listing_table td:nth-child(2) {
      text-align: right;
    }
    #listing_table th:nth-child(7),
    #listing_table td:nth-child(7) {
      display: none;
    }

    .invoice-inner {
      margin: 0 25px;
    }

    /* th#label_field5,
    #listing_table td:nth-child(5) {
      display: none;
    } */
    .qr-code img {
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
    #listing_table th:nth-child(2) {
      width: 16%;
    }
    #listing_table th:nth-child(3) {
      width: 33%;
    }
  </style>

  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <div id="items-list">{%items_list%}</div>

        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>
        <br />
      </div>
      <div style="display: none">
        <div id="discount">{%discount%}</div>
        <div id="item-discount">{%item-discount-total%}</div>
      </div>

      {%html_sticky_footer%}
    </div>
    <script>
      function hundleDiscount() {
        var allRows = document.querySelectorAll("#listing_table tr");
        if (allRows[0].cells.length == 8) {
          console.log("from Code");

          var newTh = document.createElement("th");
          newTh.innerText = "خصم";
          newTh.style.display = "none";
          allRows[0].insertBefore(newTh, allRows[0].cells[7]);
          for (var i = 1; i < allRows.length; i++) {
            var newTd = document.createElement("td");
            newTd.innerText = "0.00";
            newTd.style.display = "none";
            allRows[i].insertBefore(newTd, allRows[i].cells[7]);
          }
        }
      }
      try {
        hundleDiscount();
      } catch (error) {
        console.log(error);
      }
      function swapAll() {
        var allRows = document.querySelectorAll("#listing_table tr");
        for (var i = 0; i < allRows.length; i++) {
          var ser = allRows[i].cells[0].innerHTML;
          var itemCode = allRows[i].cells[1].innerHTML;
          var desc = allRows[i].cells[2].innerHTML;
          var carcap = allRows[i].cells[3].innerHTML;
          var ttlafter = allRows[i].cells[4].innerHTML;
          var qty = allRows[i].cells[5].innerHTML;
          var price = allRows[i].cells[6].innerHTML;
          var disc = allRows[i].cells[7].innerHTML;
          var subttl = allRows[i].cells[8].innerHTML;

          allRows[i].cells[0].innerHTM = ser;
          allRows[i].cells[1].innerHTML = itemCode;
          allRows[i].cells[2].innerHTML = desc;
          allRows[i].cells[3].innerHTML = carcap;
          allRows[i].cells[4].innerHTML = price;
          allRows[i].cells[5].innerHTML = qty;
          allRows[i].cells[6].innerHTML = disc;
          allRows[i].cells[7].innerHTML = subttl;
          allRows[i].cells[8].innerHTML = ttlafter;
        }
      }
      try {
        swapAll();
      } catch (error) {
        console.log(error);
      }
      function addCaronPriceCol() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerText = "سعر الكرتون";
        allRows[0].insertBefore(newTh, allRows[0].cells[7]);
        for (var i = 1; i < allRows.length; i++) {
          var newTd = document.createElement("td");

          if (allRows[i].cells[3].innerText.trim() != "") {
            var str = allRows[i].cells[3].innerText;
            var numbers = str.match(/\d+/g);
            var lenum = numbers.join().replace(",", "").replace(/,/g, "");

            var cartcap = parseFloat(lenum.replace(/,/g, ""));
            var isCAr = allRows[i].cells[5].innerText.indexOf("كرتون");
            if (isCAr != -1) {
              newTd.innerText = allRows[i].cells[4].innerText;

              allRows[i].cells[4].innerText = (
                parseFloat(allRows[i].cells[4].innerText) / cartcap
              )
                .toFixed(2)
                .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            } else {
              newTd.innerText = (
                cartcap * parseFloat(allRows[i].cells[4].innerText)
              )
                .toFixed(2)
                .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
          } else {
            var cartcap = 0;
            newTd.innerText = "-";
          }

          allRows[i].insertBefore(newTd, allRows[i].cells[7]);
        }
      }
      try {
        addCaronPriceCol();
      } catch (error) {
        console.log(error);
      }
      function splitListingTable() {
        var table = document.getElementById("listing_table");
        var tablerows = table.querySelectorAll("tbody tr");

        for (var i = 0; i < tablerows.length; i += 20) {
          var newTable = document.createElement("table");
          newTable.setAttribute("id", "listing_table");
          newTable.setAttribute("class", "listing-table total-table");
          newTable.setAttribute("width", "100%");
          var tablehead = table.querySelector("thead");

          newTable.appendChild(tablehead.cloneNode(true));
          var tablebody = document.createElement("tbody");
          for (var j = 0; j < 20; j++) {
            var k = i + j;
            if (k < tablerows.length) {
              var row = tablerows[k].cloneNode(true);
              tablebody.appendChild(row);
            }
          }
          newTable.appendChild(tablebody.cloneNode(true));
          document
            .querySelector("#items-list")
            .insertBefore(
              newTable,
              document.querySelector(".listing-table:nth-child(1)")
            );
        }
      }
      try {
        // splitListingTable();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
