<style>
  * {
    margin: 0;
    padding: 0;
  }
  body {
    background: transparent;
    font: 12px "Tahoma", Arial, Helvetica, sans-serif;
    direction: rtl;
    text-align: right;
  }
  .invoice-wrap {
    width: 660px;
    margin: 0 auto;
    background: #fff;
    color: #000;
  }
  .invoice-inner {
    margin: 0 30px;
    padding: 20px 0;
  }
  .invoice-address {
    border-top: 3px double #000000;
    margin: 35px 0;
    padding-top: 25px;
  }
  bold_title {
    font-weight: bold;
  }
  big_title {
    font-size: 18px;
    font-weight: 100;
  }
  .bussines-name {
    font-size: 18px;
    font-weight: 100;
  }
  .invoice-name {
    font-size: 22px;
    font-weight: 700;
  }
  .listing-table th {
    background-color: #e5e5e5;
    border-bottom: 1px solid #555555;
    border-top: 1px solid #555555;
    font-weight: bold;
    text-align: right;
    padding: 6px 4px;
  }
  .listing-table td {
    border-bottom: 1px solid #555555;
    text-align: right;
    padding: 5px 6px;
    vertical-align: top;
  }
  .total-table td {
    border-right: 1px solid #555555;
  }
  .total-row {
    background-color: #e5e5e5;
    border-bottom: 1px solid #555555;
    border-top: 1px solid #555555;
    font-weight: bold;
  }
  .row-items {
    margin: 5px 0;
    display: block;
  }
  .notes-block {
    margin: 50px 0 0 0;
  }

  tr,
  td,
  th {
    page-break-inside: avoid !important;
  }

  #business_info {
    line-height: 1.4;
  }
  #listing_table th:last-child,
  #listing_table td:last-child {
    border-left: 1px solid #555555;
  }
  #label_subtotal {
    width: 65px;
  }
  #label_field3,
  #label_field4 {
    width: 55px;
  }
  #items-list > table:nth-child(2) tr td:nth-child(1) {
    width: 60%;
  }
  #listing_table th,
  #listing_table td {
    text-align: center;
  }
  #listing_table th:nth-child(2),
  #listing_table td:nth-child(2) {
    text-align: right;
  }
  .invoice-inner {
    margin: 0 25px;
  }
  /* th#label_field5,
    #listing_table td:nth-child(5) {
      display: none;
    } */
  .qr-code img {
    margin-top: 10px;
  }
  #label_field3,
  #label_unit_price {
    width: 30px;
  }
  #listing_table td,
  #listing_table th {
    font-size: 11px;
  }
  #label_subtotal {
    width: 70px;
  }
  #items-list > table:nth-child(2) tr td:nth-child(2) {
    line-height: 1.3;
  }
  #logo {
    padding-left: 15px;
  }
  #invoice_title {
    font-size: 20px;
  }
  .purchase-header td:last-child {
    width: 35%;
  }

  #items-list > table:nth-child(2) tr td:nth-child(1) {
    width: 60%;
  }
  .sitelogo img {
    width: 150px;
  }
</style>
<div style="margin-top: -45px">
  <div style="padding-top: 40px"></div>
  <table
    class="purchase-header"
    width="100%"
    border="0"
    cellspacing="0"
    cellpadding="0"
  >
    <tr>
      <td align="right" valign="top" class="sitelogo">{%site_logo%}</td>
      <td align="right" valign="top">
        <div id="business_info" class="editable-area">{%business_info%}</div>
      </td>
      <td valign="top" align="left">
        <p id="invoice_title" class="editable-area invoice-name">
          {%invoice_title%}
        </p>
        <div class="qr-code">{%sa_qr_code_image%}<br /></div>
      </td>
    </tr>
  </table>

  <div class="invoice-address">
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
      <tr>
        <td width="50%" align="right" valign="top">
          <table border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td valign="top" style="float: right">
                <strong id="field1" class="editable-area">{%field1%}</strong>
              </td>
              <td style="padding-right: 20px" valign="top">
                <div id="client_info" class="editable-area">
                  {%client_info%}
                </div>
              </td>
            </tr>
            <tr id="shipping_options" style="display: none">
              <td valign="top" style="float: right">
                <br /><strong id="label_ship" class="editable-area"
                  >{%label_ship%}</strong
                >
              </td>
              <td style="padding-right: 20px" valign="top">
                <br />
                <div id="ship_info" class="editable-area">{%ship_info%}</div>
              </td>
            </tr>
          </table>
        </td>
        <td width="50%" valign="top" align="left">
          <table
            id="invoice_basics"
            border="0"
            cellspacing="0"
            cellpadding="0"
            align="left"
          >
            <tr style="height: 40px">
              <td align="left">
                <strong class="editable-area" id="label_invoice_no"
                  >{%label_invoice_no%}</strong
                >
              </td>
              <td style="padding-right: 20px" align="right">
                {%invoice_number%}
              </td>
            </tr>
            <!-- InvoiceDate -->
            <tr>
              <td align="left">
                <strong class="editable-area" id="label_date"
                  >{%label_date%}</strong
                >
              </td>
              <td style="padding-right: 20px" align="right">
                {%invoice_date%}
              </td>
            </tr>
            <!-- /InvoiceDate -->
          </table>
          <custom_field
            id="custom_fields"
            style="clear: both"
            class="editable-area"
            border="0"
            cellspacing="0"
            cellpadding="0"
            align="left"
          >
            {%custom_fields%}
          </custom_field>
        </td>
      </tr>
    </table>
  </div>
</div>
