        `;
        }
        $("#pdf_button").attr("href", "#").attr("id", "download-btn");
        document
          .getElementById("download-btn")
          .addEventListener("click", function () {
            const content = document.getElementById("trip_data");
            if (!content) {
              console.error("Content div not found!");
              return;
            }

            const { jsPDF } = window.jspdf;

            // Create a new jsPDF instance
            const doc = new jsPDF({
              orientation: "portrait",
              unit: "mm",
              format: "a4",
              putOnlyUsedFonts: true,
              floatPrecision: 16,
            });

            // Use html2canvas to render the content with a higher scale
            html2canvas(content, { scale: 2, useCORS: true })
              .then((canvas) => {
                const imgData = canvas.toDataURL("image/png");
                const imgWidth = 210;
                const pageHeight = doc.internal.pageSize.height;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;

                let position = 0;

                // Add the image to the PDF
                doc.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                // If the image height is greater than the page height, add a new page
                while (heightLeft >= 0) {
                  position = heightLeft - imgHeight;
                  doc.addPage();
                  doc.addImage(
                    imgData,
                    "PNG",
                    0,
                    position,
                    imgWidth,
                    imgHeight
                  );
                  heightLeft -= pageHeight;
                }

                doc.save("trip_information.pdf");
              })
              .catch((error) => {

              });

    </style>`;
