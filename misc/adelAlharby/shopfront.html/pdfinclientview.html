<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Data PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <style>
      #trip_data {
        background-color: transparent;
        background-image: url(https://durobalhijrah.daftra.com/files/d5e2718e/logos/66c5c9712c158_blobid1724238189593.jpg);
        background-size: contain;
        background-blend-mode: color-burn;
        padding: 20px;
        border-radius: 8px;
        width: 21cm;
        height: 27.9cm;
        margin: auto;
        font-family: "Rubik", sans-serif;
      }
      #trip_data,
      #trip_data * {
        direction: rtl;
      }
      #trip_data table,
      #trip_data th,
      #trip_data td {
        border-left: none !important;
        border-right: none !important;
        border-top: none !important;
        border-bottom: none !important;
        text-align: center !important;
        font-size: 13px !important;
        font-weight: bold;
      }
      #trip_data table {
        border-spacing: 10px 5px !important;
        border-collapse: separate !important;
      }
      #trip_data th {
        background-color: #054ba6;
        color: #fff !important;
      }
      #trip_data td {
        background-color: #f1f1f1;
      }
      #trip_data th,
      #trip_data td {
        padding: 5px 5px !important;
      }
      #trip_header {
        width: 100%;
      }
      .table_title {
        text-align: center;
        font-weight: bold;
        font-size: 13px;
        padding: 7px;
        background-color: transparent !important;
      }
      #trip_header td {
        background-color: transparent !important;
      }
      #trip_header td:nth-child(1) {
        color: red;
        vertical-align: sub;
        width: 25%;
        font-size: 15px !important;
      }
      #trip_header td:nth-child(2) {
        text-align: center;
        width: 50%;
      }
      #trip_header td:nth-child(3) {
        width: 25%;
      }
      .NusuK,
      .Hotels {
        width: 70% !important;
        margin: 0 15% !important;
      }
      .clientTh {
        width: 25%;
      }
      .vehicletype,
      .airfrom {
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <div id="trip_data"></div>

    <button id="download-btn">Download PDF</button>

    <script>

      const tripId = window.location.href.split("/")[6];
      fetch(`/v2/api/entity/le_workflow-type-entity-4/${tripId}/4`, {
        method: "GET",
        headers: {
          apikey: "bceffccefa6ab4014732bb7093d284bc37794bf4",
          Accept: "application/json",
          "Content-Type": "application/json",
        },
      })
        .then((response) => response.json())
        .then((data) => {
          console.log("Response:", data);
          renderTripData(data);
        })
        .catch((error) => {
          console.error("Error:", error);
        });
      function renderTripData(data) {
        const tripContainer = document.getElementById("trip_data");
        tripContainer.innerHTML = `
            <table id="trip_header">
                <tr>
                    <td>No: ${data.number}</td>
                    <td><img alt="" src="https://durobalhijrah.daftra.com/files/d5e2718e/logos/66c5c9712c158_blobid1724238189593.jpg" style="width:150px"></td>
                    <td></td>
                </tr>
            </table>
            <div class="table_title">بيانات الرحلة Trip Info</div>
            <table id="TripInfo">
                <thead>
                    <tr>
                        <th>نوع المركبة<br>Type of vehicles</th>
                        <th>مسمى التشغيلة<br>Trip Title</th>
                        <th>رقم المشرف<br>Group leader No</th>
                        <th>المشرف<br>Group leader</th>
                        <th>الجنسية<br>Nationality</th>
                        <th class="clientTh">الوكيل<br>Agent</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${
                          data["le_workflow-type-entity-4_custom_data"]
                            .vehicle_type
                        }</td>
                        <td>${data.title}</td>
                        <td>${
                          data["le_workflow-type-entity-4_custom_data"]
                            .leader_no
                        }</td>
                        <td>${
                          data["le_workflow-type-entity-4_custom_data"]
                            .leader_name
                        }</td>
                        <td>${
                          data["le_workflow-type-entity-4_custom_data"]
                            .nationality
                        }</td>
                        <td>${data.work_order_client.business_name}</td>
                    </tr>
                </tbody>
            </table>
            <div class="table_title">بيانات نسك Nusuk Info</div>
            <table class="NusuK">
                <thead>
                    <tr>
                        <th>عدد المسافرين</th>
                        <th>رقم المجموعة</th>
                    </tr>
                </thead>
                <tbody>
                    ${data["le_workflow-type-entity-4_custom_data"][
                      "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_nusuks"
                    ]
                      .map(
                        (nusuk) => `
                        <tr>
                            <td>${nusuk.passengers_no}</td>
                            <td>${nusuk.nusuk_no}</td>
                        </tr>
                    `
                      )
                      .join("")}
                </tbody>
            </table>
            <div class="table_title">الطيران Flights</div>
            <table class="flights" style="width:100%">
                <thead>
                    <tr>
                        <th>الوقت<br>Time</th>
                        <th>التاريخ<br>Date</th>
                        <th>إلى<br>To</th>
                        <th>من<br>From</th>
                        <th>رقم الرحلة<br>Flight No</th>
                        <th>شركة الطيران<br>Airline Co</th>
                    </tr>
                </thead>
                <tbody>
                    ${data["le_workflow-type-entity-4_custom_data"][
                      "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_flys"
                    ]
                      .map(
                        (flight) => `
                        <tr>
                            <td>${flight.etd}</td>
                            <td>${flight.date}</td>
                            <td>${flight.to}</td>
                            <td>${flight.from}</td>
                            <td>${flight.flight_no}</td>
                            <td>${flight.flight_com}</td>
                        </tr>
                    `
                      )
                      .join("")}
                </tbody>
            </table>
            <div class="table_title">الفنادق Hotels</div>
            <table class="Hotels">
                <thead>
                    <tr>
                        <th>الفندق HOTEL</th>
                        <th>المدينة CITY</th>
                    </tr>
                </thead>
                <tbody>
                    ${data["le_workflow-type-entity-4_custom_data"][
                      "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_hotels"
                    ]
                      .map(
                        (hotel) => `
                        <tr>
                            <td>${hotel.hotel}</td>
                            <td>${hotel.city}</td>
                        </tr>
                    `
                      )
                      .join("")}
                </tbody>
            </table>


            <div class="table_title">الفنادق Hotels</div>
            <table style="width:100%">
                <thead>
                    <tr>
                  <th>  الوقت TIME</th>
                  <th>التاريخ DATE</th>
                  <th> إلى TO</th>
                  <th>  من FROM</th>
                  <th>   مسار route</th>
                    </tr>
                </thead>
                <tbody>
                    ${data["le_workflow-type-entity-4_custom_data"][
                      "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_transportations"
                    ]
                      .map(
                        (transport, index) => `
                        <tr>
                            <td>${transport.time}</td>
                            <td>${transport.date}</td>
                            <td>${transport.to}</td>
                            <td>${transport.from}</td>
                            <td>${index + 1}</td>
                        </tr>
                    `
                      )
                      .join("")}
                </tbody>
            </table>  
        `;
      }

      document
        .getElementById("download-btn")
        .addEventListener("click", function () {
          const content = document.getElementById("trip_data");
          if (!content) {
            console.error("Content div not found!");
            return;
          }

          const { jsPDF } = window.jspdf;

          // Create a new jsPDF instance
          const doc = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4",
            putOnlyUsedFonts: true,
            floatPrecision: 16,
          });

          // Use html2canvas to render the content with a higher scale
          html2canvas(content, { scale: 2 })
            .then((canvas) => {
              const imgData = canvas.toDataURL("image/png");

              // Calculate the dimensions for the PDF
              const imgWidth = 210; // A4 width in mm
              const pageHeight = doc.internal.pageSize.height;
              const imgHeight = (canvas.height * imgWidth) / canvas.width;
              let heightLeft = imgHeight;

              let position = 0;

              // Add the image to the PDF
              doc.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
              heightLeft -= pageHeight;

              // If the image height is greater than the page height, add a new page
              while (heightLeft >= 0) {
                position = heightLeft - imgHeight;
                doc.addPage();
                doc.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
              }

              doc.save("trip_information.pdf");
            })
            .catch((error) => {
              console.error("Error generating PDF: ", error);
            });
        });
    </script>
  </body>
</html>
