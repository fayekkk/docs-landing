  <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
  <html xmlns="http://www.w3.org/1999/xhtml">
    <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
      <title>Invoice Template</title>
    </head>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: transparent;
        font: 12px "Tahoma", Arial, Helvetica, sans-serif;
        direction: rtl;
        text-align: right;
      }
      .invoice-wrap {
        width: 660px;
        margin: 0 auto;
        background: #fff;
        color: #000;
      }
      .invoice-inner {
        margin: 0 30px;
        padding: 20px 0;
      }
      .invoice-address {
        border-top: 3px double #000000;
        margin: 35px 0;
        padding-top: 25px;
      }
      bold_title {
        font-weight: bold;
      }
      big_title {
        font-size: 18px;
        font-weight: 100;
      }
      .bussines-name {
        font-size: 18px;
        font-weight: 100;
      }
      .invoice-name {
        font-size: 18px !important;
        font-weight: 700;
      }
      .listing-table th {
        background-color: #e5e5e5;
        border-bottom: 1px solid #555555;
        border-top: 1px solid #555555;
        font-weight: bold;
        text-align: right;
        padding: 6px 4px;
      }
      .listing-table td {
        border-bottom: 1px solid #555555;
        text-align: right;
        padding: 5px 6px;
        vertical-align: top;
      }
      .total-table td {
        border-right: 1px solid #555555;
      }
      .total-row {
        background-color: #e5e5e5;
        border-bottom: 1px solid #555555;
        border-top: 1px solid #555555;
        font-weight: bold;
      }
      .row-items {
        margin: 5px 0;
        display: block;
      }
      .notes-block {
        /* margin: 50px 0 0 0; */
      }

      tr,
      td,
      th {
        page-break-inside: avoid !important;
      }
      .qr-code img {
        margin-top: 10px;
      }
      #listing_table th:nth-child(10),
      #listing_table td:nth-child(10) {
        display: none !important;
      }
      #listing_table th:nth-child(11),
      #listing_table td:nth-child(11) {
        width: 10%;
      }
      #listing_table th:nth-child(12),
      #listing_table td:nth-child(12) {
        width: 10%;
      }
      #listing_table th:nth-child(3),
      #listing_table th:nth-child(4),
      #listing_table th:nth-child(5),
      #listing_table th:nth-child(6),
      #listing_table th:nth-child(7),
      #listing_table th:nth-child(8),
      #listing_table th:nth-child(9)
      {
        width: 50px !important;
      }
      #listing_table th,
      #listing_table td {
        font-size: 10px !important;
      }
    </style>
    <body>
      <div class="invoice-wrap">
        {%html_sticky_header%}
        <div class="invoice-inner">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td align="right" valign="top">
                <img
                  id="logo"
                  class="editable-area"
                  src="{%logo%}"
                  width="{%logo-width%}"
                  height="{%logo-height%}"
                />
              </td>
              <td align="right" valign="top">
                <div id="business_info" class="editable-area">
                  {%business_info%}
                </div>
              </td>
              <td valign="top" align="left">
                <p id="invoice_title" class="editable-area invoice-name">
                  {%invoice_title%}
                </p>
                <div class="qr-code"><!--qr_code--></div>
              </td>
            </tr>
          </table>

          <div class="invoice-address">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td width="50%" align="right" valign="top">
                  <table border="0" cellspacing="0" cellpadding="0">
                    <tr>
                      <td valign="top" style="float: right">
                        <strong id="field1" class="editable-area"
                          >{%field1%}</strong
                        >
                      </td>
                      <td style="padding-right: 20px" valign="top">
                        <div id="client_info" class="editable-area">
                          {%client_info%}
                        </div>
                      </td>
                    </tr>
                    <tr id="shipping_options" style="display: none">
                      <td valign="top" style="float: right">
                        <br /><strong id="label_ship" class="editable-area"
                          >{%label_ship%}</strong
                        >
                      </td>
                      <td style="padding-right: 20px" valign="top">
                        <br />
                        <div id="ship_info" class="editable-area">
                          {%ship_info%}
                        </div>
                      </td>
                    </tr>
                  </table>
                </td>
                <td width="50%" valign="top" align="left">
                  <table
                    id="invoice_basics"
                    border="0"
                    cellspacing="0"
                    cellpadding="0"
                    align="left"
                  >
                    <tr>
                      <td align="left">
                        <strong class="editable-area" id="label_invoice_no"
                          >{%label_invoice_no%}</strong
                        >
                      </td>
                      <td style="padding-right: 20px" align="right">
                        {%invoice_number%}
                      </td>
                    </tr>
                    <!-- InvoiceDate -->
                    <tr>
                      <td align="left">
                        <strong class="editable-area" id="label_date"
                          >{%label_date%}</strong
                        >
                      </td>
                      <td style="padding-right: 20px" align="right">
                        {%invoice_date%}
                      </td>
                    </tr>
                    <!-- /InvoiceDate -->
                  </table>
                  <custom_field
                    id="custom_fields"
                    style="clear: both"
                    class="editable-area"
                    border="0"
                    cellspacing="0"
                    cellpadding="0"
                    align="left"
                  >
                    {%custom_fields%}
                  </custom_field>
                </td>
              </tr>
            </table>
          </div>

          <div id="items-list">{%items_list%}</div>

          <div class="notes-block">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td>
                  <div
                    style="font-style: italic"
                    class="editable-area"
                    id="footer"
                  >
                    {%footer%}
                  </div>
                </td>
              </tr>
            </table>
          </div>
          <br />
        </div>
        {%html_sticky_footer%}
      </div>
      <script>
        function addNewCols() {
          var allRows = document.querySelectorAll("#listing_table tr");
          var newTh1 = document.createElement("th");
          var newTh2 = document.createElement("th");
          var newTh3 = document.createElement("th");
          var newTh4 = document.createElement("th");
          var newTh5 = document.createElement("th");
          newTh1.innerText = "وزن الاحجار";
          newTh2.innerText = "الشهادة";
          newTh3.innerText = "نوع القصه";
          newTh4.innerText = "النظافة";
          newTh5.innerText = "اللون";
          allRows[0].insertBefore(newTh1, allRows[0].cells[4]);
          allRows[0].insertBefore(newTh2, allRows[0].cells[5]);
          allRows[0].insertBefore(newTh3, allRows[0].cells[6]);
          allRows[0].insertBefore(newTh4, allRows[0].cells[7]);
          allRows[0].insertBefore(newTh5, allRows[0].cells[8]);

          for (var i = 1; i < allRows.length; i++) {
            var newTd1 = document.createElement("td");
            var newTd2 = document.createElement("td");
            var newTd3 = document.createElement("td");
            var newTd4 = document.createElement("td");
            var newTd5 = document.createElement("td");

            var textareaValue = allRows[i].cells[4].innerText;
            try {
              var parsedValue = JSON.parse(textareaValue);
              if (typeof parsedValue === "object") {
                const correctedObject = {
                  lateValue1: parsedValue.lateValue1,
                  lateValue2: parsedValue.lateValue2,
                  // lateValue2: parsedValue.lateValue2.slice(0, -1),
                  lateValue3: parsedValue.lateValue3,
                  // lateValue3: parsedValue.lateValue3.slice(0, -1),
                  lateValue4: parsedValue.lateValue4,
                  // lateValue4: parsedValue.lateValue4.slice(0, -1),
                  lateValue5: parsedValue.lateValue5,
                  // lateValue5: parsedValue.lateValue5.slice(0, -1),
                };
                newTd1.innerText = correctedObject.lateValue1;
                newTd2.innerText = correctedObject.lateValue2;
                newTd3.innerText = correctedObject.lateValue3;
                newTd4.innerText = correctedObject.lateValue4;
                newTd5.innerText = correctedObject.lateValue5;
              } else {
                console.log("not an object type");
              }
            } catch (error) {
              console.log("not an object");
            }

            allRows[i].insertBefore(newTd1, allRows[i].cells[4]);
            allRows[i].insertBefore(newTd2, allRows[i].cells[5]);
            allRows[i].insertBefore(newTd3, allRows[i].cells[6]);
            allRows[i].insertBefore(newTd4, allRows[i].cells[7]);
            allRows[i].insertBefore(newTd5, allRows[i].cells[8]);
          }
        }
        try {
          addNewCols();
        } catch (error) {
          console.log(error);
        }
        function hidecols() {
          // 2 8
          var allRows = document.querySelectorAll("#listing_table tr");
          var flags2 = 0;
          var flags3 = 0;
          var flags4 = 0;
          var flags5 = 0;
          var flags6 = 0;
          var flags7 = 0;
          var flags8 = 0;

          for (var i = 1; i < allRows.length; i++) {
            if (allRows[i].cells[2].innerText.trim() == "") {
              flags2 = 1;
            }
            if (allRows[i].cells[3].innerText.trim() == "") {
              flags3 = 1;
            }
            if (allRows[i].cells[4].innerText.trim() == "") {
              flags4 = 1;
            }
            if (allRows[i].cells[5].innerText.trim() == "") {
              flags5 = 1;
            }
            if (allRows[i].cells[6].innerText.trim() == "") {
              flags6 = 1;
            }
            if (allRows[i].cells[7].innerText.trim() == "") {
              flags7 = 1;
            }
            if (allRows[i].cells[8].innerText.trim() == "") {
              flags8 = 1;
            }
          }
          for (var i = 0; i < allRows.length; i++) {
            if (flags2 == 1) {
              allRows[i].cells[2].style.display = "none";
            }
            if (flags3 == 1) {
              allRows[i].cells[3].style.display = "none";
            }
            if (flags4 == 1) {
              allRows[i].cells[4].style.display = "none";
            }
            if (flags5 == 1) {
              allRows[i].cells[5].style.display = "none";
            }
            if (flags6 == 1) {
              allRows[i].cells[6].style.display = "none";
            }
            if (flags7 == 1) {
              allRows[i].cells[7].style.display = "none";
            }
            if (flags8 == 1) {
              allRows[i].cells[8].style.display = "none";
            }
          }
        }
        try {   
          hidecols();
        } catch (error) {
          console.log(error);
        }
      </script>
    </body>
  </html>
