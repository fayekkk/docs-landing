<style>
  p {
    padding: 0 !important;
    margin: 0 !important;
  }
  *,
  #barcode_template,
  #barcode_template * {
    margin: 0 !important;
    padding: 0 !important;
  }
</style>
<div
  id="barcode_template"
  class="mceEditable"
  readonly="readonly"
  style="
    padding: 0px 0px 0px 0px;
    margin: 0px auto;
    background-color: #ffffff;
    margin-bottom: 0px;
  "
>
  <p style="text-align: center">
    <span style="font-family: 'arial black', sans-serif"
      ><img
        src="https://ardaljwal.daftra.com/files/9519625c/product/676301b17e799_blobid1734541741998.png"
        alt=""
        title="ارض الجوال باركود.PNG"
        width="102"
        height="18"
        style="
          display: block;
          margin-left: auto !important;
          margin-right: auto !important;
        " /><span style="font-size: 5pt"
        ><span class="mceNonEditable" style="line-height: 1"
          >{%product_name%}</span
        ><img
          id="barcode_image"
          src="https://ardaljwal.daftra.com/img/dummy_barcode.jpg"
          style="width: 90%"
          height="20" /></span
    ></span>
  </p>
  <p style="text-align: center">
    <span style="font-family: 'arial black', sans-serif"
      ><span style="font-size: 5pt"
        ><span style="font-size: 4pt"
          ><span class="mceNonEditable">{%product_barcode_number%} -- </span
          ><span style="font-size: 8pt"
            ><span class="mceNonEditable"
              >{%product_unit_price_with_tax%}<strong
              ></strong> </span></span></span
      ></span>
    </span>
  </p>
</div>
