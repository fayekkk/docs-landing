<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }
    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: transparent;
      color: #000;
    }
    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }
    .invoice-address {
      border-top: 3px double #000000;
      margin: 35px 0;
      padding-top: 25px;
    }
    bold_title {
      font-weight: bold;
    }
    big_title {
      font-size: 18px;
      font-weight: 100;
    }
    .bussines-name {
      font-size: 18px;
      font-weight: 100;
    }
    .invoice-name {
      font-size: 22px;
      font-weight: 700;
    }
    .listing-table th {
      background-color: transparent;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }
    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }
    .total-table td {
      border-right: 1px solid #555555;
    }
    .total-row {
      background-color: transparent;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }
    .row-items {
      margin: 5px 0;
      display: block;
    }
    .notes-block {
      margin: 50px 0 0 0;
    }

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }

    #business_info {
      line-height: 1.4;
    }
    #listing_table th:last-child,
    #listing_table td:last-child {
      border-left: 1px solid #555555;
    }
    #label_subtotal {
      width: 65px;
    }
    #label_field3,
    #label_field4 {
      width: 55px;
    }
    #items-list > table:nth-child(2) tr td:nth-child(1) {
      width: 60%;
    }
    #listing_table th,
    #listing_table td {
      text-align: center;
    }
    #listing_table th:nth-child(2),
    #listing_table td:nth-child(2) {
      text-align: right;
    }
    .invoice-inner {
      margin: 0 25px;
    }
    .qr-code img {
      margin-top: 10px;
    }
    #label_field3,
    #label_unit_price {
      width: 30px;
    }
    #listing_table td,
    #listing_table th {
      font-size: 11px;
    }
    #label_subtotal {
      width: 70px;
    }
    #items-list > table:nth-child(2) tr td:nth-child(2) {
      line-height: 1.3;
    }
    #logo {
      padding-left: 15px;
    }
    #invoice_title {
      font-size: 20px;
    }
    .purchase-header td:last-child {
      width: 35%;
    }

    #items-list > table:nth-child(2) tr td:nth-child(1) {
      width: 60%;
    }
    /* .hidden {
      display: none;
    } */
    .invoice-inner * {
      background-color: transparent;
    }
    .bg {
      background-image: url("https://resthotels.daftara.com/files/4b76049d/logos/6783c8d54fa46_blobid1736689875225.gif");
      z-index: -90000;
      position: absolute;
      left: 0px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      width: 100%;
      height: 21.5cm;
    }
    #invoice_basics {
      white-space: normal !important;
      width: 100% !important;
    }
    #invoice_basics * {
      white-space: normal !important;
    }
    #invoice_basics td:nth-child(1) {
      width: 40% !important;
      text-align: center !important;
    }

    #invoice_basics td:nth-child(2) {
      width: 60% !important;
      text-align: right !important;
    }
  </style>
  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="bg"></div>
      <div class="invoice-inner">
        <table
          class="purchase-header"
          width="100%"
          border="0"
          cellspacing="0"
          cellpadding="0"
        >
          <tr>
            <td width="50%" align="right" valign="top">
              <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td valign="top" style="float: right; width: 35%">
                    <strong id="field1" class="editable-area"
                      >{%field1%}</strong
                    >
                  </td>
                  <td style="padding-right: 20px; width: 65%" valign="top">
                    <div id="client_info" class="editable-area">
                      {%client_info%}
                    </div>
                  </td>
                </tr>
                <tr id="shipping_options" style="display: none">
                  <td valign="top" style="float: right">
                    <br /><strong id="label_ship" class="editable-area"
                      >{%label_ship%}</strong
                    >
                  </td>
                  <td style="padding-right: 20px" valign="top">
                    <br />
                    <div id="ship_info" class="editable-area">
                      {%ship_info%}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
            <td width="50%" valign="top" align="left">
              <table
                id="invoice_basics"
                border="0"
                cellspacing="0"
                cellpadding="0"
                align="left"
              >
                <tr style="height: 40px">
                  <td align="left">
                    <strong class="editable-area" id="label_invoice_no"
                      >{%label_invoice_no%}</strong
                    >
                  </td>
                  <td style="padding-right: 20px" align="right">
                    {%invoice_number%}
                  </td>
                </tr>
                <!-- InvoiceDate -->
                <tr>
                  <td align="left">
                    <strong class="editable-area" id="label_date"
                      >{%label_date%}</strong
                    >
                  </td>
                  <td style="padding-right: 20px" align="right">
                    {%invoice_date%}
                  </td>
                </tr>
                <!-- /InvoiceDate -->
              </table>
              <custom_field
                id="custom_fields"
                style="clear: both"
                class="editable-area"
                border="0"
                cellspacing="0"
                cellpadding="0"
                align="left"
              >
                {%custom_fields%}
              </custom_field>
            </td>
            <td valign="top" align="left">
              <p id="invoice_title" class="editable-area invoice-name">
                {%invoice_title%}
              </p>
              <div class="qr-code">{%sa_qr_code_image%}<br /></div>
            </td>
          </tr>
        </table>

        <!-- <div class="invoice-address">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
          
            </tr>
          </table>
        </div> -->

        <div id="items-list">{%items_list%}</div>

        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>
        <div style="display: none">
          <div id="discount">{%discount%}</div>
          <div id="item-discount">{%item-discount-total%}</div>
        </div>
      </div>
      {%html_sticky_footer%}
    </div>
    <script>
      var currency = "";
      function detectCurrency() {
        var unitPrice = document.querySelector(
          "#listing_table tr td:nth-child(6)"
        );
        var price = unitPrice.innerText;
        if (price.indexOf("ر.س") > -1) {
          currency = " ر.س";
        } else if (price.indexOf("SR") > -1) {
          currency = " SR";
        }
      }

      function addThousandSeparator(num) {
        var parts = num.toString().split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return parts.join(".");
      }

      function hasDiscount() {
        var discountValue = document
          .getElementById("discount")
          .innerText.replace(/[^\d]/g, "");
        var itemDiscount = document
          .getElementById("item-discount")
          .innerText.replace(/[^\d]/g, "");
        var hasInvoiceDiscount = false;
        var hasItemDiscount = false;
        if (parseFloat(itemDiscount) != 0) {
          hasItemDiscount = true;
        }

        if (parseFloat(discountValue) != 0) {
          hasInvoiceDiscount = true;
        }

        return {
          invoiceDiscount: hasInvoiceDiscount,
          itemDiscount: hasItemDiscount,
        };
      }
      function isLabelUnitPriceAfterLabelQuantity() {
        var ths = document.getElementsByTagName("th");
        var label_unit_price, label_quantity;

        for (var i = 0; i < ths.length; i++) {
          if (ths[i].id == "label_unit_price") {
            label_unit_price = ths[i];
          } else if (ths[i].id == "label_quantity") {
            label_quantity = ths[i];
          }
        }

        if (label_unit_price && label_quantity) {
          var currentElement = label_quantity;
          while ((currentElement = currentElement.nextSibling)) {
            if (currentElement == label_unit_price) {
              return true;
            }
          }
        }
        return false;
      }
      function insertCol(index, colLabel, labelId, cellClass) {
        var tbl = document.getElementById("listing_table");

        for (i = 0; i < tbl.rows.length; i++) {
          var newCell = tbl.rows[i].insertCell(index);
          newCell.classList.add(cellClass);

          //  newCell.innerText = parseFloat(tax[i].innerText.replace(/,/g, "")) + parseFloat(total[i].innerText.replace(/,/g, ""))
        }
        var firstCell = tbl.rows[0].cells[index];
        firstCell.outerHTML = "<th id=" + labelId + ">" + colLabel + "</th>";
        // firstCell.id = labelId
        firstCell.style.cssText =
          "border-top:1px solid #000;font-weight:bold;text-align:center;background:#e5e5e5";
      }

      function swap(in1, in2, table_id) {
        var table = document.getElementById(table_id);
        for (var i = 0, row; (row = table.rows[i]); i++) {
          var cell1 = row.cells[in1];
          var cell2 = row.cells[in2];

          // Swap innerHTML
          var tempHTML = cell1.innerHTML;
          cell1.innerHTML = cell2.innerHTML;
          cell2.innerHTML = tempHTML;

          // Swap id
          var tempId = cell1.id;
          cell1.id = cell2.id;
          cell2.id = tempId;

          // Swap class
          var tempClass = cell1.className;
          cell1.className = cell2.className;
          cell2.className = tempClass;
        }
      }

      function resetColumnsClass(column_id, table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        var columnIndex = -1;
        for (var i = 0; i < thElements.length; i++) {
          if (thElements[i].id === column_id) {
            columnIndex = i;
            break;
          }
        }

        if (columnIndex !== -1) {
          for (var j = 1, row; (row = table.rows[j]); j++) {
            var cell = row.cells[columnIndex];
            if (cell) {
              cell.className = column_id;
            }
          }
        } else {
          console.log("Column with id " + column_id + " not found.");
        }
      }

      function resetTableColumns(table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        for (var i = 0; i < thElements.length; i++) {
          var thId = thElements[i].id;
          resetColumnsClass(thId, table_id);
        }
      }
      function handleDuplicateThIds(table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        var idTracker = {};

        for (var i = 0; i < thElements.length; i++) {
          var th = thElements[i];
          var thId = th.id;

          if (idTracker[thId]) {
            idTracker[thId].id = "discount-cell";
          } else {
            idTracker[thId] = th;
          }
        }
      }

      function calcInvoiceColumns() {
        var price = document.querySelectorAll(".label_unit_price");
        var qty = document.querySelectorAll(".label_quantity");
        var subTotal = document.querySelectorAll(".label_subtotal");
        var discColumn = document.querySelectorAll(".discount_th");
        if (!discColumn.length) {
          discColumn = document.querySelectorAll(".discount-cell");
        }
        var vatPercent = document.querySelectorAll(".label_field3");
        var vatCol = document.querySelectorAll(".label_field4");
        var total = document.querySelectorAll(".label_field5");

        var discountTotal = parseFloat(
          document.getElementById("discount").innerText.replace(/,/g, "")
        );
        if (isNaN(discountTotal)) {
          discountTotal = 0;
        }

        var sumSubtotal = 0;
        var sumItemsPrice = 0;
        var remaining = 1;
        var discountPercent = 0;

        for (var i = 0; i < subTotal.length; i++) {
          sumSubtotal += parseFloat(subTotal[i].innerText.replace(/,/g, ""));
          sumItemsPrice +=
            parseFloat(price[i].innerText.replace(/,/g, "")) *
            parseFloat(qty[i].innerText.replace(/,/g, ""));
        }

        if (discountTotal != 0) {
          discountPercent = discountTotal / sumSubtotal;
          remaining = 1 - discountPercent;
        }

        for (var i = 0; i < subTotal.length; i++) {
          var currentUnitPrice = parseFloat(
            price[i].innerText.replace(/,/g, "")
          );
          var itemQty = parseFloat(qty[i].innerText.replace(/,/g, ""));
          var discountInRow = 0;
          if (discColumn[i].innerText.indexOf("%") > -1) {
            discountInRow =
              (parseFloat(
                discColumn[i].innerText.replace("%", "").replace(/,/g, "")
              ) /
                100) *
              currentUnitPrice;
            console.log("discountInRow " + i);
            console.log(discountInRow);
          } else {
            discountInRow = parseFloat(
              discColumn[i].innerText.replace(/,/g, "")
            );
          }
          if (isNaN(discountInRow)) {
            discountInRow = 0;
          }

          var rowTotal = parseFloat(total[i].innerText.replace(/,/g, ""));

          var hasTax = true;

          var TaxPercentage = parseFloat(
            vatPercent[i].innerText.replace("%", "")
          );

          if (!parseInt(TaxPercentage)) {
            hasTax = false;
          }

          var newTotal = (
            parseFloat(total[i].innerText.replace(/,/g, "")) / remaining
          ).toFixed(2);

          var checkIfTaxIsInclusive =
            newTotal ==
              parseFloat(subTotal[i].innerText.replace(/,/g, "")).toFixed(2) ||
            Math.abs(
              newTotal -
                parseFloat(subTotal[i].innerText.replace(/,/g, "")).toFixed(2)
            ) <= 0.1;
          var itemSharePercent = (currentUnitPrice * itemQty) / sumItemsPrice;
          var itemDiscountShareAmount = discountTotal * itemSharePercent;
          console.log("itemDiscountShareAmount " + i);
          console.log(itemDiscountShareAmount);
          var itemTotalDiscount =
            discountInRow + itemDiscountShareAmount / itemQty;
          discColumn[i].innerText = itemTotalDiscount.toFixed(3);
          subTotal[i].innerText = (
            parseFloat(total[i].innerText.replace(/,/g, "")) -
            parseFloat(vatCol[i].innerText.replace(/,/g, ""))
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");

          if (!!checkIfTaxIsInclusive) {
            price[i].innerText = (
              parseFloat(subTotal[i].innerText.replace(/,/g, "")) / itemQty +
              itemTotalDiscount
            )
              .toFixed(3)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          }
        }
      }

      try {
        detectCurrency();

        var mainTable = document.getElementById("listing_table");
        var colCount = mainTable.rows[0].cells;
        var PriceQuantityPlace = isLabelUnitPriceAfterLabelQuantity();
        handleDuplicateThIds("listing_table");
        if (colCount.length == 9) {
          insertCol(7, "Discount<br>خصومات", "discount_th", "discounts");
          // swap(2, 5, "listing_table");
          // swap(3, 6, "listing_table");
          // swap(4, 8, "listing_table");
          // swap(5, 7, "listing_table");
          // swap(6, 7, "listing_table");
          // swap(4, 5, "listing_table");
        } else {
          // swap(2, 5, "listing_table");
          // swap(3, 6, "listing_table");
          // swap(4, 8, "listing_table");
          // swap(5, 7, "listing_table");
          // swap(6, 7, "listing_table");
          // swap(4, 5, "listing_table");
        }

        resetTableColumns("listing_table");
        var hasInvoiceDiscount = hasDiscount();
        calcInvoiceColumns();
        // var sharedDiscount = calcSubtotalInc(PriceQuantityPlace);
        // if (hasInvoiceDiscount.invoiceDiscount) {
        //   console.log('has discount')
        //   calcDisCol(PriceQuantityPlace, sharedDiscount);
        // }

        if (
          !hasInvoiceDiscount.invoiceDiscount &&
          !hasInvoiceDiscount.itemDiscount
        ) {
          var mainTable = document.getElementById("listing_table");
          for (var i = 0; i < mainTable.rows.length; i++) {
            var tableCell = mainTable.rows[i].cells[4];
            tableCell.classList.add("hidden");
          }
        }
      } catch (err) {
        console.log(err);
      }
      function repeatBg() {
        console.log("2");
        var invoiceHeight =
          document.querySelector(".invoice-inner").offsetHeight;
        console.log(invoiceHeight);
        var pageHeight = document.querySelector(".bg").offsetHeight;
        console.log(pageHeight);
        var numPages = Math.ceil(invoiceHeight / pageHeight);
        console.log(numPages);
        var bg = document.querySelector(".bg");
        var topDis = parseFloat(bg.style.top.replace("cm", ""));
        for (var i = 1; i < numPages; i++) {
          var newBg = document.createElement("div");
          newBg.setAttribute("class", "bg");
          topDis += 21.5;
          newBg.style.top = topDis + "cm";
          bg.parentNode.insertBefore(newBg, bg.nextSibling);
          console.log("3");
        }
      }
      try {
        repeatBg();
      } catch (error) {
        console.log(error);
      }
      function ReswapAll() {
        var allRows = document.querySelectorAll("#listing_table tr");
        for (var i = 0; i < allRows.length; i++) {
          var band = allRows[i].cells[0].innerHTML;
          var desc = allRows[i].cells[1].innerHTML;
          var ItemCode = allRows[i].cells[2].innerHTML;
          var vatVal = allRows[i].cells[3].innerHTML;
          var ttl = allRows[i].cells[4].innerHTML;
          var qty = allRows[i].cells[5].innerHTML;
          var price = allRows[i].cells[6].innerHTML;
          var disc = allRows[i].cells[7].innerHTML;
          var vatper = allRows[i].cells[8].innerHTML;
          var subttl = allRows[i].cells[9].innerHTML;
          allRows[i].cells[0].innerHTML = ItemCode;
          allRows[i].cells[1].innerHTML = band;
          allRows[i].cells[2].innerHTML = desc;
          allRows[i].cells[3].innerHTML = qty;
          allRows[i].cells[4].innerHTML = price;
          allRows[i].cells[5].innerHTML = disc;
          allRows[i].cells[6].innerHTML = subttl;
          allRows[i].cells[7].innerHTML = vatper;
          allRows[i].cells[8].innerHTML = vatVal;
          allRows[i].cells[9].innerHTML = ttl;
        }
      }
      try {
        ReswapAll();
      } catch (error) {
        console.log(error);
      }
      function hidediscCol() {
        var allRpws = document.querySelectorAll("#listing_table tr");
        var flag = 0;
        for (var i = 0; i < allRpws.length; i++) {
          if (i > 0) {
            if (
              allRpws[i].cells[5].innerText.trim() == "" ||
              parseInt(allRpws[i].cells[5].innerText) == 0
            ) {
              flag = 1;
            }
          }
        }
        for (var i = 0; i < allRpws.length; i++) {
          if (flag == 1) {
            allRpws[i].cells[5].style.display = "none";
          }
        }
      }
      try {
        hidediscCol();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
