<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }
    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }
    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }
    .listing-table th {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }
    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }
    .total-table td {
      border-right: 1px solid #555555;
    }
    .total-row {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }
    .row-items {
      margin: 5px 0;
      display: block;
    }
    bold_title {
      font-weight: bold;
    }
    strong_tag {
      font-weight: bold;
    }
    big_title {
      font-size: 18px;
      font-weight: 100;
    }
    .notes-block {
      margin: 50px 0 0 0;
    }

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }
    .qr-code img {
      margin-top: 10px;
    }
    #listing_table th:nth-child(4),
    #listing_table td:nth-child(4),
    #listing_table th:nth-child(8),
    #listing_table td:nth-child(8) {
      display: none;
    }
  </style>
  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td align="right" valign="top">
              <h1>
                <p id="invoice_title" class="editable-area invoice-name">
                  {%invoice_title%}
                </p>
              </h1>
              <div class="qr-code">{%sa_qr_code_image%}<br /></div>
            </td>
            <td align="left" valign="top">
              <img
                style="vertical-align: top; margin-bottom: 10px"
                id="logo"
                class="editable-area"
                src="{%logo%}"
                width="{%logo-width%}"
                height="{%logo-height%}"
              />
              <div id="business_info" class="editable-area">
                <p>{%business_info%}</p>
              </div>
            </td>
          </tr>
        </table>
        <br />
        <br />
        <br />
        <br />

        <div class="invoice-address">
          <table border="0" cellspacing="0" cellpadding="0" width="100%">
            <tr>
              <td align="right" valign="top">
                <div
                  style="vertical-align: top"
                  align="right"
                  id="client_info"
                  class="editable-area"
                >
                  <strong id="field1" class="editable-area">{%field1%}</strong
                  ><br />
                  {%client_info%}
                </div>
              </td>
              <td
                id="shipping_options"
                style="display: none"
                align="right"
                valign="top"
              >
                <div
                  style="vertical-align: top"
                  align="right"
                  id="ship_info"
                  class="editable-area"
                >
                  <strong id="label_ship" class="editable-area"
                    >{%label_ship%}</strong
                  ><br />
                  {%ship_info%}
                </div>
              </td>
              <td valign="top" align="left">
                <table
                  id="invoice_basics"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_invoice_no"
                        >{%label_invoice_no%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_number%}
                    </td>
                  </tr>
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_date"
                        >{%label_date%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_date%}
                    </td>
                  </tr>
                </table>
                <custom_field
                  id="custom_fields"
                  class="editable-area"
                  style="clear: both"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  {%custom_fields%}
                </custom_field>
              </td>
            </tr>
          </table>
        </div>

        <br />
        <br />
        <br />
        <br />

        <div id="items-list">{%items_list%}</div>
        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>

        <br />
      </div>
      {%html_sticky_footer%}
    </div>
    <script>
      function addDiscCol() {
        var allRows = document.querySelectorAll("#listing_table tr");
        if (allRows[0].cells.length == 5) {
          var newTh = document.createElement("th");
          newTh.innerHTML = "Discount (%)";
          newTh.style.display = "none";
          allRows[0].insertBefore(newTh, allRows[0].cells[4]);
          for (var i = 1; i < allRows.length; i++) {
            var newTd = document.createElement("td");
            newTd.innerHTML = "0.00";
            newTd.style.display = "none";

            allRows[i].insertBefore(newTd, allRows[i].cells[4]);
          }
        }
      }
      try {
        addDiscCol();
      } catch (error) {
        console.log(error);
      }

      function hundleTtls() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerHTML = allRows[0].cells[2].innerHTML;
        allRows[0].insertBefore(newTh, allRows[0].cells[2]);
        for (var i = 1; i < allRows.length; i++) {
          var newTd = document.createElement("td");
          newTd.innerText = (
            parseFloat(allRows[i].cells[2].innerText.replace(/,/g, "")) / 0.85
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          //   newTd.style.display = "none";

          allRows[i].insertBefore(newTd, allRows[i].cells[2]);
        }
      }
      try {
        hundleTtls();
      } catch (error) {
        console.log(error);
      }
      function hundleTtls2() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerHTML = allRows[0].cells[6].innerHTML;
        allRows[0].insertBefore(newTh, allRows[0].cells[6]);
        for (var i = 1; i < allRows.length; i++) {
          var newTd = document.createElement("td");
          newTd.innerText = (
            parseFloat(allRows[i].cells[6].innerText.replace(/,/g, "")) / 0.85
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          allRows[i].insertBefore(newTd, allRows[i].cells[6]);
        }
      }
      try {
        hundleTtls2();
      } catch (error) {
        console.log(error);
      }
      function adddiscRows() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var subttl = 0;
        for (var i = 1; i < allRows.length; i++) {
          subttl =
            subttl +
            parseFloat(allRows[i].cells[6].innerText.replace(/,/g, ""));
        }

        var subbefdiscRow = document.createElement("tr");
        var newTd1 = document.createElement("td");
        newTd1.setAttribute("style", "border:none;");
        var newTd2 = document.createElement("td");
        newTd2.setAttribute(
          "style",
          "border-right:none;border-left:none;font-weight:bold;"
        );

        var newTd3 = document.createElement("td");
        newTd3.setAttribute("style", "border-right:none;border-left:none;");
        newTd2.innerHTML = "الإجمالى قبل الخصم";
        newTd3.innerHTML = subttl
          .toFixed(2)
          .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        subbefdiscRow.appendChild(newTd1);
        subbefdiscRow.appendChild(newTd2);
        subbefdiscRow.appendChild(newTd3);
        document
          .querySelector(".listing-table:nth-child(2) tbody")
          .insertBefore(
            subbefdiscRow,
            document.querySelectorAll(".listing-table:nth-child(2) tbody tr")[0]
          );

        var discRow = document.createElement("tr");
        var newTd1 = document.createElement("td");
        newTd1.setAttribute("style", "border:none;");
        var newTd2 = document.createElement("td");
        newTd2.setAttribute(
          "style",
          "border-right:none;border-left:none;font-weight:bold;    direction: ltr; width: 29%;"
        );

        var newTd3 = document.createElement("td");
        newTd3.setAttribute("style", "border-right:none;border-left:none;");
        newTd2.innerHTML = " إجمالى  الخصم";
        newTd3.innerHTML = (subttl * 0.15)
          .toFixed(2)
          .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        discRow.appendChild(newTd1);
        discRow.appendChild(newTd2);
        discRow.appendChild(newTd3);
        document
          .querySelector(".listing-table:nth-child(2) tbody")
          .insertBefore(
            discRow,
            document.querySelectorAll(".listing-table:nth-child(2) tbody tr")[1]
          );
      }
      try {
        adddiscRows();
      } catch (error) {
        console.log(error);
      }

      function hidettlbeftax() {
        if (document.querySelector(".row-tax-summary")) {
          document.querySelector(
            ".listing-table:nth-child(2) tr:nth-child(3)"
          ).style.display = "none";
        }
      }
      try {
        hidettlbeftax();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
