    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
    <html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>Invoice Template</title>
    </head>
    <style type="text/css">
        * {
        margin: 0;
        padding: 0;
        }

        body {
        background: #ffffff;
        font: 12px "Tahoma", Arial, Helvetica, sans-serif;
        direction: rtl;
        text-align: right;
        }

        .invoice-wrap {
        width: 660px;
        margin: 0 auto;
        background: transparent;
        color: #000;
        }

        .invoice-inner {
        margin: 0 30px;
        /* padding-top: 20px; */
        }

        .invoice-address {
        margin: 35px 0;
        /* padding-top: 3cm; */
        }

        .bussines-name {
        font-size: 18px;
        font-weight: 100;
        }

        .invoice-name {
        font-size: 22px;
        font-weight: 700;
        }

        bold_title {
        font-weight: bold;
        }

        strong_tag {
        font-weight: bold;
        }

        big_title {
        font-size: 18px;
        font-weight: 100;
        }

        .listing-table th {
        background-color: #e5e5e5;
        border-bottom: 1px solid #555555;
        border-top: 1px solid #555555;
        font-weight: bold;
        text-align: right;
        padding: 6px 4px;
        }

        .listing-table td {
        border-bottom: 1px solid #555555;
        text-align: right;
        padding: 5px 6px;
        vertical-align: top;
        background-color: transparent;
        }

        .total-table td {
        border-right: 1px solid #555555;
        }

        .total-row {
        border-bottom: 1px solid #555555;
        border-top: 1px solid #555555;
        font-weight: bold;
        }

        .row-items {
        margin: 5px 0;
        display: block;
        }

        .notes-block {
        margin: 0 0 0 0;
        }

        .total-row td:nth-child(2),
        .total-row td:nth-child(3) {
        background-color: #e5e5e5;
        }

        tr,
        td,
        th {
        page-break-inside: avoid !important;
        }

        .qr-code {
        text-align: left;
        }

        .bg {
        z-index: -90000;
        position: absolute;
        left: 0px;
        background-image: url("https://mohdalhothali.daftra.com/files/6f6ee476/documents/d28b7_back_ground.png");
        background-repeat: no-repeat;
        background-position:center;
        background-size: cover;
        width: 21cm;
        height: 22.5cm;
        opacity: 0.5;
        }
    </style>

    <body>
        <div class="invoice-wrap">
        <div>
            {%html_sticky_header%}
            <div class="bg" style="top: 0cm"></div>
            <div class="invoice-inner">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                <td align="center" valign="top">
                    <div>
                    <img
                        id="logo"
                        class="editable-area"
                        src="{%logo%}"
                        width="{%logo-width%}"
                        height="{%logo-height%}"
                    />
                    </div>
                </td>
                </tr>
            </table>
            <div class="invoice-address">
                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td width="50%" align="right" valign="top">
                    <table border="0" cellspacing="0" cellpadding="0">
                        <tr>
                        <td valign="top">
                            <strong id="field1" class="editable-area"
                            >{%field1%}</strong
                            >
                        </td>
                        <td valign="top">
                            <div
                            id="client_info"
                            style="padding-right: 20px"
                            class="editable-area"
                            >
                            {%client_info%}
                            </div>
                        </td>
                        </tr>
                        <tr id="shipping_options" style="display: none">
                        <td valign="top">
                            <br />
                            <strong id="label_ship" class="editable-area"
                            >{%label_ship%}</strong
                            >
                        </td>
                        <td valign="top">
                            <br />
                            <div
                            id="ship_info"
                            style="padding-right: 20px"
                            class="editable-area"
                            >
                            {%ship_info%}
                            </div>
                        </td>
                        </tr>
                    </table>
                    </td>
                    <td width="50%" valign="top" align="left">
                    <table
                        border="0"
                        cellspacing="0"
                        cellpadding="0"
                        align="left"
                    >
                        <tr>
                        <td>
                            <div class="qr-code">{%sa_qr_code_image%}<br /></div>
                            <div
                            style="text-align: left"
                            id="business_info"
                            class="editable-area"
                            >
                            {%business_info%}
                            </div>
                        </td>
                        </tr>
                    </table>
                    <div style="clear: both" />

                    <table
                        id="invoice_basics"
                        border="0"
                        cellspacing="0"
                        cellpadding="0"
                    >
                        <tr>
                        <td align="left">
                            <strong class="editable-area" id="label_invoice_no"
                            >{%label_invoice_no%}</strong
                            >
                        </td>
                        <td style="padding-right: 20px" align="right">
                            {%invoice_number%}
                        </td>
                        </tr>
                        <tr>
                        <td align="left">
                            <strong class="editable-area" id="label_date"
                            >{%label_date%}</strong
                            >
                        </td>
                        <td style="padding-right: 20px" align="right">
                            {%invoice_date%}
                        </td>
                        </tr>
                    </table>
                    <custom_field
                        id="custom_fields"
                        class="editable-area"
                        border="0"
                        cellspacing="0"
                        cellpadding="0"
                    >
                        {%custom_fields%}
                    </custom_field>
                    </td>
                </tr>
                </table>
            </div>
            <div id="items-list">{%items_list%}</div>
            <div class="notes-block">
                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td>
                    <div
                        style="font-style: italic"
                        class="editable-area"
                        id="footer"
                    >
                        {%footer%}
                    </div>
                    </td>
                </tr>
                </table>
            </div>
            
            </div>
            {%html_sticky_footer%}
        </div>
        </div>
        <script>
        // Repeating Background
        function repeatBg() {
        var invoiceHeight =
          document.querySelector(".invoice-inner").offsetHeight;
        var pageHeight = document.querySelector(".bg").offsetHeight;
        var numPages = Math.ceil(invoiceHeight / pageHeight) ;
        var bg = document.querySelector(".bg");
        var topDis = parseFloat(bg.style.top.replace("cm", ""));
        for (var i = 1; i < numPages; i++) {
          var newBg = document.createElement("div");
          newBg.setAttribute("class", "bg");
          topDis = topDis + 22.5;
          console.log(topDis);
          newBg.style.top = topDis + "cm";
          bg.parentNode.insertBefore(newBg, bg.nextSibling);
        }
      }
      try {
        repeatBg();
      } catch (e) {
        console.log(e);
      }
        try {
            repeatBg();
        } catch (e) {
            console.log(e);
        }
        </script>
    </body>
    </html>
