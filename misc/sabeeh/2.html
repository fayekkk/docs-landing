<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    @media print {
      body {
        max-width: 90% !important;
        width: 90% !important;
        margin: 0 auto !important;
        background: #fff;
        padding: 0 !important;
      }
      body > div > div.invoice-inner {
        margin: 10px auto !important;
      }
      .invoice-wrap {
        margin: auto !important;
        width: 100% !important;
        height: 100% !important;
      }
    }
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }
    .invoice-wrap {
      margin: 0 auto;
      background: #fff;
      color: #000;
      height: 100% !important;
    }
    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }
    .listing-table th {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }
    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }
    .total-table td {
      border-right: 1px solid #555555;
    }
    .total-row {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }
    .row-items {
      margin: 5px 0;
      display: block;
    }
    bold_title {
      font-weight: bold;
    }
    strong_tag {
      font-weight: bold;
    }
    big_title {
      font-size: 18px;
      font-weight: 100;
    }
    .notes-block {
      margin: 30px 0 0 0;
    }

    .invoice-inner,
    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }
    .qr-code {
      margin: 10px auto;
      text-align: center;
    }
  </style>
  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td align="right" valign="top">
              <h1>
                <p id="invoice_title" class="editable-area invoice-name">
                  {%invoice_title%}
                </p>
              </h1>
            </td>
            <td align="left" valign="top">
              <img
                style="vertical-align: top; margin-bottom: 10px"
                id="logo"
                class="editable-area"
                src="{%logo%}"
                width="{%logo-width%}"
                height="{%logo-height%}"
              />

              <div id="business_info" class="editable-area">
                <p>{%business_info%}</p>
              </div>
            </td>
          </tr>
        </table>
        <br />
        <br />

        <div class="invoice-address">
          <table border="0" cellspacing="0" cellpadding="0" width="100%">
            <tr>
              <td align="right" valign="top">
                <div
                  style="vertical-align: top"
                  align="right"
                  id="client_info"
                  class="editable-area"
                >
                  <strong id="field1" class="editable-area">{%field1%}</strong
                  ><br />
                  {%client_info%}
                </div>
              </td>
              <td
                id="shipping_options"
                style="display: none"
                align="right"
                valign="top"
              >
                <div
                  style="vertical-align: top"
                  align="right"
                  id="ship_info"
                  class="editable-area"
                >
                  <strong id="label_ship" class="editable-area"
                    >{%label_ship%}</strong
                  ><br />
                  {%ship_info%}
                </div>
              </td>
              <td valign="top" align="left">
                <table
                  id="invoice_basics"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_invoice_no"
                        >{%label_invoice_no%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_number%}
                    </td>
                  </tr>
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_date"
                        >{%label_date%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_date%}
                    </td>
                  </tr>
                </table>
                <custom_field
                  id="custom_fields"
                  class="editable-area"
                  style="clear: both"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  {%custom_fields%}
                </custom_field>
              </td>
            </tr>
          </table>
        </div>

        <br />
        <br />

        <div id="items-list">{%items_list%}</div>

        <div class="notes-block">
          <div class="qr-code">{%sa_qr_code_image%}</div>
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
      {%html_sticky_footer%}
    </div>
    <style>
      body > div > div > table > tbody > tr > td:nth-child(1) {
        display: block;
        text-align: center;
        margin-bottom: 10px;
      }

      body > div > div > table > tbody > tr > td:nth-child(2) {
        display: block;
        text-align: center;
      }

      body > div > div > div.invoice-address {
        margin-top: -40px;
      }

      body
        > div
        > div
        > div.invoice-address
        > table
        > tbody
        > tr
        > td:nth-child(1) {
        display: block;
      }

      body
        > div
        > div
        > div.invoice-address
        > table
        > tbody
        > tr
        > td:nth-child(3) {
        display: block;
        text-align: right;
        margin-top: 10px;
      }

      #invoice_basics > tbody > tr:nth-child(1) > td:nth-child(1) {
        text-align: right;
      }

      body > div > div.invoice-inner {
        margin: 10px !important;
      }

      #items-list > table:nth-child(2) > tbody > tr > td:nth-child(1) {
        display: none;
      }

      #listing_table {
        font-size: 10px;
      }
      #listing_table th:nth-child(2),
      #listing_table td:nth-child(2),
      #listing_table th:nth-last-child(2),
      #listing_table td:nth-last-child(2) {
        display: none;
      }
      #label_quantity {
        width: 20px;
      }
      #label_subtotal {
        width: 20px;
      }

      .invoice-inner,
      tr,
      td,
      th {
        page-break-inside: avoid !important;
      }
    </style>
    <script>
      function fixDecimals() {
        var priceArr = document.querySelectorAll(
          "#listing_table td:nth-child(3)"
        );
        var totalsArr = document.querySelectorAll(
          "#listing_table td:nth-child(5)"
        );
        for (var i = 0; i < priceArr.length; i++) {
          document.querySelectorAll("#listing_table td:nth-child(3)")[
            i
          ].innerHTML = parseFloat(priceArr[i].innerHTML.split(",").join(""))
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          document.querySelectorAll("#listing_table td:nth-child(5)")[
            i
          ].innerHTML = parseFloat(totalsArr[i].innerHTML.split(",").join(""))
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
      }
      try {
        fixDecimals();
      } catch (e) {
        console.log(e);
      }
      function swapCol() {
        var allrows = document.querySelectorAll("#listing_table tr");
        for (var i = 0; i < allrows.length; i++) {
          var myTd = allrows[i].cells[2];
          allrows[i].appendChild(myTd);
          //   allrows[i].removeChild(allrows[i].cells[2]);
        }
      }
      try {
        swapCol();
      } catch (error) {
        console.log(error);
      }
      function updatePrices() {
        var allrows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerText = "السعر بعد الضريبة";
        document
          .querySelector("#listing_table thead tr")
          .insertBefore(
            newTh,
            document.querySelector("#listing_table thead tr th:nth-child(4)")
          );
        document.querySelector(
          "#listing_table thead tr th:nth-child(3)"
        ).innerText = "السعر قبل الضريبة";
        for (var i = 1; i < allrows.length; i++) {
          var newTd = document.createElement("td");
          allrows[i].insertBefore(newTd, allrows[i].cells[3]);
          var taxName = allrows[i].cells[1].innerText.trim();
          if (taxName == "متضمن القيمة المضافة") {
            var pricebefore = (
              parseFloat(allrows[i].cells[2].innerText.replace(/,/g, "")) / 1.15
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            var priceAfter = parseFloat(
              allrows[i].cells[2].innerText.replace(/,/g, "")
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            allrows[i].cells[2].innerText = parseFloat(
              pricebefore.replace(/,/g, "")
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            pricebefore;
            allrows[i].cells[3].innerText = priceAfter;
          } else if (taxName == "القيمة المضافة") {
            var pricebefore = parseFloat(
              allrows[i].cells[2].innerText.replace(/,/g, "")
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            var priceAfter = (
              parseFloat(allrows[i].cells[2].innerText.replace(/,/g, "")) +
              parseFloat(allrows[i].cells[2].innerText.replace(/,/g, "")) * 0.15
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            allrows[i].cells[2].innerText = pricebefore;
            allrows[i].cells[3].innerText = priceAfter;
          } else {
            allrows[i].cells[2].innerText = parseFloat(
              allrows[i].cells[2].innerText.replace(/,/g, "")
            )
              .toFixed(2)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            allrows[i].cells[3].innerText = allrows[i].cells[2].innerText;
          }
        }
      }
      try {
        updatePrices();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
