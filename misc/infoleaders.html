<div
  id="barcode_template"
  class="mceEditable"
  readonly="readonly"
  style="
    padding: 0px 0px 0px 0px;
    margin: 20px auto;
    background-color: #ffffff;
    margin-bottom: 20px;
  "
>
  <div
    id="barcode_template"
    class="mceEditable"
    readonly="readonly"
    style="
      padding: 0px 0px 0px 0px;
      margin: 20px auto;
      background-color: #ffffff;
      margin-bottom: 20px;
    "
  >
    <style>
      <!--
          img {height: 0.8cm !important;}
                  #barcode_template{margin: 0 auto !important; margin-bottom: 0 !important;}
          -->
    </style>
    <div>
      <div
        class="num_contain"
        style="font-size: 12px; width: 95%; margin: auto"
      >
        <div style="text-align: center">
          <span class="product_unit_price"></span>
        </div>
        <div style="text-align: center">
          <span class="product_unit_price"></span>
        </div>
        <div style="text-align: center">
          <span class="product_unit_price"></span>
        </div>
        <div style="text-align: center">
          <span style="font-size: 11pt"
            ><span class="product_unit_price">{%product_name%}</span></span
          >
        </div>
        <div style="margin: 2px 0px">
          <span style="font-size: 11pt"
            ><span style="float: right" class="product_unit_price"></span
            ><strong
              >&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
              &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
              &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
              &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</strong
            ><span style="float: right" class="product_unit_price"
              ><span style="float: right" class="product_unit_price"
                >&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
                &nbsp;</span
              ></span
            ><span style="float: right" class="product_unit_price"
              ><span style="float: right" class="product_unit_price"
                >&nbsp;</span
              ></span
            ></span
          >
          <div class="num_contain">
            <div>
              <span style="font-size: 11pt"
                ><span class="product_unit_price"></span
                ><span class="product_unit_price"
                  >&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
                  <strong>SKU&nbsp; #</strong></span
                ><strong>&nbsp;{%product_code%}</strong></span
              >
            </div>
            <div></div>
            <div style="text-align: center">
              <span style="font-size: 11pt">&nbsp; ITEM BARCODE</span>
            </div>
          </div>
        </div>
      </div>
      <div class="barcode_img_container" style="text-align: center">
        <span style="font-size: 14pt"
          ><img
            id="barcode_image"
            src="https://infoleaders.daftra.com/img/dummy_barcode.jpg"
            width="228"
            height="50"
        /></span>
      </div>
      <div class="barcode_img_container" style="text-align: center">
        <span style="font-size: 20pt"
          ><strong
            ><span style="font-size: 18pt">{%product_barcode_number%}</span
            ><br /></strong
        ></span>
      </div>
    </div>
  </div>
</div>
