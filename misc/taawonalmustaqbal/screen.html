<style>
  .col-2 textarea::placeholder {
    color: transparent !important;
  }
</style>
<script>
  $(document).ready(function () {
    function handleInvoiceLayout() {
      const $invoiceLayout = $("#InvoiceLayout");

      function toggleUnitPrice() {
        const $labelUnitPrice = $("#label_unit_price");
        const $unitPrice = $(".unit-price");
        if ($invoiceLayout.val() === "1") {
          $labelUnitPrice.hide();
          $unitPrice.hide();
        } else {
          $labelUnitPrice.show();
          $unitPrice.show();
        }
      }

      toggleUnitPrice();
      $invoiceLayout.on("change", toggleUnitPrice);
      $("#AddItem").on("click", toggleUnitPrice);
    }

    function handleItemNameInput() {
      const $table = $("#listing_table");
      const $col2Textarea = $(".col-4 textarea");
      const $col3Textarea = $(".col-3 textarea");

      function preventNonDigitInput() {
        // $col2Textarea.on("keypress", function (e) {
        //   if (!/^-?\d*(\.\d+)?$/.test(e.key)) {
        //     e.preventDefault();
        //   }
        // });
        $col2Textarea.on("keypress", function (e) {
          // Allow digits, decimal points, and negative signs
          var allowedChars = /^-?\d*(\.\d*)?$/;

          // Get the key that was pressed
          var key = String.fromCharCode(e.which);

          // Check if the key is allowed
          if (!allowedChars.test(key)) {
            e.preventDefault();
          }
        });

        // $col3Textarea.on("keypress", function (e) {
        //   if (!/^-?\d*(\.\d+)?$/.test(e.key)) {
        //     e.preventDefault();
        //   }
        // });
        $col3Textarea.on("keypress", function (e) {
          // Allow digits, decimal points, and negative signs
          var allowedChars = /^-?\d*(\.\d*)?$/;

          // Get the key that was pressed
          var key = String.fromCharCode(e.which);

          // Check if the key is allowed
          if (!allowedChars.test(key)) {
            e.preventDefault();
          }
        });
      }

      function updateUnitPriceOnChange() {
        $table.on(
          "change",
          ".col-4 textarea, .col-3 textarea",
          debounce(function () {
            const $row = $(this).closest("tr");
            const duration = $row.find(".col-4 textarea").val();
            const price = $row.find(".col-3 textarea").val();
            const unitPriceInput = $row.find(".unit-price input");
            unitPriceInput.val(duration * price).change();
          }, 300)
        );
      }

      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          const context = this;
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(context, args), wait);
        };
      }

      preventNonDigitInput();
      updateUnitPriceOnChange();

      $(".item_name").on("change", preventNonDigitInput);
      $("#AddItem").on("click", function () {
        preventNonDigitInput();
        updateUnitPriceOnChange();
      });
    }

    if ($("#InvoiceLayout").val() === "1") {
      handleInvoiceLayout();
      handleItemNameInput();
    }

    $("#InvoiceLayout").on("change", function () {
      if ($("#InvoiceLayout").val() === "1") {
        handleInvoiceLayout();
        handleItemNameInput();
      }
    });
  });
</script>

<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
              <div class="m-r-md d-inline-flex">
                <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">احسب ضمان الأعمال</a>
              </div>
              <div style="display: inline-block; max-width: 100px;">
                <label class="ui-input-label l-input-label adjust-tab-input-label">النسبة</label>
                <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
              </div>
              <div class="error-box hidden">
                <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
                <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
              </div>
            </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#InvoiceAdjustmentLabel").val("خصم ضمان أعمال");
    }
    if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
      $("#InvoiceRetention").val(0);
    }
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "").replace("$", "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }
    // calculating retention funtion
    function calcRetention() {
      var retentionValue = $("#InvoiceAdjustmentValue");
      var total =
        parseFloat(
          $("#SubtotalValue").text().replace(/,/g, "").replace("$", "")
        ) + tax;

      var total = parseFloat(
        $("#SubtotalValue").text().replace(/,/g, "").replace("$", "")
      );
      if (isNaN(total)) {
        total = 0;
      }

      // calculating retention from subtotal
      $("#InvoiceAdjustmentValue").val(
        (parseFloat($("#InvoiceRetention").val() * 0.01) * total * -1).toFixed(
          2
        )
      );
      $("#InvoiceAdjustmentValue").change();

      // getting retention value
      function getRetPerc() {
        let retPer = $("#InvoiceRetention").val();
        return retPer;
      }
      // changing the adjustment label with the retention percentage
      $("#InvoiceAdjustmentLabel").val(`خصم ضمان أعمال (${getRetPerc()}%)`);
      // LOCAL STORAGE (saving new retention value)
      localStorage.setItem("retention", $("#InvoiceRetention").val());
    }
    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    if (adjLbl.text() == "التسوية") {
      adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    }
    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }

    $("#InvoiceNo").attr("readonly", false);
  });
</script>
