<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }

    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }

    .invoice-inner {
      margin: 0 0px !important;
      padding: 20px 0;
    }
    #listing_table {
      border-bottom: 1px solid #000;
      border-right: 1px solid #000;
      border-left: none !important;
      border-top: none !important;
    }
    #listing_table td,
    #listing_table th {
      border-top: 1px solid #000;
      border-left: 1px solid #000;
      border-right: none !important;
      border-bottom: none !important;
      padding: 3px;
      text-align: right;
      background-color: #fff !important;
    }
    .listing-table:nth-child(2) {
      display: none !important;
    }
    #newTotals {
      width: 100%;
      border-spacing: 0;
      border-right: 1px solid #000 !important;
      border-bottom: 1px solid #000 !important;
    }
    #newTotals td {
      text-align: right;
      width: 50%;
      border-spacing: 0;
      border-left: 1px solid #000 !important;
      border-top: 1px solid #000 !important;
      padding: 2px;
    }
  </style>

  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <div id="items-list">{%items_list%}</div>
        <table style="width: 100%; border-spacing: 0; margin-top: 20px">
          <tbody>
            <tr>
              <td style="width: 48%; vertical-align: baseline">
                <table id="newTotals">
                  <tbody>
                    <tr>
                      <td>الإجمالى (غير شامل ضريبة القيمة المضافة)</td>
                      <td class="removeCurr">{%invoice_subtotal%}</td>
                    </tr>
                    <tr>
                      <td>الخصم الإجمالى</td>
                      <td class="removeCurr adddiscounts"></td>
                    </tr>
                    <tr>
                      <td>ضريبة القيمة المضافة</td>
                      <td class="removeCurr">{%tax-total%}</td>
                    </tr>
                    <tr>
                      <td>إجمالى المبلغ المستحق</td>
                      <td class="removeCurr">{%invoice_total%}</td>
                    </tr>
                  </tbody>
                </table>
              </td>
              <td style="width: 4%"></td>
              <td style="width: 48%; border: 1px solid #000; padding: 3px">
                <div class="notes-block">
                  <table
                    width="100%"
                    border="0"
                    cellspacing="0"
                    cellpadding="0"
                  >
                    <tr>
                      <td>
                        <div class="editable-area" id="footer">{%footer%}</div>
                      </td>
                    </tr>
                  </table>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style="display: none">
        <div id="discount">{%discount%}</div>
        <div id="item-discount">{%item-discount-total%}</div>
      </div>

      {%html_sticky_footer%}
    </div>
    <script>
      function swap() {
        var AllRows = document.querySelectorAll("#listing_table tr");
        for (var i = 0; i < AllRows.length; i++) {
          var unit = AllRows[i].cells[2].innerHTML;
          var qty = AllRows[i].cells[3].innerHTML;
          AllRows[i].cells[2].innerHTML = qty;
          AllRows[i].cells[3].innerHTML = unit;
        }
      }
      try {
        swap();
      } catch (error) {
        console.log(error);
      }
      function addsubttlCol() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerHTML = "الإجمالى الخاضع للضريبة";
        allRows[0].insertBefore(
          newTh,
          allRows[0].cells[allRows[0].cells.length - 3]
        );
        allRows[0].cells[allRows[0].cells.length - 3].style.display = "none";
        allRows[0].cells[allRows[0].cells.length - 2].setAttribute(
          "colspan",
          2
        );
        for (var i = 1; i < allRows.length; i++) {
          console.log(allRows[i].cells[allRows[i].cells.length - 1].innerText);
          console.log(allRows[i].cells[allRows[i].cells.length - 2].innerText);

          var newTd = document.createElement("td");
          newTd.innerText = (
            parseFloat(
              allRows[i].cells[allRows[i].cells.length - 1].innerText.replace(
                /,/g,
                ""
              )
            ) -
            parseFloat(
              allRows[i].cells[allRows[i].cells.length - 2].innerText.replace(
                /,/g,
                ""
              )
            )
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          allRows[i].insertBefore(
            newTd,
            allRows[i].cells[allRows[i].cells.length - 3]
          );
        }
      }
      try {
        addsubttlCol();
      } catch (error) {
        console.log(error);
      }
      function addUnits() {
        var allRows = document.querySelectorAll("#listing_table tr");
        for (var i = 1; i < allRows.length; i++) {
          if (allRows[i].cells[2].innerText.trim().split(" ").length > 1) {
            allRows[i].cells[3].innerText =
              allRows[i].cells[2].innerText.split(" ")[1];
            allRows[i].cells[2].innerText =
              allRows[i].cells[2].innerText.split(" ")[0];
          }
        }
      }
      try {
        addUnits();
      } catch (error) {
        console.log(error);
      }
      function hundleTotals() {
        // adddiscounts
        var discount =
          parseFloat(
            document.getElementById("discount").innerText.replace(/,/g, "")
          ) +
          parseFloat(
            document.getElementById("item-discount").innerText.replace(/,/g, "")
          );
        document.querySelector(".adddiscounts").innerText = discount
          .toFixed(2)
          .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        var allremoveCurr = document.querySelectorAll(".removeCurr");
        for (var i = 0; i < allremoveCurr.length; i++) {
          allremoveCurr[i].innerText = parseFloat(
            allremoveCurr[i].innerText.replace(/,/g, "")
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
      }
      try {
        hundleTotals();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
