<style>
  .hidden-elem {
    display: none !important;
  }
  .rtl-span {
    display: inline-block;
    direction: rtl;
  }
  .error-box span {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid rgba(224, 25, 49, 0.8);
    background: rgba(224, 25, 49, 0.7);
    color: #fff;
    border-radius: 3px;
  }
  .error-box {
    display: inline-block;
    position: inherit;
    margin-right: 20px;
  }
  .error-box:after {
    border: 0;
  }
</style>
<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
          <div class="m-r-md d-inline-flex">
            <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">احسب ضمان الأعمال</a>
          </div>
          <div style="display: inline-block; max-width: 100px;">
            <label class="ui-input-label l-input-label adjust-tab-input-label">النسبة</label>
            <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
          </div>
          <div class="error-box hidden">
            <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
            <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
          </div>
        </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);

    // getting second tax
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#InvoiceAdjustmentLabel").val("خصم ضمان أعمال");
    }

    // calculating retention funtion
    function calcRetention() {
      var retentionValue = $("#InvoiceAdjustmentValue");
      var total =
        parseFloat($("#SubtotalValue").text().replace(/,/g, "")) + tax;
      if (isNaN(total)) {
        total = 0;
      }

      // calculating retention from subtotal
      $("#InvoiceAdjustmentValue").val(
        (parseFloat($("#InvoiceRetention").val() * 0.01) * total * -1).toFixed(
          2
        )
      );
      $("#InvoiceAdjustmentValue").change();

      // getting retention value
      function getRetPerc() {
        let retPer = $("#InvoiceRetention").val();
        return retPer;
      }

      // changing the adjustment label with the retention percentage
      $("#InvoiceAdjustmentLabel").val(`خصم ضمان أعمال (${getRetPerc()}%)`);

      // LOCAL STORAGE (saving new retention value)
      localStorage.setItem("retention", $("#InvoiceRetention").val());
    }

    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    if (adjLbl.text() == "التسوية") {
      adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    }

    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }
  });
</script>
<script>
  $(document).ready(function () {
    setTimeout(() => {
      function screenCode() {
        let invLayout = $("#InvoiceLayout").val();
        if (invLayout == "1" ) {
          var $firstRow = $("#listing_table tr:nth-child(2)");
          $("#CustomModelField24").on("change", function () {
            if ($("#CustomModelField24").val() == "نسبة مئوية") {
              $firstRow.find(".item-discount-type").val(1).change();
            } else {
              $firstRow.find(".item-discount-type").val(2).change();
            }
          });

          function addDiscounts() {
            var $discinput1 = $("#CustomModelField25");
            var $discinput2 = $("#CustomModelField26");
            var $discinput3 = $("#CustomModelField27");

            var discinput1VAL = parseFloat($discinput1.val());
            var discinput2VAL = parseFloat($discinput2.val());
            var discinput3VAL = parseFloat($discinput3.val());
            console.log(discinput1VAL + discinput2VAL + discinput3VAL);
            var subttlVal =
              parseFloat($firstRow.find(".item-unit-price").val()) *
              parseFloat($firstRow.find(".item-qty ").val());
            if (
              discinput1VAL + discinput2VAL + discinput3VAL > 100 &&
              $("#CustomModelField24").val() == "نسبة مئوية"
            ) {
              alert("لا يمكن أن يكون مجموع القيم أكبر من 100%");
            } else if (
              discinput1VAL + discinput2VAL + discinput3VAL > subttlVal &&
              $("#CustomModelField24").val() == "مبلغ"
            ) {
              alert(
                "لا يمكن أن يكون مجموع القيم أكبر من 100% من مجموع المستخلص"
              );
            } else {
              $firstRow
                .find(".item-discount")
                .val(discinput1VAL + discinput2VAL + discinput3VAL)
                .change();
            }
          }
          // numbers onl

          $(document).ready(function () {
            if (
              isNaN($("#CustomModelField25").val()) ||
              $("#CustomModelField25").val() < 0 ||
              $("#CustomModelField25").val() == ""
            ) {
              $("#CustomModelField25").val("0");
            }
            if (
              isNaN($("#CustomModelField26").val()) ||
              $("#CustomModelField26").val() < 0 ||
              $("#CustomModelField26").val() == ""
            ) {
              $("#CustomModelField26").val("0");
            }
            if (
              isNaN($("#CustomModelField27").val()) ||
              $("#CustomModelField27").val() < 0 ||
              $("#CustomModelField27").val() == ""
            ) {
              $("#CustomModelField27").val("0");
            }

            $("#CustomModelField25").on("input", function () {
              let inputValue = $(this).val();
              console.log(isNaN(inputValue));
              if (isNaN(inputValue) || inputValue < 0) {
                $(this).val("0");
              }
            });
            $("#CustomModelField26").on("input", function () {
              let inputValue = $(this).val();
              if (isNaN(inputValue) || inputValue < 0) {
                $(this).val("0");
              }
            });
            $("#CustomModelField27").on("input", function () {
              let inputValue = $(this).val();
              if (isNaN(inputValue) || inputValue < 0) {
                $(this).val("0");
              }
            });
          });
          $("#CustomModelField25").on("change", function () {
            if ($(this).val() == "") {
              $(this).val(0).change();
            }
            addDiscounts();
          });
          $("#CustomModelField26").on("change", function () {
            if ($(this).val() == "") {
              $(this).val(0).change();
            }
            addDiscounts();
          });
          $("#CustomModelField27").on("change", function () {
            if ($(this).val() == 0 || $(this).val() == "") {
              if ($(this).val() == "") {
                $(this).val(0).change();
              }
              $("#InvoiceAdjustmentValue").attr("readonly", false);
              $("#InvoiceRetention").attr("readonly", false);
              addDiscounts();
            } else {
              $("#InvoiceRetention").val(0);
              $("#InvoiceAdjustmentValue").val(0);
              $("#InvoiceRetention").attr("readonly", true);
              $("#calcBtn").click();
              $("#InvoiceAdjustmentValue").attr("readonly", true);
              addDiscounts();
            }
          });
        } else {
          $("#CustomModelField24").off("change");
          $("#CustomModelField25").off("change");
          $("#CustomModelField26").off("change");
          $("#CustomModelField27").off("change");
        }
      }
      screenCode();
      $("#InvoiceLayout").on("change", function () {
        screenCode();
      });
    }, 400);
  });
</script>
