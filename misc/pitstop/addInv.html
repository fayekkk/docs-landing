  $(document).ready(function () {
    $("<a>")
      .attr("href", "#")
      .attr("id", "add-invoice")
      .attr("disabled", "disabled")
      .attr("class", "btn btn-default btn-sm quick-action-btn")
      .html(
        '<span class="list-icon mdi mdi-receipt" aria-hidden="true"></span>أضف فاتورة '
      )
      .appendTo(".invoice-actions");

    var orderId = location.pathname.split("/")[4];
    $.get(
      `/v2/api/entity/invoice/list/1?filter[work_order_id]=${orderId}`
    ).then(function (data) {
      console.log(data);

      if (data.data.length <= 0) {
        $("#add-invoice").attr("disabled", false);
      }
    });

    $("#add-invoice").on("click", function () {
      var orderId = location.pathname.split("/")[4];
      $.get(`/v2/api/entity/le_workflow-type-entity-1/${orderId}/4`).then(
        function (data) {
          // console.log({ data: data });
          let WorkflowData = data;
          console.log(WorkflowData);

          if (!WorkflowData.client_id) {
            alert("يجب تحديد العميل أولا");
            return;
          }
          // le_workflow-type-entity-1_custom_data
          let services =
            WorkflowData["le_workflow-type-entity-1_custom_data"][
              "le_custom_data_le_workflow-type-entity-1_le_custom_data_le_workflow-type-entity-1_multiple_sub_forms"
            ];
          let invServices = [];
          services.map(function (service) {
            console.log(service);
            if (service.service) {
              invServices.push({
                item: service[
                  "le_custom_data_le_workflow-type-entity-1_multiple_sub_forms_service"
                ].name,
                description:
                  service[
                    "le_custom_data_le_workflow-type-entity-1_multiple_sub_forms_service"
                  ].name,
                unit_price: service.prices ? service.prices : 0,
                quantity: service.qty ? service.qty : 1,
                col_3: "",
                col_4: " ",
                tax1: 0,
                tax2: 0,
                product_id: service.service,
              });
            }
          });
          console.log({ invServices: invServices });
          if (invServices.length <= 0) {
            alert("يجب تحديد خدمات أولا");
            return;
          }
          let body = {
            Invoice: {
              subscription_id: "",
              store_id: 1,
              po_number: 26,
              client_id: WorkflowData.client_id,
              client_email: "",
              client_country_code: "SAR",
              draft: "1",
              follow_up_status: null,
              work_order_id: orderId,
              staff_id: 0,
              name: "",
              is_offline: true,
              currency_code: "SAR",
              date: getCurrentDate(),
              discount: 0,
              discount_amount: 0,
              deposit: 0,
              deposit_type: 0,
              notes: "",
              html_notes: "",
              invoice_layout_id: 6,
              estimate_id: 0,
              shipping_options: "",
              shipping_amount: null,
              follow_up_status: null,
              requisition_delivery_status: null,
              pos_shift_id: null,
              branch_id: 1,
            },
            InvoiceItem: invServices,
            InvoiceCustomField: []
           
          };
          console.log({ invBody: body });

          fetch(`/api2/invoices`, {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          })
            .then((res) => res.json())
            .then((response) => {
              console.log(response);
              alert("تم إضافة فاتورة بنجاح");
              // window.location.reload();
              window.location.href = `/owner/invoices/edit/${response.id}`;
            })
            .catch((err) => {
              console.log(err);
            });
        }
      );
    });

    function getCurrentDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }
  });
</script>
