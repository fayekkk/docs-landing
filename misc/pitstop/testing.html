<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe Popup Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }

      .popup {
        display: none; /* Initially hidden */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .popup-content {
        position: relative;
        width: 80%;
        /* max-width: 600px; */
        background: white;
        border-radius: 8px;
        /* overflow: hidden; */
      }

      .close-btn {
        position: absolute;
        top: -10px;
        left: -10px;
        cursor: pointer;
        font-size: 20px;
        color: #333;
      }

      iframe {
        width: 100%;
        height: 400px;
        border: none;
      }

      .open-popup {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .open-popup:hover {
        background-color: #0056b3;
      }
      #closePopup {
        color: white;
        width: 23px;
        text-align: center;
        background-color: red;
        border-radius: 15%;
      }
      #closePopup:hover {
        color: black;
      }
    </style>
  </head>
  <body>
   
  </body>
</html>
