<script>
  $(document).ready(function () {
    let newAction = `<a class="btn btn-default btn-sm quick-action-btn" id="sendInv" href="#">
    Create Invoice
                  </a>`;

    $(".invoice-actions a:first").after(newAction);
    async function fetchstaffsData(projId) {
      return fetchData(`/v2/api/entity/le_workflow-type-entity-1/${projId}/4`);
    }
    async function fetchData(url, additionalHeaders = {}) {
      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
            ...additionalHeaders,
          },
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        console.error("Error:", error);
        return null;
      }
    }

    function getCurrentDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    $("#sendInv").on("click", function (e) {
      e.preventDefault();
      sendInv();
    });
    async function sendInv() {
      var projId = parseInt(window.location.href.split("/")[6]);
      const projectData = await fetchstaffsData(projId);
      console.log(projectData);
      let clientId = projectData.client_id;
      let sales_price =
        projectData["le_workflow-type-entity-1_custom_data"].sales_price;
      let productId =
        projectData["le_workflow-type-entity-1_custom_data"][
          "le_custom_data_le_workflow-type-entity-1_destenation2"
        ].id;
      let productName =
        projectData["le_workflow-type-entity-1_custom_data"][
          "le_custom_data_le_workflow-type-entity-1_destenation2"
        ].name;
      let currentdate = getCurrentDate();

      itemsarr = [
        {
          product_id: productId,
          item: productName,
          description: "",
          unit_price: parseFloat(sales_price),
          quantity: 1,
          col_3: "",
          col_4: "",
          col_5: "",
          tax1: 0,
          tax2: 0,
        },
      ];

      let body = {
        Invoice: {
          subscription_id: "",
          store_id: 1,
          po_number: 26,
          client_id: clientId,
          client_email: "",
          client_country_code: "EGP",
          draft: "0",
          follow_up_status: null,
          work_order_id: projId,
          staff_id: 0,
          name: "",
          is_offline: true,
          currency_code: "EGP",
          date: currentdate,
          discount: 0,
          discount_amount: 0,
          deposit: 0,
          deposit_type: 0,
          discount_amount: 0,
          discount: 0,
          notes: "",
          html_notes: "",
          invoice_layout_id: "4",
          estimate_id: 0,
          shipping_options: "",
          shipping_amount: null,
          follow_up_status: null,
          requisition_delivery_status: null,
          pos_shift_id: null,
        },
        InvoiceItem: itemsarr,
        InvoiceCustomField: [],
      };
      console.log(body);

      fetch(`/api2/invoices`, {
        method: "POST",
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
      })
        .then((res) => res.json())
        .then((response) => {
          console.log(response);
          location.reload();
        })
        .catch((err) => {
          console.log(err);
        });
    }
  });
</script>
