        function hudleAll() {
          if ($("#InvoiceLayout").val() == 11) {
            const searchableSelector = () => {
              var allrows = document.querySelectorAll("#listing_table tr");
              console.log(allrows.length);
            };

            async function createCol(
              prevTh,
              prevTd,
              colTitle,
              classTh,
              classTd,
              colInput
            ) {
              var rowsNum = $("#listing_table tr").length;

              if (
                document.querySelectorAll(
                  "#listing_table tr:nth-child(1) .late_th"
                ).length == 0
              ) {
                // Clone TH and attach change event listener
                $(prevTh).after(
                  $("th.col-3")
                    .clone()
                    .wrap("<p>")
                    .parent()
                    .html()
                    .replace("col-3", classTh)
                    .replace("", colTitle)
                );

                $(prevTd).after(
                  $("td.col-3")
                    .clone()
                    .wrap("<p>")
                    .parent()
                    .html()
                    .replace("col-3", classTd)
                    .replace("item_col_4", colInput)
                );
              } else if (
                !document.querySelector("#listing_table tr:last-child .late_td")
              ) {
                $(`#listing_table tr:last-child ${prevTd}`).after(
                  $("#listing_table tr:last-child td.col-3")
                    .clone()
                    .wrap("<p>")
                    .parent()
                    .html()
                    .replace("col-3", classTd)
                    .replace("item_col_4", colInput)
                );
              }

              $("." + colInput).attr("placeholder", "");
              $("." + colInput).attr("name", "");

              searchableSelector();

              document.querySelector(".late_th").innerText = " رقم الكتالوج   ";
            }

            // adding the columns when screen is loaded
            createCol(
              "th.col-3",
              "td.col-3",
              "إختيار العاملة ",
              "late_th",
              "late_td",
              "late_input"
            );

                "td.col-3",
                "إختيار العاملة ",
                "late_th",
                "late_td",
                "late_input"
              );
              hudleAll();

              $("td.late_td:last").find("textarea").val("");
            });

            if ($("#InvoiceLayout").val() == 11) {
