<!DOCTYPE html>
<html>
  <head>
    <title>Popup Form</title>
    <style>
      .popup {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 9999;
      }

      .popup-content {
        background-color: #fff;
        width: 90%;

        margin: 20px auto;
        padding: 20px;
        position: relative;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      table {
        width: 100%;
        margin-bottom: 10px;
      }

      th,
      td {
        padding: 10px;
        text-align: left;
      }

      .add-row-btn {
        padding: 10px 20px;
        background-color: #4caf50;
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
      }

      .close-icon {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        cursor: pointer;
        color: #999;
      }

      .confirm-btn {
        padding: 10px 20px;
        background-color: #4caf50;
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 10px;
        float: right;
      }

      @media (max-width: 768px) {
        .popup-content {
          width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <button class="btn btn-default btn-sm quick-action-btn" onclick="showPopup()">Open Popup</button>

    <div id="popup" class="popup">
      <div class="popup-content">
        <span class="close-icon" onclick="closePopup()">&times;</span>
        <h2>Popup Form</h2>
        <table id="table">
          <tr>
            <th>Input 1</th>
            <th>Input 2</th>
            <th>Input 3</th>
            <th>Input 4</th>
          </tr>
          <tr>
            <td><input type="text" name="input1" /></td>
            <td><input type="text" name="input2" /></td>
            <td><input type="text" name="input3" /></td>
            <td><input type="text" name="input4" /></td>
          </tr>
        </table>
        <button onclick="addRow()" class="add-row-btn">Add Row</button>
        <button onclick="confirmForm()" class="confirm-btn">Confirm</button>
      </div>
    </div>

    <script>
      function showPopup() {
        const popup = document.getElementById("popup");
        popup.style.display = "block";
      }

      function closePopup() {
        const popup = document.getElementById("popup");
        popup.style.display = "none";
      }

      function addRow() {
        const table = document.getElementById("table");
        const newRow = document.createElement("tr");

        newRow.innerHTML = `
                <td><input type="text" name="input1"></td>
                <td><input type="text" name="input2"></td>
                <td><input type="text" name="input3"></td>
                <td><input type="text" name="input4"></td>
            `;

        table.appendChild(newRow);
      }

      function confirmForm() {
        const inputs = document.querySelectorAll("#table input");
        const values = Array.from(inputs).map((input) => input.value);
        console.log(values); // Perform further actions with the form values

        closePopup();
      }
    </script>
  </body>
</html>
