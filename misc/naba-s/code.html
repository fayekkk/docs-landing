<style>
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.1s, visibility 0.1s;
  }

  .loading-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .loading-spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 0.2s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>

<script>
  $(document).ready(() => {
    setTimeout(() => {
      $(".top-actions").html(
        $(".top-actions").html() +
          `<div class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
    `
      );
      async function sending() {
        // Show the loading overlay
        $(".loading-overlay").addClass("show");

        console.log("clicked");
        let invoiceId = parseInt(window.location.href.split("/")[6]);
        const requests = [];
        const CurrInv = await $.get(`/api2/invoices/${invoiceId}`);
        console.log(invoiceId);
        const response = await $.get(
          `/v2/api/entity/work_order/list/1?filter[title]=${invoiceId}`
        );
        console.log(response);
        if (response.data.length == 0) {
          const today = new Date().toISOString().slice(0, 10);
          const sendReq = async () => {
            let SendBody = {
              WorkOrder: {
                client_id: CurrInv.data.Invoice.client_id,
                number: "sending",
                title: invoiceId,
                start_date: today,
                description: `${CurrInv.data.Invoice.date} :  التاربخ   ${CurrInv.data.Invoice.summary_total} إجمالى الفاتورة `,
                delivery_date: today,
                delivery_appointment_id: 0,
                follow_up_status_id: null,
                budget: 0,
                budget_currency: "SAR",
                status: "1=>Open",
                staff_id: [1],
              },
            };
            requests.push(
              fetch(`/api2/work_orders`, {
                method: "POST",
                headers: {
                  apikey: "4170d7b084d160d3a1372ee2735581041c0d0fd8",
                  Accept: "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(SendBody),
              })
                .then((response) => response.json())
                .then(async (data) => {
                  console.log(data);
                })
                .catch((error) => {
                  console.error(error);
                })
            );
          };
          await sendReq();
        } else {
          console.log("founded");
        }
        await Promise.all(requests);
        $(".loading-overlay").removeClass("show");
      }
      sending();
    }, 300);
  });
</script>
