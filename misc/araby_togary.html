  <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
  <html xmlns="http://www.w3.org/1999/xhtml">
    <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
      <title>Invoice Template</title>
    </head>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: transparent;
        font: 12px "Tahoma", Arial, Helvetica, sans-serif;
        direction: rtl;
        text-align: right;
      }
      .invoice-wrap {
        width: 660px;
        margin: 0 auto;
        background: #fff;
        color: #000;
      }
      .invoice-inner {
        margin: 0 30px;
        padding: 20px 0;
        font-size: 9px;
        font-weight: 600;
      }
      .invoice-address {
        border-top: 3px double #000000;
        margin: 35px 0;
        padding-top: 25px;
      }
      bold_title {
        font-weight: bold;
      }
      big_title {
        font-size: 18px;
        font-weight: 100;
      }
      .bussines-name {
        font-size: 18px;
        font-weight: 100;
      }
      .invoice-name {
        font-size: 22px;
        font-weight: 700;
      }

      .listing-table th {
        background-color: #e5e5e5;
        font-weight: bold;
        text-align: right;
        padding: 6px 4px;
        border-right: 1px solid black;
      }
        
      .listing-table th:first-child {
        border-right: 0;
      }
      .listing-table tr td:first-child {
        border-right: 3px solid black;
      }
      #listing_table th:last-child, #listing_table td:last-child {
        border-left: 3px solid black !important;
      }
      .listing-table tr:last-child td{
        border-bottom: 3px solid black;
      }


      .listing-table td {
        border-bottom: 1px solid #555555;
        text-align: right;
        padding: 5px 6px;
        vertical-align: top;
      }
      .total-table td {
        border-right: 1px solid black;
      }
      .total-row {
        background-color: #e5e5e5;
        border-bottom: 1px solid #555555;
        border-top: 1px solid #555555;
        font-weight: bold;
      }
      .row-items {
        margin: 5px 0;
        display: block;
      }
      .notes-block {
        margin: 50px 0 0 0;
      }

      tr,
      td,
      th {
        page-break-inside: avoid !important;
      }

      #business_info {
        line-height: 1.4;
      }
      #listing_table th:last-child,
      #listing_table td:last-child {
        border-left: 1px solid #555555;
      }
    

      #listing_table th:nth-child(2),
      #listing_table td:nth-child(2) {
        text-align: right;
        font-size: 9px;
      }

      .listing-table:nth-child(2) {
        display: none;
      }
      .qr-code img {
        margin-top: 10px;
      }
      #listing_table td,
      #listing_table th {
        font-size: 9px;
        text-align: center;
      }
    
      #items-list > table:nth-child(2) tr td:nth-child(2) {
        line-height: 1.3;
      }
      #header {
        border-top: 3px solid black;
        border-right: 3px solid black;
        border-left: 3px solid black;
      }

      .listing-table th:nth-child(1) {
        width: 12%;
      }

      .listing-table th:nth-child(2) {
        width: 30%;
      }

      .listing-table th:nth-child(3) {
        width: 10%;
      }

      .listing-table th:nth-child(4) {
        width: 10%;
      }

      .listing-table th:nth-child(5) {
        width: 10%;
      }

      .listing-table th:nth-child(6) {
        width: 9%;
      }

      .listing-table th:nth-child(7) {
        width: 10%;
      }
      .listing-table th:nth-child(8) {
        width: 9%;
      }
      .listing-table tbody tr td:nth-child(5){
        color: blue;
        border-bottom: 1px solid black
      }
      .listing-table tbody tr td:nth-child(7){
        color: red;
        border-bottom: 1px solid black
      }
      .listing-table tbody tr td:nth-child(7),.listing-table tbody tr td:nth-child(8){
text-align: right !important;
      }
    </style>
    <body>
      <div class="invoice-wrap">
        {%html_sticky_header%}

              <tr>

                    <tr>
                      <td

                    <tr>

                    </tr>
                    <tr>

                  </table>
                </td>
                <td>
                  <table id="header_left_side" style="width: 100%;height: 100px;">
                    <tr>
                      <td style="text-align: left; width: 50%; padding: 2px 0 0 4px">
                        الرقم الضريبى للعميل
                      </td>
                      <td style="text-align: center; width: 50%">55</td>
                    </tr>
                    <tr>
                      <td
                        style="text-align: left; position: relative; padding: 2px 0 0 4px"
                      >
                        رقم الفاتورة
                        <span
                          style="
                            position: absolute;
                            display: inline-block;
                            width: 35%;
                            height: 1px;
                            left: 0;
                            top: 0;
                            background-color: black;
                          "
                        ></span>
                      </td>
                      <td style="text-align: center">55</td>
                    </tr>
                    <tr>
                      <td
                        style="text-align: left; position: relative; padding: 2px 0 0 4px"
                      >
                        طريقة الدفع
                        <span
                          style="
                            position: absolute;
                            display: inline-block;
                            width: 35%;
                            height: 1px;
                            left: 0;
                            top: 0;
                            background-color: black;
                          "
                        ></span>
                      </td>
                      <td style="text-align: center">55</td>
                    </tr>
                    <tr>
                      <td
                        style="text-align: left; position: relative; padding: 2px 0 0 4px"
                      >
                        رقم الهاتف
                        <span
                          style="
                            position: absolute;
                            display: inline-block;
                            width: 35%;
                            height: 1px;
                            left: 0;
                            top: 0;
                            background-color: black;
                          "
                        ></span>
                      </td>
                      <td style="text-align: center">55</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>
          <div id="items-list">{%items_list%}</div>

          {%html_sticky_footer%}
        </div>
      </div>
      <script>

  //////////////////////split Td
  function splitTD(){
  var td1 = document.querySelector("#listing_table th:nth-child(3)");
  var td2 = document.querySelector("#listing_table th:nth-child(4)");
  var newTd = document.createElement("th");
  newTd.setAttribute("colspan", "2");
  newTd.style.padding = "0";
  newTd.innerHTML = '<p style="display: inline-block;width: 100%;height: 16px;border-bottom: 1px solid black;     padding-top: 2px;">العدد Quantity</p>'+
    ' <div style="display:inline-block; width: 60px; height:15px">'+
      '<p style="border-left: 1px solid black;display: inline-block;width: 28px;height: 14px;padding-top: 2px;">طرد</p>'+
      '<p style="display:inline-block; width : 27px;">فرط</p>'+
      '</div> ';
  td1.parentNode.replaceChild(newTd, td1);
  td2.parentNode.removeChild(td2);
  }

  try{
    splitTD()
  }
  catch(e){

  }









          ////////////////////////////////////////add empty rows ////////////////////
          function addNewRows() {
            var selectedDiv = document.querySelector("#items-list");
            while (selectedDiv.offsetHeight < 430) {
              var i = document.querySelectorAll("#listing_table tbody tr").length;
              const newTr = document.createElement("tr");
              for (var j = 0; j < 8; j++) {
                if (j == 0) {
                  var newTd = document.createElement("td");
                  newTd.innerText = ' ';
                  newTr.appendChild(newTd);
                } else {
                  var newTd = document.createElement("td");
                  newTr.appendChild(newTd);
                }
              }
              document.querySelector("#listing_table tbody").appendChild(newTr);
              i++;
            }
          }
          try{
            addNewRows();
          }catch(e){}

    ////////////////////////////////////////add new rows ////////////////////
        function appendNewChild() {
          var newTR = document.createElement("tr");
          newTR.innerHTML =
            "<tr>" +
            ' <td style="height: 20px; text-align:right; padding: 10px 5px 0 0; background-color:#e5e5e5; border-top: 1px solid black" colspan="2";  > الاجمالى </td>' +
            ' <td id="total_package" style="text-align: center;padding-top: 10px; border-top: 1px solid black"></td>' +
            '<td style="border-top: 1px solid black; text-align: center;padding-top: 10px;" id="total_package_smalls"></td>' +
            "  <td style = ' border-top: 1px solid black; background-color:#e5e5e5;'></td>" +
            " <td style=' border-top: 1px solid black ;text-align: center;padding-top: 10px; background-color:#e5e5e5;' id='total_QTY'></td>" +
            " <td style=' border-top: 1px solid black;text-align: center;padding-top: 10px; background-color:#e5e5e5;color:black; ' ></td>"+
            "<td style=' border-top: 1px solid black;text-align: center;padding-top: 10px; background-color:#e5e5e5; color:black;'> {%invoice_subtotal%}</td> " +
            "</tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr><td colspan="6"></td>' +
            '   <td style="border-right:0;"> خصم</td>' +
            ' <td style="border-right:0;"> {%discount%}</td>' +
            "  </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr><td colspan="6"></td>' +
            ' <td style="border-right:0;"> الصافى</td>' +
            '<td style="border-right:0; "> {%invoice_subtotal%}</td>' +
            "  </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr><td colspan="6"></td>' +
            '  <td style="border-right:0;"> الضريبة</td>' +
            ' <td style="border-right:0;"> {%tax-total%}</td>' +
            "   </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr><td colspan="5" >{%invoice_total_spelled%}</td>' +
            '<td style="border-right:0;text-align: center;" colspan="2"> الصافي شامل الضريبة</td>' +
            ' <td style="border-right:0;"> {%invoice_total%}</td>' +
            "  </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            "<tr>" +
            ' <td colspan="8"><span style="width: 48%; text-align: right; padding-right: 10px;  display: inline-block;">' +
            ' البنك الاهلى التجارى <span style="width: 30px;"> </span> ' +
            "(مؤسسة اول ثقة)</span>" +
            ' <span style="width: 48%; text-align: right; padding-right: 10px;  display: inline-block;">26261625000105</span></td>' +
            "</tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr> <td colspan="8"><span  style="width: 48%; text-align: right; padding-right: 10px;  display: inline-block;">' +
            ' مصرف الراجحى<span style="width: 30px;" > </span>' +
            " (مؤسسة اول ثقة)</span>" +
            ' <span style="width: 48%; text-align: right; padding-right: 10px;  display: inline-block;">331608010355360 </span> </td>' +
            "   </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);

          var newTR = document.createElement("tr");
          newTR.innerHTML =
            '<tr><td colspan="2" style=" ;width: 50%; text-align: right; padding-right: 10px;">البائع</td>' +
            '<td colspan="4" style="border-right :0; width: 25%; text-align: right; padding-right: 10px;">امين المستودع</td>' +
            '<td colspan="2" style=" border-right:0;width: 25%; text-align: right; padding-right: 10px;">المستلم</td>' +
            " </tr>";
          document.querySelector("#listing_table tbody").appendChild(newTR);
        }
        try {
          appendNewChild();
        } catch (e) {}
      ////////////////////////////////////////count packs Totals ////////////////////

      function countPackageTotals(){
      var rows = document.querySelectorAll('#listing_table tbody tr');
      var totalpacks=0;
      var totalSmalls = 0;
      var totalQTY =0;
      for(var i = 0 ; i <rows.length -8;i++){
      var selectedRow = rows[i];
      if(selectedRow.cells[0].innerText !== ''){
        totalpacks = totalpacks + parseInt(selectedRow.cells[2].innerText) ;
        totalSmalls =totalSmalls + parseInt(selectedRow.cells[3].innerText);
        totalQTY = totalQTY +  parseInt(selectedRow.cells[6].innerText);
      
      }

    }
    document.querySelector('#total_package').innerHTML=totalpacks;
    document.querySelector('#total_package_smalls').innerHTML= totalSmalls ;
    document.querySelector('#total_QTY').innerHTML= totalQTY ;
    }
    try{
      countPackageTotals()
    }catch(e){
    
    }





        ///////////////////////////////swap cols ///////////////////////////////
  function swapCols(){
    var rows = document.querySelectorAll('#listing_table tbody tr');
    for(var i = 0 ; i <rows.length -8;i++){
    var selectedRow = rows[i];
    var contain = selectedRow.cells[6].innerHTML;
    selectedRow.cells[6].innerHTML = selectedRow.cells[5].innerHTML;
    selectedRow.cells[5].innerHTML = contain;
  }

  var headrows = document.querySelectorAll('#listing_table thead tr');
  var selectedHeadRow = headrows[0];
    var Headcontain = selectedHeadRow.cells[5].innerHTML;
    selectedHeadRow.cells[5].innerHTML = selectedHeadRow.cells[4].innerHTML;
    selectedHeadRow.cells[4].innerHTML = Headcontain;
  }
  try{
    swapCols()
  }catch(e){}

  </script>
