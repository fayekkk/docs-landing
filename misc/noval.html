<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Tajawal:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    body {
      direction: rtl;
      background: #ffffff;
      font-size: 12px;
      font-family: "Roboto", sans-serif;
      text-align: right;
    }
    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }
    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }
    /*  Start of first_page styles */
    #first_page {
      width: 100%;
      height: 1020px;
    }
    #first_page_table {
      width: 100%;
      height: 100%;
    }
    /*  End of first_page styles */
  </style>
  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}

      <div class="invoice-inner">
        <div id="first_page">
          <table id="first_page_table">
            <tbody>
              <tr>
                <td id="inv_title">{%invoice_title%}</td>
                <td id="site_logo">{%site_logo%}</td>
              </tr>
              <tr>
                <td id="client_name">
                  <span>To</span>
                  <span>{%client_business_name%}</span>
                  <span>إلي</span>
                </td>
                <td id="listing_tbl_con">
                  <div id="items-list">{%items_list%}</div>
                </td>
              </tr>
              <tr>
                <td id="inv_data">
                  <div>Invoice # :</div>
                  <div>Invoice Date :</div>
                  <div>Account No :</div>
                  <div id="payment">Payment Method</div>
                </td>
                <td id="totals"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      {%html_sticky_footer%}
    </div>

    <script>
      function clearInner() {
        document.querySelector(".invoice-inner").innerHtml =
          document.getElementById("first_page");
      }
      try {
        clearInner();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
