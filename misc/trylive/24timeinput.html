<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24-Hour Time Input with Flatpickr</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>
  <body style="font-family: Arial, sans-serif; margin: 20px">
    <label for="timeInput">اختر الوقت:</label>
    <input type="text" id="timeInput" placeholder="HH:MM" />

    <script>
      flatpickr("#timeInput", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i",
        defaultHour: 0,
        defaultMinute: 0,
        minuteIncrement: 1,
        time_24hr: true,
      });
    </script>
  </body>
</html>
