<script>
  var map = L.map("map").setView([51.505, -0.09], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  L.Routing.control({
    waypoints: [L.latLng(51.5, -0.09), L.latLng(51.52, -0.1)],
  }).addTo(map);
</script>
