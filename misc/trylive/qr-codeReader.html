<script>
  function parseQRCodeData(qrCodeData) {
    // Split the QR code data into individual components
    const components = qrCodeData.match(/(\d{10})(\d{4})(\w+)(\d{8})?/);

    if (components && components.length === 5) {
      return {
        productCode: components[1],
        additionalCode: components[3],
        expirationDate: components[4] ? components[4] : "",
      };
    } else {
      return {
        productCode: "",
        additionalCode: "",
        expirationDate: "",
      };
    }
  }
  function extractLotAndExpiry(input) {
    // Regular expression to match the pattern
    const regex = /(\d{24})([a-z]{3}\d{2}[a-z]\d{3}).*?(\d{6})?/;
    const match = input.match(regex);

    if (match) {
      const fullCode = match[1];
      const lotNumber = match[2];
      const expiryShort = match[3];

      let expiryLong = "";
      if (expiryShort) {
        const day = expiryShort.slice(0, 2);
        const month = expiryShort.slice(2, 4);
        const year = expiryShort.slice(4, 6);
        expiryLong = `20${year}/${month}/${day}`;
      }

      return {
        fullCode,
        lotNumber,
        expiryShort,
        expiryLong,
      };
    }

    return null;
  }

    "010880012170839510pte24e19311240503210084",
    "010880004060055810pte24b13311240213210092",
    "010880000097225110pte22g22111220729210015",
    "010880004062784510ptl22f07111220530210205",
    "010085207200701810io23010311123051917260519",
    "010880004065204510fmn20g0421120072721003517280726",
  ];

  testData.forEach((item, index) => {
    const result = extractLotAndExpiry(item);
    if (result) {
      console.log(`Item ${index + 1}:`);
      console.log(`  Full Code: ${result.fullCode}`);

    } else {

    }
    let res = parseQRCodeData(item);
    console.log(res);

</script>
