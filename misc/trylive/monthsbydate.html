<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="date"></div>
    <script>
      try {
        var months = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        var mydate = "11/2/2023";
        document.getElementById("date").innerText =
          months[mydate.split("/")[1] - 1];
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
