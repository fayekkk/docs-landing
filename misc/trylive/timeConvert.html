<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="curr_time">15:43 am</div>
    <div id="converted_time"></div>
    <script>
      function convertTime() {
        var currTime = document.getElementById("curr_time").innerText.trim();
        if (currTime.split(" ").length == 1) {
          var myTime = parseInt(currTime.split(":")[0]);
          if (myTime > 11) {
            document.getElementById("curr_time").innerText =
              myTime - 12 + ":" + currTime.split(":")[1] + " pm ";
          } else {
            document.getElementById("curr_time").innerText =
              myTime + ":" + currTime.split(":")[1] + " am ";
          }
        }
      }
      try {
        convertTime();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
