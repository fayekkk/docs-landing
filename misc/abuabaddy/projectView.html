<script>
  $(document).ready(function () {
    function getCurrentDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }
    setTimeout(() => {
      let ProjId = parseInt(window.location.href.split("/")[6]);
      $(".dropdown-btn-group > a:first-child")
        .clone()
        .attr("href", `/v2/owner/children/le_deliveryrecipt/create/${ProjId}`)
        .html("أضف إذن تسليم")
        .appendTo(".invoice-actions");
    }, 500);
    setTimeout(() => {
      let ProjId = parseInt(window.location.href.split("/")[6]);
      $(".dropdown-btn-group > a:first-child")
        .clone()
        .attr("href", `#`)
        .attr("id", "addEstimate")
        .html("إصدار عرض سعر")
        .appendTo(".invoice-actions");
      async function fetchProjectData() {
        try {
          const response = await fetch(
            `/v2/api/entity/le_workflow-type-entity-2/${ProjId}/4`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
            }
          );
          const data = await response.json();
          console.log("Response:", data);
          return data;
        } catch (error) {
          console.error("Error:", error);
          return null;
        }
      }
      $("#addEstimate").on("click", async () => {
        const projectData = await fetchProjectData();
        console.log(projectData);
        let clientId = projectData.client_id;
        const itemsarr = projectData["le_workflow-type-entity-2_custom_data"][
          "le_custom_data_le_workflow-type-entity-2_le_custom_data_le_workflow-type-entity-2_project_items"
        ].map((item) => ({
          product_id: item.project_item_name,
          item: item[
            "le_custom_data_le_workflow-type-entity-2_project_items_project_item_name"
          ].name,
          description: JSON.stringify({
            innercolorinput: item.innercolorinput,
            covercolorinput: item.covercolorinput,
            innerpaperinput: item.innerpaperinput,
            coverpaperinput: item.coverpaperinput,
            covertypeinput: item.covertypeinput,
            no_of_copies: item.no_of_copies,
            numpering: item.numpering,
            language_type: item.language_type,
            ordersinput: item.ordersinput,
            description2: item.description2,
          }),
          unit_price: item.ttl_price,
          quantity: item.quantity,
          col_3: "",
          col_4: "",
          col_5: "",
          tax1: item.taxes,
          tax2: 0,
        }));
        let body = {
          Estimate: {
            subscription_id: "",
            store_id: 1,
            po_number: 26,
            client_id: clientId,
            client_email: "",
            client_country_code: "SAR",
            draft: "1",
            follow_up_status: null,
            work_order_id: ProjId,
            staff_id: 0,
            name: "",
            is_offline: true,
            currency_code: "SAR",
            date: getCurrentDate(),
            discount: 0,
            discount_amount: 0,
            deposit: 0,
            deposit_type: 0,
            discount_amount: 0,
            discount: 0,
            notes: "",
            html_notes: "",
            invoice_layout_id: "4",
            estimate_id: 0,
            shipping_options: "",
            shipping_amount: null,
            follow_up_status: null,
            requisition_delivery_status: null,
            pos_shift_id: null,
          },
          InvoiceItem: itemsarr,
          InvoiceCustomField: [],
        };
        console.log(body);

        fetch(`/api2/estimates?send=draft`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        })
          .then((res) => res.json())
          .then((response) => {
            console.log(response);
            location.reload();
          })
          .catch((err) => {
            console.log(err);
          });
      });
    }, 250);
  });
</script>
