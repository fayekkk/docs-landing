<script>
  $(document).ready(function () {
    setTimeout(() => {
      var Goldprices;
      async function getGoldRates() {
        var myHeaders = new Headers();
        myHeaders.append("x-access-token", "goldapi-vbiimslw5dbel7-io");
        myHeaders.append("Content-Type", "application/json");

        var requestOptions = {
          method: "GET",
          headers: myHeaders,
          redirect: "follow",
        };

        await fetch("https://www.goldapi.io/api/XAU/SAR", requestOptions)
          .then((response) => response.text())
          .then((results) => {
            let result = JSON.parse(`${results}`);
            console.log(result);
            Goldprices = result;
            console.log({ Goldprices: Goldprices });
            return result;
          });
      }
      getGoldRates();
      function screenCode() {
        var allrows = $("#listing_table tr");
        allrows.each(function () {
          var rows = $(this);

          const onselectItem = (selector) => {
            rows.find(selector).on("change", function () {
              console.log($(this).val());
              let result = Goldprices;
              console.log(Goldprices);
              console.log(result);
              $.get(
                `/v2/api/entity/product_item_barcode/list/1?filter[product_id]=${$(
                  this
                ).val()}`
              ).then((product) => {
                console.log(product);
                let category =
                  product.data[0].product_item_barcode_product.brand;
                console.log(category);
                let itemprice = -1;
                console.log(category);
                switch (category) {
                  case "24k":
                    itemprice = result.price_gram_24k;
                    break;
                  case "22k":
                    itemprice = result.price_gram_22k;
                    break;
                  case "21k":
                    itemprice = result.price_gram_21k;
                    break;
                  case "20k":
                    itemprice = result.price_gram_20k;
                    break;
                  case "18k":
                    itemprice = result.price_gram_18k;
                    break;
                  case "16k":
                    itemprice = result.price_gram_16k;
                    break;
                  case "14k":
                    itemprice = result.price_gram_14k;
                    break;
                  case "10k":
                    itemprice = result.price_gram_10k;
                    break;
                }
                if (itemprice != -1) {
                  console.log("here");
                  console.log(product.data[0].unit_price);
                  console.log(itemprice);
                  let price =
                    parseFloat(product.data[0].unit_price) +
                    parseFloat(itemprice);
                  console.log(price);

                  $(this)
                    .closest("tr")
                    .find(".unit-price input")
                    .val(price)
                    .change();
                  console.log(product.data[0].quantity);
                  $(this)
                    .closest("tr")
                    .find(".Quantity input")
                    .val(product.data[0].quantity)
                    .change();
                } else {
                  alert("ther's an error");
                }
              });
            });
          };
          onselectItem(".item-id");
        });
      }

      setTimeout(() => {
        screenCode();
      }, 500);
      $("#AddItem").on("click", function () {
        screenCode();
      });
      console.log(Goldprices);

      //   onReceiveBarCode
      onReceiveBarCode = function () {
        let code = "";
        $(document).on("keydown", function (event) {
          if (event.keyCode === 13) {
            result = Goldprices;
            $.get(
              `/v2/api/entity/product_item_barcode/list/1?filter[barcode]=${code}`
            ).then((product) => {
              console.log(product);
              let category = product.data[0].product_item_barcode_product.brand;
              console.log(category);
              let itemprice = -1;
              console.log(category);
              switch (category) {
                case "24k":
                  itemprice = result.price_gram_24k;
                  break;
                case "22k":
                  itemprice = result.price_gram_22k;
                  break;
                case "21k":
                  itemprice = result.price_gram_21k;
                  break;
                case "20k":
                  itemprice = result.price_gram_20k;
                  break;
                case "18k":
                  itemprice = result.price_gram_18k;
                  break;
                case "16k":
                  itemprice = result.price_gram_16k;
                  break;
                case "14k":
                  itemprice = result.price_gram_14k;
                  break;
                case "10k":
                  itemprice = result.price_gram_10k;
                  break;
              }
              if (itemprice != -1) {
                let price = product.data[0].unit_price + itemprice;
                let itemsData = {
                  item_id: product.data[0].product_id,
                  item_qty: product.data[0].quantity,
                  item_price: price,
                  discount: 0,
                  discount_type: "",
                  product_name: "",
                };
                console.log(itemsData);
                $(
                  `#pos-wrapper > div.pos-content > app-invoice > div 
                            > div.calc-wrapper > div > div.subwindow-container-fix.pads >
                            section.content-numpad >
                            button.btn.btn-md.m-0.ng-tns-c1-0.text-danger.btn-light.ng-star-inserted`
                ).click();
                angularComponentRef.arryAddItemToInvoice([itemsData]);
              } else {
                alert("ther's an error");
              }
            });

            code = "";
          } else {
            console.log(code);
            code += event.key;
          }
        });
      };
      // onReceiveBarCode();
    }, 500);
  });
</script>
