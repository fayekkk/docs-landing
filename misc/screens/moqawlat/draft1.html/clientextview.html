          function parsetoarray(returnedData) {
            let parsedData;
            try {
              parsedData = JSON.parse(returnedData);
            } catch (e) {
              parsedData = returnedData;
            }
            let dataArray;
            if (Array.isArray(parsedData)) {
              dataArray = parsedData;
            } else if (typeof parsedData === "object" && parsedData !== null) {
              dataArray = Object.values(parsedData);
            } else {
              dataArray = [parsedData];
            }
            return dataArray;
