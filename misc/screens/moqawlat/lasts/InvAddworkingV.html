<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
      <div class="m-r-md d-inline-flex">
        <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">احسب ضمان الأعمال</a>
      </div>
      <div style="display: inline-block; max-width: 100px;">
        <label class="ui-input-label l-input-label adjust-tab-input-label">النسبة</label>
        <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
      </div>
      <div class="error-box hidden">
        <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
        <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
      </div>
    </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);

    // getting second tax
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#InvoiceAdjustmentLabel").val("خصم ضمان أعمال");
    }

    // calculating retention funtion
    function calcRetention() {
      var retentionValue = $("#InvoiceAdjustmentValue");
      var total =
        parseFloat($("#SubtotalValue").text().replace(/,/g, "")) + tax;
      if (isNaN(total)) {
        total = 0;
      }

      // calculating retention from subtotal
      $("#InvoiceAdjustmentValue").val(
        (parseFloat($("#InvoiceRetention").val() * 0.01) * total * -1).toFixed(
          2
        )
      );
      $("#InvoiceAdjustmentValue").change();

      // getting retention value
      function getRetPerc() {
        let retPer = $("#InvoiceRetention").val();
        return retPer;
      }

      // changing the adjustment label with the retention percentage
      $("#InvoiceAdjustmentLabel").val(`خصم ضمان أعمال (${getRetPerc()}%)`);

      // LOCAL STORAGE (saving new retention value)
      localStorage.setItem("retention", $("#InvoiceRetention").val());
    }

    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    if (adjLbl.text() == "التسوية") {
      adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    }

    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }
  });
</script>

              .removeClass("showcalctype");
            clickedMenu.toggleClass("showcalctype");
          });
        const $customDropdown = $("<div>")
          .html(
            `

              <ul class="calctype-menu">
                <li  data-value="1" class="activate">نسبة مئوية %</li>
                <li  data-value="2"> المبلغ</li>
              </ul>
            `
          )
          .attr({
            class: "custom-dropdown",
          })
          .append(custombtn);
        // Handle dropdown menu item click
        $(document).on(
          "click",
          ".custom-dropdown .calctype-menu li",
          function (event) {
            event.preventDefault();
            event.stopPropagation();
            var selectedOption = $(this).data("value");
            const $currentRow = $(this).closest("tr");
            const $valueInput = $currentRow.find(".value-input");
            const $precentInput = $currentRow.find(".percentage-input");
            if (selectedOption == 1) {
              $valueInput.attr("readonly", true);
              $precentInput.attr("readonly", false);
              $valueInput.addClass("disabledinp");
              $precentInput.removeClass("disabledinp");
              $(this)
                .closest(".custom-dropdown")
                .find(".calctype-menu")
                .removeClass("showcalctype");
              $(this)
                .closest("tr")
                .find(".calctype-menu li")
                .removeClass("activate");
              $(this).addClass("activate");
            } else if (selectedOption == 2) {
              $precentInput.attr("readonly", true);
              $valueInput.attr("readonly", false);
              $valueInput.removeClass("disabledinp");
              $precentInput.addClass("disabledinp");
              $(this)
                .closest(".custom-dropdown")
                .find(".calctype-menu")
                .removeClass("showcalctype");
            }
            $(this)
              .closest("tr")
              .find(".calctype-menu li")
              .removeClass("activate");
            $(this).addClass("activate");
            var dropdownToggle = $(this)
              .closest(".custom-dropdown")
              .find(".calctype-dropdown");
            console.log($(this).text());
            dropdownToggle.text($(this).text());
          }
        );

        $(document).on("click", function (event) {
          if (!$(event.target).closest(".calctype-dropdown").length) {
            $(".calctype-menu").removeClass("showcalctype");
          } else if (
            $(event.target).closest(".calctype-dropdown").length &&
            $(event.target).closest(".showcalctype").length
          ) {
            console.log("here");
          }
        });

        // Selector
        if (!selectorOptions) {
          const { $selectorInput, options } = await initializeSelector();
          selectorOptions = options;
        }

        const $newSelectorInput = $("<select>").attr({
          class: "selector-input",
        });
        $("<option>")
          .val("-1")
          .text("Choose account")
          .attr("name", "sss")
          .appendTo($newSelectorInput);

        selectorOptions.forEach(function (option) {
          $("<option>")
            .val(option.JournalAccount.id)
            .text(option.JournalAccount.name)
            .attr("name", "sss")
            .appendTo($newSelectorInput);
        });

        $newSelectorInput
          .select2({
            templateSelection: function (item) {
              // Disable already selected options
              if (item.id !== "-1") {
                const selectedOptions = $(".selector-input")
                  .not(this)
                  .map(function () {
                    return $(this).val();
                  })
                  .get();
                if (selectedOptions.includes(item.id.toString())) {
                  return $("<span>").text(item.text).addClass("text-muted");
                }
              }
              return item.text;
            },
          })
          .on("change", function () {
            const selectedOption = $(this).val();
            const selectedOptionindex = $(this)
              .closest("tr")
              .find(".selector-input ")
              .prop("selectedIndex");
            const selectedOptiontext = document.querySelectorAll(
              "#accounts_table  tbody tr:nth-child(1) .selector-input   option"
            )[selectedOptionindex].text;
            console.log(selectedOptiontext);

            // Check if the selected option is already selected in another row
            const selectedOptions = $(".selector-input")
              .not(this)
              .map(function () {
                return $(this).val();
              })
              .get();
            if (
              selectedOptions.includes(selectedOption) &&
              selectedOption !== "-1"
            ) {
              alert("لا يمكن إختيار نفس الحساب مرتين ");
              $(this).val("-1").change();
            }

            if (
              selectedOption != -1 &&
              !selectedOptions.includes(selectedOption)
            ) {
              $(this)
                .closest("tr")
                .find(".value-input ")
                .attr(
                  "name",
                  `data[invoice_accounts][${selectedOption}][value]`
                )
                .attr("data-accountid", `${selectedOption}`)
                .attr("id", `invoice_accounts${selectedOption}Value`)
                .data("label", `${selectedOptiontext}`)
                .change();

              // add attributes to Label Input
              $(this)
                .closest("tr")
                .find(".label-input")
                .attr(
                  "name",
                  `data[invoice_accounts][${selectedOption}][label]`
                )
                .attr("id", `invoice_accounts${selectedOption}Label`)
                .attr("value", selectedOptiontext)
                .val(selectedOptiontext)
                .change();
            } else {
              $(this)
                .closest("tr")
                .find(".value-input")
                .attr("name", ``)
                .attr("data-accountid", ``)
                .attr("data-label", ``)
                .attr("id", ``);

              $(this)
                .closest("tr")
                .find(".label-input")
                .attr("name", ``)
                .attr("id", ``)
                .val("")
                .change();
            }
          });

        $row.append(
          $("<td  class = 'labelInputtd'>").append($labelInput),
          $("<td class = 'entervalselecttd'>").append(
            $entervalselect,
            $customDropdown
          ),
          $("<td  class = 'percentageInputtd'>").append($percentageInput),
          $("<td  class = 'valueInputtd'>").append($valueInput),
          $("<td  class = 'newSelectorInputtd'>").append($newSelectorInput),
          $("<td  class = 'removerowtd'>").append($removerow)
        );

        $("#accounts_table tbody").append($row);
        // $(".loaderr").remove();
        $(".loaderCon").hide();
        $(".loaderCon").addClass("loadedseccess");

        // Initialize the Select2 plugin for the new row
        $row.find(".selector-input").select2();
      }

      // Append the first row
      setTimeout(() => {
        appendRow();
      }, 1000);

      // Add a button to append more rows
      $("<button class='add-account'>")
        .html(
          `<i class="s2020 far fa-plus-circle text-primary mr-2"> </i> إضافة`
        )

        .on("click", (e) => {
          e.preventDefault();
          appendRow();
        })
        .appendTo("#accounts_table");
    }
    // show or hide here
    const btn = $(".toggle-btn");
    // checkActivated();
    btn.on("click", () => {
      $(".toggle-btn").toggleClass("active");
      if (
        $(".toggle-btn").attr("class").indexOf("active") != -1 &&
        $("#accounts_table").attr("loaded") != 1
      ) {
        addAccountsSettings();

        $(".loaderCon").attr("style", "display:flex");

        $("#accounts_table").removeClass("hidden1");
        $(".percentage-checkbox").removeClass("hidden1");
        $("#accounts_table").attr("loaded", 1);
      } else if (
        $(".toggle-btn").attr("class").indexOf("active") != -1 &&
        $("#accounts_table").attr("loaded") == 1
      ) {
        $("#accounts_table").removeClass("hidden1");
        $(".percentage-checkbox").removeClass("hidden1");
      } else {
        let isVal = 0;

        let selectors = $("#accounts_table .selector-input ");
        selectors.each(function () {
          if ($(this).val() != -1) {
            isVal = 1;
            console.log("yess");
          }
        });
        if (isVal == 1) {
          let result = confirm(
            " يرجى العلم أنه سيتم حذف جميع القيم المدخلة مسبقاً"
          );
          if (result === true) {
            let deleteall = $(".deleteaccounts");
            deleteall.each(function () {
              $(this).click();
            });
            $("#accounts_table").addClass("hidden1");
            $(".percentage-checkbox").addClass("hidden1");
          } else {
            $(".toggle-btn").toggleClass("active");
          }
        } else {
          $("#accounts_table").addClass("hidden1");
          $(".percentage-checkbox").addClass("hidden1");
        }
      }
    });
    $(document).on(
      "change",
      " .item-unit-price, .item-qty, .item-discount, .unit-quantity, .multi_units_price",
      function () {
        if ($("#accounts_table").attr("loaded") == 1) {
          var allaccountsRows = $("#accounts_table tbody tr ");
          allaccountsRows.each(function () {
            let inputtype = $(this).find(".activate").data("value");
            console.log({ inputtype: inputtype });
            if (inputtype == 1) {
              let per = $(this).find(".percentage-input").val();
              $(".percentage-input").trigger("change");
              $(this).find(".percentage-input").val(per).change();
            } else {
              let val = $(this).find(".value-input").val();
              $(".value-input").trigger("change");
              $(this).find(".value-input").val(val).change();
            }
          });
        }
      }
    );
    if (window.location.href.includes("invoices/edit")) {
      let InvId = parseInt(window.location.href.split("/")[6]);
      fetch(`/v2/api/entity/invoice/${InvId}/1`, {
        method: "GET",
      })
        .then((response) => response.json())
        .then((data) => {
          let extradetails = JSON.parse(data.extra_details);
          console.log({ extradetails: extradetails });
          console.log(extradetails.invoice_accounts);
          if (extradetails.invoice_accounts != undefined) {
            $(".toggle-btn").trigger("click");
            const intervalVar = setInterval(() => {
              if (!$(".loadedseccess").length) {
                console.log("Loader element found!");
              } else {
                clearInterval(intervalVar);
                console.log("Loader element not found.");
                let invoiceaccounts = extradetails.invoice_accounts;
                console.log(Object.keys(invoiceaccounts).length);
                let accountslength = Object.keys(invoiceaccounts).length - 1;
                let counter = 0;
                for (const key in invoiceaccounts) {
                  if (invoiceaccounts.hasOwnProperty(key)) {
                    console.log(invoiceaccounts[key]);
                    let allRows = $("#accounts_table table tbody tr");
                    const obj = invoiceaccounts[key];
                    allRows
                      .eq(counter)
                      .find(".selector-input")
                      .val(String(key))
                      .change();

                    allRows
                      .eq(counter)
                      .find(".value-input")
                      .val(obj.value)
                      .change();

                    allRows
                      .eq(counter)
                      .find(".label-input")
                      .val(obj.label)
                      .change();

                    if (counter < accountslength) {
                      $(".add-account").click();
                    }
                    counter += 1;
                  }
                }
              }
            }, 250);
          }
        })
        .catch((error) => {
          console.error(error);
        });
    }
    if (window.location.href.includes("invoices/add")) {
      // adddefaultaccounts();
    }
  });
</script>
