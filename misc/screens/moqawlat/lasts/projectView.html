<script>
  if (
    document.referrer.includes("edit") ||
    document.referrer.includes("le_workflow-type-entity-2/list")
  ) {
    $(document).ready(() => {
      var extraIframe = $("#tab-iframe-0");
      extraIframe.on("load", function () {
        var iframeContents = $(this).contents();
        var deleteBtn = iframeContents.find(".delete-action");
        var editBtn = iframeContents.find(".rowActionDropDown a:nth-child(2)");
        console.log(deleteBtn);
        for (let i = 0; i < deleteBtn.length; i++) {
          $.get(
            `/v2/api/entity/le_clientextraction/${
              deleteBtn[i].href.split("/")[7]
            }/1`
          ).then((data) => {
            console.log(data);
            const status = data.invoicing_status1;
            const confirmStatus = data.confirmation_status;
            if (status == "تم الفوترة" || confirmStatus == "تم الإعتماد") {
              $(deleteBtn[i]).hide();
              $(editBtn[i]).hide();
              console.log("status = تم الفوترة");
            } else {
              console.log("status !== تم الفوترة");
            }
          });
        }
      });
    });
  }
</script>
