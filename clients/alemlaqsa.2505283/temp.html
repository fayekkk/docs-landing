<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      font: 12px "Tahoma", Arial, Helvetica, sans-serif;
      direction: rtl;
      text-align: right;
    }
    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }
    .invoice-inner {
      margin: 0 30px;
      padding: 20px 0;
    }
    .listing-table th {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }
    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }
    .total-table td {
      border-right: 1px solid #555555;
    }
    .total-row {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }
    .row-items {
      margin: 5px 0;
      display: block;
    }
    bold_title {
      font-weight: bold;
    }
    strong_tag {
      font-weight: bold;
    }
    big_title {
      font-size: 18px;
      font-weight: 100;
    }
    .notes-block {
      margin: 50px 0 0 0;
    }

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }
    .qr-code img {
      margin-top: 10px;
    }
    .customRow td {
      border-right: none !important;
      border-left: none !important;
    }
  </style>
  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td align="right" valign="top">
              <h1>
                <p id="invoice_title" class="editable-area invoice-name">
                  {%invoice_title%}
                </p>
              </h1>
              <div class="qr-code">{%sa_qr_code_image%}<br /></div>
            </td>
            <td align="left" valign="top">
              <img
                style="vertical-align: top; margin-bottom: 10px"
                id="logo"
                class="editable-area"
                src="{%logo%}"
                width="{%logo-width%}"
                height="{%logo-height%}"
              />
              <div id="business_info" class="editable-area">
                <p>{%business_info%}</p>
              </div>
            </td>
          </tr>
        </table>
        <br />
        <br />
        <br />
        <br />

        <div class="invoice-address">
          <table border="0" cellspacing="0" cellpadding="0" width="100%">
            <tr>
              <td align="right" valign="top">
                <div
                  style="vertical-align: top"
                  align="right"
                  id="client_info"
                  class="editable-area"
                >
                  <strong id="field1" class="editable-area">{%field1%}</strong
                  ><br />
                  {%client_info%}
                </div>
              </td>
              <td
                id="shipping_options"
                style="display: none"
                align="right"
                valign="top"
              >
                <div
                  style="vertical-align: top"
                  align="right"
                  id="ship_info"
                  class="editable-area"
                >
                  <strong id="label_ship" class="editable-area"
                    >{%label_ship%}</strong
                  ><br />
                  {%ship_info%}
                </div>
              </td>
              <td valign="top" align="left">
                <table
                  id="invoice_basics"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_invoice_no"
                        >{%label_invoice_no%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_number%}
                    </td>
                  </tr>
                  <tr>
                    <td align="left">
                      <strong class="editable-area" id="label_date"
                        >{%label_date%}</strong
                      >
                    </td>
                    <td style="padding-right: 20px" align="right">
                      {%invoice_date%}
                    </td>
                  </tr>
                </table>
                <custom_field
                  id="custom_fields"
                  class="editable-area"
                  style="clear: both"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                >
                  {%custom_fields%}
                </custom_field>
              </td>
            </tr>
          </table>
        </div>

        <br />
        <br />
        <br />
        <br />

        <div id="items-list">{%items_list%}</div>
        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>

        <br />
      </div>
      {%html_sticky_footer%}
    </div>
    <script>
      function addTtlQty() {
        var newRow = document.createElement("tr");
        newRow.classList.add("customRow");
        var itemCell1 = document.createElement("td");
        itemCell1.style.border = "none";
        var itemCell2 = document.createElement("td");
        itemCell2.innerText = "إجمالى الكمية";
        var itemCell3 = document.createElement("td");
        itemCell3.innerText = "{%invoice_item_qty%}";
        newRow.appendChild(itemCell1);
        newRow.appendChild(itemCell2);
        newRow.appendChild(itemCell3);
        document
          .querySelector(".listing-table:nth-child(2) tbody")
          .insertBefore(
            newRow,
            document.querySelectorAll(".listing-table:nth-child(2) tbody tr")[0]
          );
      }
      try {
        addTtlQty();
      } catch (error) {
        console.log(error);
      }
    </script>
  </body>
</html>
