<script>
  function getPreviousUrl() {
    return document.referrer;
  }

  function constructEditUrl() {
    const previousUrl = getPreviousUrl();
    if (previousUrl.includes("owner/purchase_invoices/view")) {
      const urlParams = new URLSearchParams(previousUrl.split("?")[1]);
      if (urlParams.has("filter[work_order_id]")) {
        const workOrderId = urlParams.get("filter[work_order_id]");
        const currurl = window.location.href;
        const editUrl = `${currurl}?filter[work_order_id]=${workOrderId}`;
        console.log("Redirecting to Edit URL:", editUrl);
        window.location.href = editUrl;
      }
    }
  }
  constructEditUrl();
</script>

<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
                      <div class="m-r-md d-inline-flex">
                        <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">احسب ضمان الأعمال</a>
                      </div>
                      <div style="display: inline-block; max-width: 100px;">
                        <label class="ui-input-label l-input-label adjust-tab-input-label">النسبة</label>
                        <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
                      </div>
                      <div class="error-box hidden">
                        <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
                        <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
                      </div>
                    </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);

    // getting second tax
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#InvoiceAdjustmentLabel").val("خصم ضمان أعمال");
    }

    // calculating retention funtion
    function calcRetention() {
      var retentionValue = $("#InvoiceAdjustmentValue");
      var total =
        parseFloat($("#SubtotalValue").text().replace(/,/g, "")) + tax;
      if (isNaN(total)) {
        total = 0;
      }

      // calculating retention from subtotal
      $("#InvoiceAdjustmentValue").val(
        (parseFloat($("#InvoiceRetention").val() * 0.01) * total * -1).toFixed(
          2
        )
      );
      $("#InvoiceAdjustmentValue").change();

      // getting retention value
      function getRetPerc() {
        let retPer = $("#InvoiceRetention").val();
        return retPer;
      }

      // changing the adjustment label with the retention percentage
      $("#InvoiceAdjustmentLabel").val(`خصم ضمان أعمال (${getRetPerc()}%)`);

      // LOCAL STORAGE (saving new retention value)
      localStorage.setItem("retention", $("#InvoiceRetention").val());
    }

    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    if (adjLbl.text() == "التسوية") {
      adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    }

    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    // console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }
  });
</script>

<script>
  $(document).ready(() => {
    setTimeout(() => {
      const searchableSelector = (() => {
        let hasLoadedOptions = false;
        let selector;

        return () => {
          if (!hasLoadedOptions) {
            let branchId = USER.branch_id;
            selector = document.createElement("select");
            selector.style.width = "100%";
            selector.setAttribute("class", "itemSelect");
            const option = document.createElement("option");
            option.textContent = "إختر الخدمة";
            option.style.textAlign = "center";
            selector.appendChild(option);
            let url = window.location.href;
            let urlObj = new URL(url);

            const workOrderId = new URLSearchParams(window.location.search).get(
              "filter[work_order_id]"
            );
            console.log({ workOrderId: workOrderId });

            $.get(
              `/v2/api/entity/le_workflow-type-entity-2/${workOrderId}/4`
            ).then((response) => {
              let options =
                response["le_workflow-type-entity-2_custom_data"][
                  "le_custom_data_le_workflow-type-entity-2_le_custom_data_le_workflow-type-entity-2_project_items"
                ];

              options.forEach((optionText) => {
                const option = document.createElement("option");
                option.textContent = optionText.item_name;
                option.dataset["purch_estimated_cost"] =
                  optionText.purch_estimated_cost;
                option.dataset["expenses_estimated_cost"] =
                  optionText.expenses_estimated_cost;
                option.dataset["rec_id"] = optionText.id;
                option.dataset["purch_actual_cost"] =
                  optionText.purch_actual_cost;
                option.dataset["expenses_actual_cost"] =
                  optionText.expenses_actual_cost;
                option.style.textAlign = "center";
                selector.appendChild(option);
              });

              hasLoadedOptions = true; // Set the flag to true after loading options
              attachSelectorsToRows(selector); // Attach the selector to rows after loading options
            });
          } else {
            attachSelectorsToRows(selector); // Reuse the selector if options have already loaded
          }
        };

        function attachSelectorsToRows(selector) {
          var allrows = document.querySelectorAll("#listing_table .itemRow ");
          for (let i = 0; i < allrows.length; i++) {
            if (!allrows[i].querySelector(".late_td select")) {
              allrows[i].querySelector(".late_td").innerHTML = "";
              allrows[i]
                .querySelector(".late_td")
                .appendChild(selector.cloneNode(true)); // Clone the selector for each row
            }
            if (!allrows[i].querySelector(".late2_td select")) {
              allrows[i].querySelector(".late2_td").innerHTML = "";
              allrows[i]
                .querySelector(".late2_td")
                .appendChild(selector.cloneNode(true));
            }
          }
        }
      })();

      // Event listener remains the same
      $(document).on(
        "change",
        ".item-unit-price, .item-qty, .itemSelect",
        function () {
          let closestTr = $(this).closest("tr");
          let selectedValue = closestTr.find(".itemSelect").val();
          let totalSubCost = 0;
          let totalActualCost = 0;
          let estimatedCost =
            parseFloat(
              closestTr
                .find(".itemSelect option:selected")
                .data("purch_estimated_cost")
            ) || 0;

          $(".itemRow").each(function () {
            let row = $(this);
            let rowSelectedValue = row.find(".itemSelect").val();
            if (rowSelectedValue === selectedValue) {
              let price = parseFloat(row.find(".item-unit-price").val()) || 0;
              let qty = parseFloat(row.find(".item-qty").val()) || 0;
              totalSubCost += price * qty;
            }
          });

          let actualCost =
            parseFloat(
              closestTr
                .find(".itemSelect option:selected")
                .data("purch_actual_cost")
            ) || 0;

          totalActualCost += actualCost + totalSubCost;
          if (totalActualCost > estimatedCost) {
            alert(
              `إجمالى التكلفة أعلى من التكلفة التقديرية لهذا البند (${selectedValue})`
            );
          }
        }
      );
      async function createCol(
        prevTh,
        prevTd,
        colTitle,
        classTh,
        classTd,
        colInput
      ) {
        var rowsNum = $("#listing_table .itemRow").length;
        if ($(".late2_th").length == 0 || $(".late_th").length == 0) {
          $(prevTh).after(
            $("th.col-3")
              .clone()
              .wrap("<p>")
              .parent()
              .html()
              .replace("col-3", classTh)
              .replace("", colTitle)
          );

          $(prevTd).after(
            $(".itemRow  td.col-3")
              .clone()
              .wrap("<p>")
              .parent()
              .html()
              .replace("col-3", classTd)
              .replace("item_col_3", colInput)
          );
        } else {
          $(`#listing_table .itemRow`)
            .last()
            .find(`${prevTd}`)
            .after(
              $("#listing_table .itemRow ")
                .last()
                .find("td.col-3")
                .clone()
                .wrap("<p>")
                .parent()
                .html()
                .replace("col-3", classTd)
                .replace("item_col_3", colInput)
            );
        }

        $("." + colInput).attr("placeholder", "");
        $("." + colInput).attr("name", "");
        $("#InvoiceLayout").triggerHandler("change", ["def"]);
        searchableSelector();
        document.querySelector(
          ".late_th"
        ).innerHTML = ` إختار الخدمة   <br>   (إلى) `;
        if (document.querySelector(".late2_th")) {
          document.querySelector(
            ".late2_th"
          ).innerHTML = ` إختار الخدمة   <br>   (من) `;
        }
      }
      let url = window.location.href;
      let urlObj = new URL(url);
      const workOrderId = new URLSearchParams(window.location.search).get(
        "filter[work_order_id]"
      );
      console.log({ workOrderId: workOrderId });
      if (workOrderId) {
        console.log("hereeeeee");
        // adding the columns when screen is loaded
        createCol(
          "th.col-3",
          "td.col-3",
          "إختيار الخدمة ",
          "late_th",
          "late_td",
          "late_input"
        );
        createCol(
          "th.col-3",
          "td.col-3",
          "إختيار الخدمة ",
          "late2_th",
          "late2_td",
          "late2_input"
        );

        // adding the columns on add item click
        $("#AddItem").on("click", () => {
          createCol(
            "th.col-3",
            "td.col-3",
            "إختيار الخدمة ",
            "late_th",
            "late_td",
            "late_input"
          );
          createCol(
            "th.col-3",
            "td.col-3",
            "إختيار الخدمة ",
            "late2_th",
            "late2_td",
            "late2_input"
          );
        });
      }

      async function postHistory(
        invoiceNo,
        itemId,
        itemName,
        ttlval,
        workOrderId
      ) {
        const postBody = {
          operations_type: "فاتورة مشتريات",
          ref_type: "PurchInv",
          op_date: new Date().toISOString().slice(0, 19).replace("T", " "),
          operation_no: invoiceNo,
          item_id: itemId,
          project_item: itemName,
          single_line_field: ttlval,
          reference_id: workOrderId,
        };
        console.log({ postBody: postBody });

        try {
          const response = await fetch(`/v2/api/entity/le_OperationsLog`, {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(postBody),
          });

          if (!response.ok) {
            const errorRes = await response.json();
            throw new Error(
              `Error ${response.status}: ${
                errorRes.message || "An error occurred."
              }`
            );
          }

          await response.json(); // Handle response as needed
        } catch (error) {
          alert(error.message);
        }
      }

      async function updateProjectData2(invNo) {
        const workOrderId = new URLSearchParams(window.location.search).get(
          "filter[work_order_id]"
        );
        const invoiceNo = invNo;
        console.log({ workOrderId: workOrderId, invoiceNo: invoiceNo });

        // Create a map to track net changes for each item
        const itemChanges = {};

        // Process all rows
        const rows = $(".late2_td .itemSelect").closest("tr").toArray();

        // First pass: capture all item info and calculate net changes
        for (const row of rows) {
          const targetSelect = $(row).find(".late2_td .itemSelect");
          const sourceSelect = $(row).find(".late_td .itemSelect");

          const targetId = $(targetSelect).val();

          // Skip if no valid target item is selected
          if (targetId === "إختر الخدمة") continue;

          // Get item data
          const targetOption = $(targetSelect).find("option:selected");
          const sourceOption = $(sourceSelect).find("option:selected");

          const targetData = targetOption[0].dataset;
          const sourceData = sourceOption[0].dataset;

          // Calculate transaction amount
          const price = parseFloat($(row).find(".unit-price input").val()) || 0;
          const qty = parseFloat($(row).find(".Quantity input").val()) || 0;
          const amount = price * qty;

          // Initialize items in our tracking map if needed
          if (!itemChanges[targetData.rec_id]) {
            itemChanges[targetData.rec_id] = {
              id: targetData.rec_id,
              name: targetOption[0].textContent,
              originalCost: parseFloat(targetData.purch_actual_cost) || 0,
              netChange: 0,
              transactions: [],
            };
          }

          if (!itemChanges[sourceData.rec_id]) {
            itemChanges[sourceData.rec_id] = {
              id: sourceData.rec_id,
              name: sourceOption[0].textContent,
              originalCost: parseFloat(sourceData.purch_actual_cost) || 0,
              netChange: 0,
              transactions: [],
            };
          }

          // Record this transaction
          itemChanges[targetData.rec_id].transactions.push({
            amount: amount,
            isPositive: true,
          });

          itemChanges[sourceData.rec_id].transactions.push({
            amount: amount,
            isPositive: false,
          });

          // Update net changes
          itemChanges[targetData.rec_id].netChange -= amount;
          itemChanges[sourceData.rec_id].netChange += amount;
        }

        // Process all updates
        for (const itemId in itemChanges) {
          const item = itemChanges[itemId];

          // Only update if there's a non-zero change
          if (item.netChange !== 0) {
            const newCost = item.originalCost + item.netChange;

            try {
              // Update the item's cost in the backend
              const response = await fetch(
                `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${item.id}/fields`,
                {
                  method: "POST",
                  headers: {
                    Accept: "application/json",
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ purch_actual_cost: newCost }),
                }
              );

              if (!response.ok) {
                const errorRes = await response.json();
                throw new Error(
                  `Error ${response.status}: ${
                    errorRes.message || "An error occurred."
                  }`
                );
              }

              // Process all transactions for this item
              for (const transaction of item.transactions) {
                console.log({ transaction: transaction });

                // Call postHistory with fixed amounts: -200 for negative transactions, +250 for positive ones
                const historyAmount = transaction.isPositive
                  ? " - " + transaction.amount
                  : transaction.amount;
                console.log({ historyAmount: historyAmount });
                console.log({ itemname: item.name });

                await postHistory(
                  invoiceNo,
                  item.id,
                  item.name,
                  historyAmount,
                  workOrderId
                );
              }
            } catch (error) {
              alert(error.message);
            }
          }
        }
      }
      console.log({ workOrderId: workOrderId });
      if (workOrderId) {
        $(".sub-actions")
          .eq(1)
          .parent()
          .before(
            '<button id="myButton" style="background-color: #13b272; color: white; padding: 10px 20px; border: none;margin-left:8px; cursor: pointer;"> تحديث التكاليف  </button>'
          );

        $("#myButton").on("click", async function (e) {
          e.preventDefault();
          const invId = window.location.pathname.split("/")[4];
          await updateProjectData2(invId);
          alert("تم الإنتهاء من تحديث التكاليف");
        });
      }
    }, 1000);
  });
</script>
