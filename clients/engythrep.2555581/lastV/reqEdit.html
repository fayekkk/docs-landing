<style>
  .late_input {
    overflow: hidden;
    width: 113px;
  }
  .late1_input {
    overflow: hidden;
    width: 113px;
  }
  .itemSelect {
    width: 32%;
  }
  .itemLabel {
    display: inline-block;
    margin-bottom: 5px;
    font-weight: bold;
    width: 100%;
    direction: ltr;
  }
</style>

<script>
  $(document).ready(function () {
    // Function to update a project item
    async function updateProjectItem(
      workOrderId,
      invoiceNo,
      itemValues,
      subValue,
      records,
      itemName
    ) {
      let previousCost = parseFloat(itemValues.requisitions_spend) || 0;
      let totalValue = previousCost + subValue;

      const existingRecord = records.find(
        (record) => record.recId === itemValues.rec_id
      );
      if (existingRecord) {
        totalValue = existingRecord.requisitions_spend;
      }

      try {
        const response = await fetch(
          `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${itemValues.rec_id}/fields`,
          {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ requisitions_spend: totalValue }),
          }
        );

        if (!response.ok) {
          const errorRes = await response.json();
          throw new Error(
            `Error ${response.status}: ${
              errorRes.message || "An error occurred."
            }`
          );
        }

        await postHistory(
          invoiceNo,
          itemValues.rec_id,
          itemName,
          subValue,
          workOrderId
        );
      } catch (error) {
        alert(error.message);
      }
    }
    // Function to update a project item
    async function updateProjectItem2(
      workOrderId,
      invoiceNo,
      itemValues,
      subValue,
      records,
      itemName
    ) {
      let previousCost = parseFloat(itemValues.requisitions_add) || 0;
      let totalValue = previousCost + subValue;

      const existingRecord = records.find(
        (record) => record.recId === itemValues.rec_id
      );
      if (existingRecord) {
        totalValue = existingRecord.requisitions_add;
      }

      try {
        const response = await fetch(
          `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${itemValues.rec_id}/fields`,
          {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ requisitions_add: totalValue }),
          }
        );

        if (!response.ok) {
          const errorRes = await response.json();
          throw new Error(
            `Error ${response.status}: ${
              errorRes.message || "An error occurred."
            }`
          );
        }

        await postHistory2(
          invoiceNo,
          itemValues.rec_id,
          itemName,
          subValue,
          workOrderId
        );
      } catch (error) {
        alert(error.message);
      }
    }

    // Handle service transfers for edit mode
    async function updateServiceTransfer(workOrderId, invoiceNo) {
      // Check which items are selected
      const fromItemSelected = $(".itemSelect").eq(0).val() !== "إختر الخدمة";
      const toItemSelected = $(".itemSelect").eq(1).val() !== "إختر الخدمة";

      // If neither item is selected, abort operation
      if (!fromItemSelected && !toItemSelected) {
        console.log("No items selected, aborting operation");
        return;
      }

      // Calculate the total value from the items
      let totalValue = 0;
      $(".itemRow").each(function () {
        const price = parseFloat($(this).find(".unit-price input").val()) || 0;
        const qty = parseFloat($(this).find(".Quantity input").val()) || 0;
        totalValue += price * qty;
      });

      try {
        // Case 1: From item not selected, only add to To item
        if (!fromItemSelected && toItemSelected) {
          console.log("From item not selected, only adding to To item");

          const toOption = $(".itemSelect").eq(1).find("option:selected");
          const toItemValues = toOption[0].dataset;

          // Calculate values for the To item
          let previousToValue =
            parseFloat(toItemValues.requisitions_spend) || 0;
          let newToValue = previousToValue + totalValue;

          // Update the To item
          const toResponse = await fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${toItemValues.rec_id}/fields`,
            {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ requisitions_spend: newToValue }),
            }
          );

          if (!toResponse.ok) {
            const errorRes = await toResponse.json();
            throw new Error(
              `Error ${toResponse.status}: ${
                errorRes.message || "An error occurred."
              }`
            );
          }

          // Post history for the To item with positive value
          await postHistory(
            invoiceNo,
            toItemValues.rec_id,
            toOption[0].textContent,
            totalValue,
            workOrderId
          );

          // Post history for the missing From item with negative value
          await postHistory(
            invoiceNo,
            "--",
            "--",
            `- ${totalValue}`,
            workOrderId
          );
        }
        // Case 2: Both items selected - normal transfer operation
        else if (fromItemSelected && toItemSelected) {
          const fromOption = $(".itemSelect").eq(0).find("option:selected");
          const toOption = $(".itemSelect").eq(1).find("option:selected");

          const fromItemValues = fromOption[0].dataset;
          const toItemValues = toOption[0].dataset;

          // Calculate values for both items
          let previousFromValue =
            parseFloat(fromItemValues.requisitions_spend) || 0;
          let previousToValue =
            parseFloat(toItemValues.requisitions_spend) || 0;

          console.log({ previousFromValue, previousToValue });

          // Calculate new values
          let newFromValue = previousFromValue - totalValue;
          let newToValue = previousToValue + totalValue;

          // Update the From item
          const fromResponse = await fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${fromItemValues.rec_id}/fields`,
            {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ requisitions_spend: newFromValue }),
            }
          );

          if (!fromResponse.ok) {
            const errorRes = await fromResponse.json();
            throw new Error(
              `Error ${fromResponse.status}: ${
                errorRes.message || "An error occurred."
              }`
            );
          }

          // Post history for the From item
          await postHistory(
            invoiceNo,
            fromItemValues.rec_id,
            fromOption[0].textContent,
            `- ${totalValue}`,
            workOrderId
          );

          // Update the To item
          const toResponse = await fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${toItemValues.rec_id}/fields`,
            {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ requisitions_spend: newToValue }),
            }
          );

          if (!toResponse.ok) {
            const errorRes = await toResponse.json();
            throw new Error(
              `Error ${toResponse.status}: ${
                errorRes.message || "An error occurred."
              }`
            );
          }

          // Post history for the To item
          await postHistory(
            invoiceNo,
            toItemValues.rec_id,
            toOption[0].textContent,
            totalValue,
            workOrderId
          );
        }
        // Case 3: Only From item selected
        else if (fromItemSelected && !toItemSelected) {
          console.log("To item not selected, only deducting from From item");

          const fromOption = $(".itemSelect").eq(0).find("option:selected");
          const fromItemValues = fromOption[0].dataset;

          // Calculate values for the From item
          let previousFromValue =
            parseFloat(fromItemValues.requisitions_spend) || 0;
          let newFromValue = previousFromValue - totalValue;

          // Update the From item
          const fromResponse = await fetch(
            `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${fromItemValues.rec_id}/fields`,
            {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ requisitions_spend: newFromValue }),
            }
          );

          if (!fromResponse.ok) {
            const errorRes = await fromResponse.json();
            throw new Error(
              `Error ${fromResponse.status}: ${
                errorRes.message || "An error occurred."
              }`
            );
          }

          // Post history for the From item
          await postHistory(
            invoiceNo,
            fromItemValues.rec_id,
            fromOption[0].textContent,
            `- ${totalValue}`,
            workOrderId
          );

          // Post history for the missing To item with positive value
          await postHistory(invoiceNo, "--", "--", totalValue, workOrderId);
        }
      } catch (error) {
        alert(error.message);
      }
    }

    // Function to log the history of operations
    async function postHistory(
      invoiceNo,
      itemId,
      itemName,
      totalValue,
      workOrderId
    ) {
      const postBody = {
        operations_type: "إذن صرف ",
        ref_type: "requisitionsSpend",
        op_date: new Date().toISOString().slice(0, 19).replace("T", " "),
        operation_no: invoiceNo,
        item_id: itemId,
        project_item: itemName,
        single_line_field: totalValue,
        reference_id: workOrderId,
      };

      try {
        const response = await fetch(`/v2/api/entity/le_OperationsLog`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(postBody),
        });

        if (!response.ok) {
          const errorRes = await response.json();
          throw new Error(
            `Error ${response.status}: ${
              errorRes.message || "An error occurred."
            }`
          );
        }
      } catch (error) {
        alert(error.message);
      }
    }
    // Function to log the history of operations
    async function postHistory2(
      invoiceNo,
      itemId,
      itemName,
      totalValue,
      workOrderId
    ) {
      const postBody = {
        operations_type: "إذن إضافة ",
        ref_type: "requisitionsAdd",
        op_date: new Date().toISOString().slice(0, 19).replace("T", " "),
        operation_no: invoiceNo,
        item_id: itemId,
        project_item: itemName,
        single_line_field: totalValue,
        reference_id: workOrderId,
      };

      try {
        const response = await fetch(`/v2/api/entity/le_OperationsLog`, {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(postBody),
        });

        if (!response.ok) {
          const errorRes = await response.json();
          throw new Error(
            `Error ${response.status}: ${
              errorRes.message || "An error occurred."
            }`
          );
        }
      } catch (error) {
        alert(error.message);
      }
    }

    // Function to update project data
    async function updateProjectData(invoiceNo) {
      const url = new URL(window.location.href);
      const workOrderId = url.searchParams.get("work_order_id");
      let records = [];
      const itemSelects = $(".itemSelect").toArray();

      // For add screens, handle each item select
      if (window.location.href.includes("/requisitions/add")) {
        for (const itemSelect of itemSelects) {
          const recId = $(itemSelect).val();

          if (
            recId !== "إختر الخدمة" &&
            window.location.href.includes("/requisitions/add/2")
          ) {
            const selectedOption = $(itemSelect).find("option:selected");
            const itemValues = selectedOption[0].dataset;
            const price =
              parseFloat(
                $(itemSelect).closest("tr").find(".unit-price input").val()
              ) || 0;
            const qty =
              parseFloat(
                $(itemSelect).closest("tr").find(".Quantity input").val()
              ) || 0;
            const subValue = price * qty;

            const existingRecordIndex = records.findIndex(
              (record) => record.recId === itemValues.rec_id
            );
            if (existingRecordIndex !== -1) {
              records[existingRecordIndex].requisitions_spend += subValue;
            } else {
              records.push({
                recId: itemValues.rec_id,
                requisitions_spend:
                  (parseFloat(itemValues.requisitions_spend) || 0) + subValue,
              });
            }

            await updateProjectItem(
              workOrderId,
              invoiceNo,
              itemValues,
              subValue,
              records,
              selectedOption[0].textContent
            );
          } else if (
            recId !== "إختر الخدمة" &&
            window.location.href.includes("/requisitions/add/1")
          ) {
            const selectedOption = $(itemSelect).find("option:selected");
            const itemValues = selectedOption[0].dataset;
            const price =
              parseFloat(
                $(itemSelect).closest("tr").find(".unit-price input").val()
              ) || 0;
            const qty =
              parseFloat(
                $(itemSelect).closest("tr").find(".Quantity input").val()
              ) || 0;
            const subValue = price * qty;

            const existingRecordIndex = records.findIndex(
              (record) => record.recId === itemValues.rec_id
            );
            if (existingRecordIndex !== -1) {
              records[existingRecordIndex].requisitions_add += subValue;
            } else {
              records.push({
                recId: itemValues.rec_id,
                requisitions_add:
                  (parseFloat(itemValues.requisitions_add) || 0) + subValue,
              });
            }

            await updateProjectItem2(
              workOrderId,
              invoiceNo,
              itemValues,
              subValue,
              records,
              selectedOption[0].textContent
            );
          }
        }
      }
      // For edit screen, handle the service transfer
      else if (window.location.href.includes("/requisitions/edit")) {
        await updateServiceTransfer(workOrderId, invoiceNo);
      }
    }

    // Function to get workOrderId, either from URL params or API
    async function getWorkOrderId() {
      // First try to get from URL params
      const url = new URL(window.location.href);
      let workOrderId = url.searchParams.get("work_order_id");

      // If found in URL, return it
      if (workOrderId) {
        console.log("Work order ID found in URL:", workOrderId);
        return workOrderId;
      }

      // If still not found, try to get from API
      console.log("Work order ID not found in URL, fetching from API...");

      try {
        // Get requisition ID from URL path
        let requisitionId;

        if (window.location.href.includes("/requisitions/edit/")) {
          requisitionId = window.location.pathname.split("/edit/")[1];
        } else if (window.location.href.includes("/requisitions/add/")) {
          return null; // For add screen, we need the work_order_id in the URL
        } else {
          return null; // Unknown page type
        }

        // Fetch the requisition data from API
        const response = await fetch(
          `/v2/api/entity/requisition/${requisitionId}/1`
        );
        if (!response.ok) {
          throw new Error(
            `Failed to fetch requisition data: ${response.status}`
          );
        }

        const data = await response.json();
        workOrderId = data.work_order_id;

        if (!workOrderId) {
          console.error("Work order ID not found in API response:", data);
          return null;
        }

        console.log(
          `Work order ID fetched from API for requisition ${requisitionId}:`,
          workOrderId
        );

        // Reload page with the work_order_id as a parameter (not using filter)
        const currentUrl = window.location.href;
        const newUrl = currentUrl.includes("?")
          ? `${currentUrl}&work_order_id=${workOrderId}`
          : `${currentUrl}?work_order_id=${workOrderId}`;

        console.log("Reloading with new URL:", newUrl);
        window.location.href = newUrl;

        // This won't be reached due to page reload, but we return it anyway
        return workOrderId;
      } catch (error) {
        console.error("Error fetching work order ID:", error);
        return null;
      }
    }
    // Initialize the form and item prices based on the current URL
    if (window.location.href.includes("/requisitions/add")) {
      $(".item-unit-price").attr("readonly", false);

      // Function to create a searchable selector for services
      const createServiceSelector = async () => {
        const selector = $("<select>", {
          class: "itemSelect",
          style: "width: 100%;",
        });
        selector.append(
          $("<option>", { text: "إختر الخدمة", style: "text-align: center;" })
        );

        const workOrderId = await getWorkOrderId();
        $.get(`/v2/api/entity/le_workflow-type-entity-2/${workOrderId}/4`).then(
          (response) => {
            console.log({ response: response });

            const options =
              response["le_workflow-type-entity-2_custom_data"][
                "le_custom_data_le_workflow-type-entity-2_le_custom_data_le_workflow-type-entity-2_project_items"
              ];
            options.forEach((optionText) => {
              const option = document.createElement("option");
              option.textContent = optionText.item_name;
              option.dataset["purch_estimated_cost"] =
                optionText.purch_estimated_cost;
              option.dataset["expenses_estimated_cost"] =
                optionText.expenses_estimated_cost;
              option.dataset["rec_id"] = optionText.id;
              option.dataset["requisitions_spend"] =
                optionText.requisitions_spend;
              option.dataset["expenses_actual_cost"] =
                optionText.expenses_actual_cost;
              option.dataset["requisitions_add"] = optionText.requisitions_add;
              option.dataset["requisitions_spend"] =
                optionText.requisitions_spend;
              option.style.textAlign = "center";
              selector.append(option);
            });

            // Append selector to item rows
            $("#listing_table .itemRow").each(function () {
              if (!$(this).find(".itemSelect").length) {
                $(this).find(".late_td").empty().append(selector.clone());
              }
            });
          }
        );
      };

      // Create service selector on load
      createServiceSelector();

      // Event listener for changes in item pricing and quantity
      $(document).on(
        "change",
        ".item-unit-price, .item-qty, .itemSelect",
        function () {
          const closestTr = $(this).closest("tr");
          const selectedValue = closestTr.find(".itemSelect").val();
          let totalSubCost = 0;

          $(".itemRow").each(function () {
            const row = $(this);
            if (row.find(".itemSelect").val() === selectedValue) {
              const price = parseFloat(row.find(".item-unit-price").val()) || 0;
              const qty = parseFloat(row.find(".item-qty").val()) || 0;
              totalSubCost += price * qty;
            }
          });

          const actualSpendCost =
            parseFloat(
              closestTr
                .find(".itemSelect option:selected")
                .data("requisitions_spend")
            ) || 0;
          const actualAddCost =
            parseFloat(
              closestTr
                .find(".itemSelect option:selected")
                .data("requisitions_add")
            ) || 0;

          let totalActualCost = window.location.href.includes(
            "/requisitions/add/2"
          )
            ? actualSpendCost + totalSubCost
            : window.location.href.includes("/requisitions/add/1")
            ? actualAddCost + totalSubCost
            : 0;

          console.log(`Total Actual Cost for: ${totalActualCost}`);
        }
      );

      // Function to create a new column for service selection
      function createCol(prevTh, prevTd, colTitle, classTh, classTd, colInput) {
        if ($(`#listing_table th.${classTh}`).length === 0) {
          $(prevTh).before(`<th class='${classTh}'>${colTitle}</th>`);
        }

        // Append new TD with input area to each row
        $(`#listing_table tr`).each(function () {
          if (!$(this).find(`td.${classTd}`).length) {
            $(this)
              .find(prevTd)
              .before(
                `<td class='${classTd}'><textarea class='${colInput} editable-input'></textarea></td>`
              );
          }
        });
        createServiceSelector(); // Refresh selector after creating columns
      }

      // Get work order ID using our new function and create the necessary columns
      const workOrderId = getWorkOrderId();
      if (workOrderId) {
        createCol(
          "#label_unit_price",
          ".unit-price",
          "إختار الخدمة",
          "late_th",
          "late_td",
          "late_input"
        );
        $(".items-totals").find("td").eq(0).attr("colspan", "6");
      }

      // Add new item and create service selection column
      $(document).on("click", "#AddItem", function () {
        if (workOrderId) {
          setTimeout(() => {
            $(".item-unit-price").attr("readonly", false);
            createCol(
              "#label_unit_price",
              ".unit-price",
              "إختار الخدمة",
              "late_th",
              "late_td",
              "late_input"
            );
          }, 250);
        }
      });

      // Add update costs button
      $(".submit-btn-group")
        .eq(0)
        .before(
          '<button id="updateCostsBtn" style="background-color: #13b272; color: white; padding: 10px 20px; border: none; margin-left:8px; margin-right:8px; cursor: pointer;">تحديث التكاليف</button>'
        );

      // Set up event handler for the update button
      $("#updateCostsBtn").on("click", async function (e) {
        e.preventDefault();
        const workOrderId = await getWorkOrderId();
        const requisitionId = window.location.pathname.split("/add/")[1];
        await updateProjectData(requisitionId);
        alert("تم الإنتهاء من تحديث التكاليف");
      });
    } else if (window.location.href.includes("/requisitions/edit")) {
      // Setup for edit screen
      setTimeout(() => {
        // Create service selectors for transfer functionality
        // Function to create table headers and cells with service selectors
        async function createTableSelectors() {
          try {
            console.log("[INFO] Creating table selectors for #listing_table");

            // Get work order ID
            const workOrderId = await getWorkOrderId();
            if (!workOrderId) {
              console.error(
                "[ERROR] Cannot create selectors - missing work order ID"
              );
              return;
            }

            // First, create the header columns if they don't exist
            const tableHeaders = $("#listing_table thead tr");
            if (tableHeaders.length) {
              // For Add screen - create one service column
              if (window.location.href.includes("/requisitions/add")) {
                if ($("#listing_table th.late_th").length === 0) {
                  $("#label_unit_price").before(
                    `<th class="late_th">إختار الخدمة</th>`
                  );
                  console.log("[INFO] Added service header column to table");
                }
              }
              // For Edit screen - create two service columns (From and To)
              else if (window.location.href.includes("/requisitions/edit")) {
                if ($("#listing_table th.from_service_th").length === 0) {
                  $("#label_unit_price").before(
                    `<th class="from_service_th">الخدمة من</th>`
                  );
                  console.log(
                    "[INFO] Added 'From Service' header column to table"
                  );
                }

                if ($("#listing_table th.to_service_th").length === 0) {
                  $("#listing_table th.from_service_th").after(
                    `<th class="to_service_th">الخدمة إلى</th>`
                  );
                  console.log(
                    "[INFO] Added 'To Service' header column to table"
                  );
                }
              }
            } else {
              console.warn("[WARN] Table header row not found");
            }

            // Fetch service data from API
            console.log(
              `[INFO] Fetching services for work order ID: ${workOrderId}`
            );
            try {
              const response = await $.ajax({
                url: `/v2/api/entity/le_workflow-type-entity-2/${workOrderId}/4`,
                method: "GET",
                dataType: "json",
              });

              console.log("[INFO] Services API response received", response);

              const services =
                response["le_workflow-type-entity-2_custom_data"][
                  "le_custom_data_le_workflow-type-entity-2_le_custom_data_le_workflow-type-entity-2_project_items"
                ];

              if (!services || !Array.isArray(services)) {
                console.error("[ERROR] Invalid services data format", response);
                return;
              }

              console.log(`[INFO] Found ${services.length} services`);

              // Process each row in the table
              $("#listing_table tbody tr.itemRow").each(function (index) {
                const row = $(this);

                // For Add screen - create one service selector per row
                if (window.location.href.includes("/requisitions/add")) {
                  // Check if the cell exists, create it if not
                  if (row.find("td.late_td").length === 0) {
                    row.find(".unit-price").before(`<td class="late_td"></td>`);
                  }

                  // Create the select element if it doesn't exist
                  if (row.find("td.late_td .itemSelect").length === 0) {
                    const select = $("<select>", {
                      class: "itemSelect",
                      style: "width: 100%;",
                    });

                    // Add default option
                    select.append(
                      $("<option>", {
                        text: "إختر الخدمة",
