<style>
  .late_input {
    overflow: hidden;
    width: 113px;
  }
  .late1_input {
    overflow: hidden;
    width: 113px;
  }
  .itemSelect {
    width: 32%;
  }
  .itemLabel {
    display: inline-block;
    margin-bottom: 5px;
    font-weight: bold;
    width: 100%;
    direction: ltr;
  }
</style>

<script>
  $(document).ready(function () {
    // ===== HELPER FUNCTIONS =====
    const log = (type, msg, data) =>
      console[type](`[${type.toUpperCase()}] ${msg}`, data || "");

    // Cache mechanism
    const cache = {
      workOrderId: null,
      services: null,
      getWorkOrderId: () => cache.workOrderId,
      setWorkOrderId: (id) => {
        cache.workOrderId = id;
        return id;
      },
      getServices: () => cache.services,
      setServices: (services) => {
        cache.services = services;
        return services;
      },
    };

    // Safe data helpers
    const safe = {
      id: (id) => (id && id !== "undefined" ? id : null),
      number: (val) => (!isNaN(parseFloat(val)) ? parseFloat(val) : 0),
      string: (str) => str || "--",
      attr: (val) => (val === undefined ? "" : val),
    };

    // API helpers
    const api = {
      async fetch(url, options = {}) {
        try {
          const defaultOptions = {
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
          };
          const response = await fetch(url, { ...defaultOptions, ...options });
          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(
              `API Error ${response.status}: ${
                errorData.message || "Unknown error"
              }`
            );
          }
          return await response.json();
        } catch (error) {
          log("error", `API call failed: ${url}`, error);
          throw error;
        }
      },

      async updateItem(itemId, field, value) {
        // Validate inputs
        const safeId = safe.id(itemId);
        if (!safeId) throw new Error(`Invalid item ID: ${itemId}`);

        const safeValue = safe.number(value);
        log("info", `Updating item ${safeId}.${field} = ${safeValue}`);

        return api.fetch(
          `/v2/api/entity/le_custom_data_le_workflow-type-entity-2_project_items/${safeId}/fields`,
          {
            method: "POST",
            body: JSON.stringify({ [field]: safeValue }),
          }
        );
      },

      postLog: (logData) =>
        api.fetch("/v2/api/entity/le_OperationsLog", {
          method: "POST",
          body: JSON.stringify({
            ...logData,
            item_id: safe.string(logData.item_id),
            project_item: safe.string(logData.project_item),
          }),
        }),

      getRequisition: (id) => api.fetch(`/v2/api/entity/requisition/${id}/1`),

      async getServices(workOrderId) {
        if (cache.getServices()) return cache.getServices();

        try {
          const response = await $.ajax({
            url: `/v2/api/entity/le_workflow-type-entity-2/${workOrderId}/4`,
            method: "GET",
            dataType: "json",
          });

          // Safely extract and validate services
          try {
            const services =
              response["le_workflow-type-entity-2_custom_data"][
                "le_custom_data_le_workflow-type-entity-2_le_custom_data_le_workflow-type-entity-2_project_items"
              ];

            if (!Array.isArray(services))
              throw new Error("Invalid services data");

            // Filter valid services with required fields
            const validServices = services.filter(
              (s) => s && s.id && s.item_name
            );
            log("info", `Found ${validServices.length} valid services`);

            return cache.setServices(validServices);
          } catch (e) {
            log("error", "Could not extract services from response", e);
            throw new Error("Invalid services data structure");
          }
        } catch (error) {
          log("error", "Failed to fetch services", error);
          throw error;
        }
      },
    };

    // ===== CORE OPERATIONS =====
    // Post operation history with data validation
    async function postHistory(
      invoiceNo,
      itemId,
      itemName,
      totalValue,
      workOrderId,
      isAdd = false
    ) {
      try {
        const postBody = {
          operations_type: isAdd ? "إذن إضافة " : "إذن صرف ",
          ref_type: isAdd ? "requisitionsAdd" : "requisitionsSpend",
          op_date: new Date().toISOString().slice(0, 19).replace("T", " "),
          operation_no: invoiceNo,
          item_id: safe.string(itemId),
          project_item: safe.string(itemName),
          single_line_field: totalValue,
          reference_id: workOrderId,
        };

        await api.postLog(postBody);
      } catch (error) {
        log("error", "Failed to post history", error);
      }
    }

    // Update project item with validation
    async function updateProjectItem(
      workOrderId,
      invoiceNo,
      itemValues,
      subValue,
      records,
      itemName,
      isAdd = false
    ) {
      try {
        // Validate item ID
        const itemId = safe.id(itemValues.rec_id);
        if (!itemId) {
          log("error", `Invalid item ID for ${itemName}`, itemValues);
          throw new Error(`Missing ID for ${itemName}`);
        }

        const field = isAdd ? "requisitions_add" : "requisitions_spend";
        const previousCost = safe.number(itemValues[field]);
        const safeSubValue = safe.number(subValue);
        let totalValue = previousCost + safeSubValue;

        // Check for existing record
        const existingRecord = records.find(
          (record) => record.recId === itemId
        );
        if (existingRecord) totalValue = existingRecord[field];

        // Update item in database
        await api.updateItem(itemId, field, totalValue);
        await postHistory(
          invoiceNo,
          itemId,
          itemName,
          safeSubValue,
          workOrderId,
          isAdd
        );
      } catch (error) {
        log("error", `Failed to update item ${itemName}`, error);
        // alert(error.message);
      }
    }

    // Service transfer with validation
    async function updateServiceTransfer(workOrderId, invoiceNo) {
      try {
        const fromSelect = $(".itemSelect").eq(0);
        const toSelect = $(".itemSelect").eq(1);

        const fromItemSelected = fromSelect.val() !== "إختر الخدمة";
        const toItemSelected = toSelect.val() !== "إختر الخدمة";

        if (!fromItemSelected && !toItemSelected) return;

        // Calculate total value
        let totalValue = 0;
        $(".itemRow").each(function () {
          const price = safe.number($(this).find(".unit-price input").val());
          const qty = safe.number($(this).find(".Quantity input").val());
          totalValue += price * qty;
        });

        // Case 1: To item only
        if (!fromItemSelected && toItemSelected) {
          const toOption = toSelect.find("option:selected");
          const toItemValues = toOption[0].dataset;
          const toItemId = safe.id(toItemValues.rec_id);

          if (!toItemId) {
            throw new Error("Missing ID for target service");
          }

          const previousToValue = safe.number(toItemValues.requisitions_spend);
          const newToValue = previousToValue + totalValue;

          await api.updateItem(toItemId, "requisitions_spend", newToValue);
          await postHistory(
            invoiceNo,
            toItemId,
            toOption.text(),
            totalValue,
            workOrderId
          );
          await postHistory(
            invoiceNo,
            "--",
            "--",
            `- ${totalValue}`,
            workOrderId
          );
        }
        // Case 2: Both items
        else if (fromItemSelected && toItemSelected) {
          const fromOption = fromSelect.find("option:selected");
          const toOption = toSelect.find("option:selected");

          const fromItemValues = fromOption[0].dataset;
          const toItemValues = toOption[0].dataset;

          const fromItemId = safe.id(fromItemValues.rec_id);
          const toItemId = safe.id(toItemValues.rec_id);

          if (!fromItemId || !toItemId) {
            throw new Error("Missing ID for one or both services");
          }

          const previousFromValue = safe.number(
            fromItemValues.requisitions_spend
          );
          const previousToValue = safe.number(toItemValues.requisitions_spend);

          const newFromValue = previousFromValue - totalValue;
          const newToValue = previousToValue + totalValue;

          // Update source item
          await api.updateItem(fromItemId, "requisitions_spend", newFromValue);
          await postHistory(
            invoiceNo,
            fromItemId,
            fromOption.text(),
            `- ${totalValue}`,
            workOrderId
          );

          // Update target item
          await api.updateItem(toItemId, "requisitions_spend", newToValue);
          await postHistory(
            invoiceNo,
            toItemId,
            toOption.text(),
            totalValue,
            workOrderId
          );
        }
        // Case 3: From item only
        else if (fromItemSelected && !toItemSelected) {
          const fromOption = fromSelect.find("option:selected");
          const fromItemValues = fromOption[0].dataset;
          const fromItemId = safe.id(fromItemValues.rec_id);

          if (!fromItemId) {
            throw new Error("Missing ID for source service");
          }

          const previousFromValue = safe.number(
            fromItemValues.requisitions_spend
          );
          const newFromValue = previousFromValue - totalValue;

          await api.updateItem(fromItemId, "requisitions_spend", newFromValue);
          await postHistory(
            invoiceNo,
            fromItemId,
            fromOption.text(),
            `- ${totalValue}`,
            workOrderId
          );
          await postHistory(invoiceNo, "--", "--", totalValue, workOrderId);
        }
      } catch (error) {
        log("error", "Transfer operation failed", error);
        // alert(`Transfer failed: ${error.message}`);
      }
    }

    // Update project data with validation
    async function updateProjectData(invoiceNo) {
      try {
        const workOrderId = await getWorkOrderId();
        if (!workOrderId) throw new Error("Missing work order ID");

        let records = [];

        // For add screens
        if (window.location.href.includes("/requisitions/add")) {
          const itemSelects = $(".itemSelect").toArray();

          for (const itemSelect of itemSelects) {
            const recId = $(itemSelect).val();
            if (recId === "إختر الخدمة") continue;

            const selectedOption = $(itemSelect).find("option:selected");
            const itemValues = selectedOption[0].dataset;

            // Validate item ID
            if (!safe.id(itemValues.rec_id)) {
              log("warn", `Skipping item with invalid ID`, itemValues);
              continue;
            }

            const row = $(itemSelect).closest("tr");
            const price = safe.number(row.find(".unit-price input").val());
            const qty = safe.number(row.find(".Quantity input").val());
            const subValue = price * qty;

            if (subValue <= 0) continue;

            // Determine operation type
            const isAddOperation = window.location.href.includes(
              "/requisitions/add/1"
            );
            const field = isAddOperation
              ? "requisitions_add"
              : "requisitions_spend";

            // Update tracking records
            const existingRecordIndex = records.findIndex(
              (record) => record.recId === itemValues.rec_id
            );
            if (existingRecordIndex !== -1) {
              records[existingRecordIndex][field] += subValue;
            } else {
              records.push({
                recId: itemValues.rec_id,
                [field]: safe.number(itemValues[field]) + subValue,
              });
            }

            // Update the item
            await updateProjectItem(
              workOrderId,
              invoiceNo,
              itemValues,
              subValue,
              records,
              selectedOption.text(),
              isAddOperation
            );
          }
        }
        // For edit screen
        else if (window.location.href.includes("/requisitions/edit")) {
          await updateServiceTransfer(workOrderId, invoiceNo);
        }

        log("info", `Project data updated for invoice ${invoiceNo}`);
      } catch (error) {
        log("error", "Failed to update project data", error);
        // alert(`Error: ${error.message}`);
      }
    }

    // Get work order ID with caching
    async function getWorkOrderId() {
      try {
        if (cache.getWorkOrderId()) return cache.getWorkOrderId();

        // Try from URL params
        const url = new URL(window.location.href);
        let workOrderId = url.searchParams.get("work_order_id");

        if (workOrderId) {
          return cache.setWorkOrderId(workOrderId);
        }

        // Try from API for edit screen
        if (window.location.href.includes("/requisitions/edit/")) {
          const requisitionId = window.location.pathname.split("/edit/")[1];
          if (!requisitionId) return null;

          try {
            const data = await api.getRequisition(requisitionId);
            workOrderId = data?.work_order_id;

            if (!workOrderId) return null;

            // Reload with the ID as parameter
            const currentUrl = window.location.href;
            const newUrl = currentUrl.includes("?")
              ? `${currentUrl}&work_order_id=${workOrderId}`
              : `${currentUrl}?work_order_id=${workOrderId}`;

            window.location.href = newUrl;
            return cache.setWorkOrderId(workOrderId);
          } catch (error) {
            return null;
          }
        }

        return null;
      } catch (error) {
        log("error", "Error fetching work order ID", error);
        return null;
      }
    }

    // Create select element with data validation
    function createServiceSelect(
      services,
      className,
      defaultText = "إختر الخدمة"
    ) {
      const select = $("<select>", { class: className, style: "width: 100%;" });

      select.append(
        $("<option>", {
          text: defaultText,
          style: "text-align: center;",
        })
      );

      if (!services || !Array.isArray(services) || services.length === 0) {
        return select;
      }

      services.forEach((service) => {
        if (!service || !service.id) return;

        // Create option with all attributes
        const option = document.createElement("option");
        option.textContent = service.item_name || "Unnamed Service";
        option.style.textAlign = "center";
        option.value = service.id;

        // Set all properties as both data-* attributes and direct attributes
        const serviceProps = {
          rec_id: service.id,
          purch_estimated_cost: safe.number(service.purch_estimated_cost),
          expenses_estimated_cost: safe.number(service.expenses_estimated_cost),
          requisitions_spend: safe.number(service.requisitions_spend),
          expenses_actual_cost: safe.number(service.expenses_actual_cost),
          requisitions_add: safe.number(service.requisitions_add),
        };

        // Set data attributes
        for (const [key, value] of Object.entries(serviceProps)) {
          option.dataset[key] = value;
        }

        // Set direct attributes
        for (const [key, value] of Object.entries(service)) {
          if (value !== undefined && value !== null) {
            // Set as direct attribute with data- prefix
            option.setAttribute(`data-${key}`, safe.attr(value));
          }
        }

        // Also set the required attributes directly
        option.setAttribute("data-rec_id", service.id);
        option.setAttribute("data-id", service.id);

        select.append(option);
      });

      return select;
    }

    // Create table selectors
    async function createTableSelectors() {
      try {
        const workOrderId = await getWorkOrderId();
        if (!workOrderId) return;

        // Fetch services
        let services = [];
        try {
          services = await api.getServices(workOrderId);
        } catch (error) {
          log("error", "Failed to load services, using empty list", error);
        }

        // Create header columns and selectors based on page type
        if (window.location.href.includes("/requisitions/edit")) {
          // Add headers if needed
          if ($("#listing_table th.from_service_th").length === 0) {
            $("#label_unit_price").before(
              `<th class="from_service_th">الخدمة من</th>`
            );
          }
          if ($("#listing_table th.to_service_th").length === 0) {
            $("#listing_table th.from_service_th").after(
              `<th class="to_service_th">الخدمة إلى</th>`
            );
          }

          // Add selectors to each row
          $("#listing_table tbody tr.itemRow").each(function () {
            const row = $(this);

            // From service cell and selector
            if (row.find("td.from_service_td").length === 0) {
              row
                .find(".unit-price")
                .before(`<td class="from_service_td"></td>`);
            }
            if (
              row.find("td.from_service_td .fromServiceSelect").length === 0
            ) {
              row
                .find("td.from_service_td")
                .empty()
                .append(
                  createServiceSelect(services, "fromServiceSelect itemSelect")
                );
            }

            // To service cell and selector
            if (row.find("td.to_service_td").length === 0) {
              row
                .find("td.from_service_td")
                .after(`<td class="to_service_td"></td>`);
            }
            if (row.find("td.to_service_td .toServiceSelect").length === 0) {
              row
                .find("td.to_service_td")
                .empty()
                .append(
                  createServiceSelect(services, "toServiceSelect itemSelect")
                );
            }
          });

          // Update colspan
          $(".items-totals").find("td").eq(0).attr("colspan", "7");
        } else {
          // Add header if needed
          if ($("#listing_table th.late_th").length === 0) {
            $("#label_unit_price").before(
              `<th class="late_th">إختار الخدمة</th>`
            );
          }

          // Add selector to each row
          $("#listing_table tbody tr.itemRow").each(function () {
            const row = $(this);

            if (row.find("td.late_td").length === 0) {
              row.find(".unit-price").before(`<td class="late_td"></td>`);
            }
            if (row.find("td.late_td .itemSelect").length === 0) {
              row
                .find("td.late_td")
                .empty()
                .append(createServiceSelect(services, "itemSelect"));
            }
          });

          // Update colspan
          $(".items-totals").find("td").eq(0).attr("colspan", "6");
        }
      } catch (error) {
        log("error", "Failed to create table selectors", error);
      }
    }

    // ===== INITIALIZATION =====
    $(".item-unit-price").attr("readonly", false);

    // Add Screen
    if (window.location.href.includes("/requisitions/add")) {
      // Create selectors
      createTableSelectors();

      // Add update costs button
      if ($("#updateCostsBtn").length === 0) {
        $(".submit-btn-group")
          .eq(0)
          .before(
            '<button id="updateCostsBtn" style="background-color: #13b272; color: white; padding: 10px 20px; border: none; margin-left:8px; margin-right:8px; cursor: pointer;">تحديث التكاليف</button>'
          );
      }

      // Button click handler
      $(document)
        .off("click", "#updateCostsBtn")
        .on("click", "#updateCostsBtn", async function (e) {
          e.preventDefault();
          try {
            const requisitionId = window.location.pathname.split("/add/")[1];
            await updateProjectData(requisitionId);
            alert("تم الإنتهاء من تحديث التكاليف");
          } catch (error) {
            // alert(`Error: ${error.message}`);
          }
        });

      // Add item button handler
      $(document)
        .off("click", "#AddItem")
        .on("click", "#AddItem", function () {
          setTimeout(() => createTableSelectors(), 250);
        });

      // Field change handler
      $(document)
        .off("change", ".item-unit-price, .item-qty, .itemSelect")
        .on("change", ".item-unit-price, .item-qty, .itemSelect", function () {
          const row = $(this).closest("tr");
          const selectedOption = row.find(".itemSelect option:selected");
          if (selectedOption.val() === "إختر الخدمة") return;

          // Calculate total cost for this item across all rows
          let totalSubCost = 0;
          $(".itemRow").each(function () {
            if ($(this).find(".itemSelect").val() === selectedOption.val()) {
              const price = safe.number($(this).find(".item-unit-price").val());
              const qty = safe.number($(this).find(".item-qty").val());
              totalSubCost += price * qty;
            }
          });

          // Get current value and calculate new total
          const isSpendOp = window.location.href.includes(
            "/requisitions/add/2"
          );
          const fieldValue = safe.number(
            selectedOption.data(
              isSpendOp ? "requisitions_spend" : "requisitions_add"
            )
          );
          log(
            "info",
            `Total for ${selectedOption.text()}: ${fieldValue + totalSubCost}`
          );
        });
    }
    // Edit Screen
    else if (window.location.href.includes("/requisitions/edit")) {
      setTimeout(() => {
        // Create selectors
        createTableSelectors();

        // Add update costs button
        if ($("#updateCostsBtn").length === 0) {
          $("#saveRequisition")
            .eq(0)
            .before(
              '<button id="updateCostsBtn" style="background-color: #13b272; color: white; padding:7px 20px; border: none; margin-left:8px; margin-right:8px; cursor: pointer;">تحديث التكاليف</button>'
            );

          // Button handler
          $("#updateCostsBtn")
            .off("click")
            .on("click", async function (e) {
              e.preventDefault();
              try {
                const requisitionId =
                  window.location.pathname.split("/edit/")[1];
                await updateProjectData(requisitionId);
                alert("تم الإنتهاء من تحديث التكاليف");
              } catch (error) {
                // alert(`Error: ${error.message}`);
              }
            });
        }

        // Add new item handler
        $(document)
          .off("click", "#AddItem")
          .on("click", "#AddItem", function () {
            setTimeout(() => createTableSelectors(), 250);
          });
      }, 1000);
    }
  });
</script>
