<script>
  $(document).ready(function () {
    setTimeout(() => {
      async function mainCode() {
        if ($("#InvoiceLayout").val() == 10 || $("#InvoiceLayout").val() == 8) {
          // start coding
          // ********************************** assign class to title value field ********************************
          let cstLbls = $(".field-row td:first-child input");
          let cstVals = $(".field-row td:nth-child(2) input");
          for (i = 0; i < cstLbls.length; i++) {
            if (cstLbls.eq(i).val() == "Incoterm") {
              cstVals.eq(i).addClass("Incoterm");
            } else if (cstLbls.eq(i).val() == "Disponibilité") {
              cstVals.eq(i).addClass("Disponibilite");
            } else if (cstLbls.eq(i).val() == "Dévise") {
              cstVals.eq(i).addClass("Devise");
            } else if (cstLbls.eq(i).val() == "Terme de paiement") {
              cstVals.eq(i).addClass("Termedepaiement");
            }
          }
          // ********************************** create selectors to custom fields ********************************
          function fetchApiData(url) {
            return $.ajax({
              url: url,
              method: "GET",
              dataType: "json",
            });
          }
          fetchApiData("/v2/api/entity/le_drop_list_values/1/4")
            .then((response) => {
              console.log("API Response:", response);

              // Hide inputs with specific classes
              $(".Incoterm, .Disponibilite, .Devise, .Termedepaiement").hide();

              // Create selectors based on the response
              createSelectors(
                response.le_drop_list_values_le_drop_list_values_incoterm_values,
                ".Incoterm",
                "Select Option"
              );
              createSelectors(
                response.le_drop_list_values_le_drop_list_values_terms,
                ".Termedepaiement",
                "Select Option"
              );

              createSelectors(
                response.le_drop_list_values_le_drop_list_values_disponibilite_values,
                ".Disponibilite",
                "Select Option"
              );
              createSelectors(
                response.le_drop_list_values_le_drop_list_values_currency_values,
                ".Devise",
                "Select Option"
              );
              $("#DiscountSelect").empty();
              console.log("changed");
              $("#DiscountSelect").append(
                $("<option>", {
                  value: "0",
                  text: "Select a ratio",
                })
              );
              let newValues =
                response.le_drop_list_values_le_drop_list_values_bic_values;
              $.each(newValues, function (index, value) {
                $("#DiscountSelect").append(
                  $("<option>", {
                    value: value.bic_ratio,
                    text: value.bic_ratio + "%",
                  })
                );
              });
            })
            .catch((error) => {
              console.error("Error fetching data:", error);
            });

          function createSelectors(dataArray, targetClass, placeholder) {
            console.log({ dataArray: dataArray });

            // Create a select element
            const $select = $('<select class="custom-select"></select>').append(
              `<option value="">${placeholder}</option>`
            );

            // Append options to the select
            dataArray.forEach((item) => {
              $select.append(
                `<option value="${item.id}">${
                  item.incoterm ||
                  item.disponibilite ||
                  item.currency_currency ||
                  item.terms_text
                }</option>`
              );
            });

            // Insert the select after the target class elements
            $(targetClass).after($select);

            // Add some styles to the select
            $select.css({
              padding: "5px",
              border: "1px solid #ccc",
              "border-radius": "4px",
              width: "60%",
            });
            // Add onchange event to the select
            $select.on("change", function () {
              console.log("changed");
              const selectedText = $(this).find(":selected").text();
              const selectedValue = selectedText;
              const originalInput = $(targetClass);
              if (originalInput.length && selectedValue != "") {
                console.log("changed");
                originalInput.val(selectedValue);
              }
            });
          }
        }
      }
      mainCode();
      $("#InvoiceLayout").on("change", function (e) {
        setTimeout(() => {
          mainCode();
        }, 250);
      });
    }, 200);
  });
</script>

<style>

    display: none !important;

  .rtl-span {

    direction: rtl;

    font-size: 12px;

  }
  .error-box {
    display: inline-block;

    border: 0;
  }
  #DiscountSelect {
    width: 195px !important;
  }

<script>
  $(document).ready(function () {
    // adding new button HTML
    var newButton = `<div class="col-md-12 col-sm-12" style="margin-bottom: 25px;">
          <div class="m-r-md d-inline-flex">
            <a id="calcBtn" class="ajust-invoice btn-info" style="padding: 8px 15px !important; display: inline-block;">Calc TAX  </a>
          </div>
          <div style="display: inline-block; max-width: 100px;">
            <label class="ui-input-label l-input-label adjust-tab-input-label">ratio</label>
            <input type="number" style="height: 40px;" placeholder="0" class="number discount-tab-input-discount ui-input l-input form-x3" step="any" value="" id="InvoiceRetention">
          </div>
          <div class="error-box hidden">
            <span class="empty-value hidden-elem rtl-span">قم بإدخال نسبة ضمان الأعمال أولاً</span>
            <span class="exceed-limit hidden-elem rtl-span">لا يمكن أن تتخطى النسبة 100%</span>
          </div>
        </div>`;
    var tab = $("#tab-1 .row");
    tab.prepend(newButton);
    // Hide the original input
    $("#InvoiceRetention").hide();

    // Create a new select element
    var $select = $("<select>", {
      class: "number discount-tab-input-discount ui-input l-input form-x3",
      id: "DiscountSelect",
    }).append(
      $("<option>", { value: "0", text: "Select BIC" }),
      $("<option>", { value: "0", text: "0%" }),
      $("<option>", { value: "2", text: "2%" }),
      $("<option>", { value: "5", text: "5%" })
    );

    // Insert the select after the hidden input
    $("#InvoiceRetention").after($select);

    // Add change event listener
    $select.on("change", function () {
      var selectedValue = $(this).val();
      $("#InvoiceRetention").val(selectedValue); // Set the input value based on the selection
    });
    // getting second tax
    var tax = parseFloat(
      $("#Tax2Row td:nth-child(3)").text().replace(/,/g, "")
    );
    if (isNaN(tax)) {
      tax = 0;
    }

    // checking if retention is zero or NaN then adding the adjustment label as ضمان أعمال
    if (
      isNaN(parseFloat($("#InvoiceRetention").val())) ||
      parseFloat($("#InvoiceRetention").val()) == 0
    ) {
      $("#PurchaseOrderAdjustmentLabel").val("Calc tax");
    }

    // calculating retention funtion
    function calcRetention() {
      $("#PurchaseOrderAdjustmentValue").val(0).trigger("change");
      setTimeout(() => {
        var retentionValue = $("#PurchaseOrderAdjustmentValue");
        // parseFloat($("#TotalValue").text().replace(/\./g, '').replace(/(\d+)(\d{2})$/, '$1.$2'));
        // var total = parseFloat($("#TotalValue").text().replace(/,/g, ""));
        var totalText = $("#TotalValue").text().trim("").split(".");
        let floatValue = parseFloat(totalText[totalText.length - 1]);
        totalText.pop(); // Remove the last element
        let mergedString = totalText.join("");
        mergedString = mergedString + "." + floatValue;
        console.log(mergedString);
        var total = parseFloat(mergedString);
        console.log(total);

        if (isNaN(total)) {
          total = 0;
        }

        // calculating retention from subtotal

        $("#PurchaseOrderAdjustmentValue").val(
          (parseFloat($("#InvoiceRetention").val() * 0.01) * total).toFixed(2)
        );
        $("#PurchaseOrderAdjustmentValue").change();

        // getting retention value
        function getRetPerc() {
          let retPer = $("#InvoiceRetention").val();
          return retPer;
        }

        // changing the adjustment label with the retention percentage
        $("#PurchaseOrderAdjustmentLabel")
          .val(`BIC  (${getRetPerc()}%)`)
          .trigger("change");

        // LOCAL STORAGE (saving new retention value)
        localStorage.setItem("retention", $("#InvoiceRetention").val());
      }, 100);
    }

    // changing التسوية to ضمان أعمال
    let adjLbl = $(".discount-tab-input-label").eq(1);
    // if (adjLbl.text() == "التسوية") {
    //   adjLbl.html(adjLbl.html().replace("التسوية", "خصم ضمان أعمال"));
    // }

    setTimeout(function () {
      // showing error box if retention was not entered after button click
      $("#calcBtn").on("click", function () {
        if (isNaN(parseFloat($("#InvoiceRetention").val()))) {
          $(".error-box").removeClass("hidden-elem");
          $(".empty-value").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".empty-value").addClass("hidden-elem");
        }
        calcRetention();
      });

      // giving error message in case retention percentage exceeds 100%
      $("#InvoiceRetention").on("input", function () {
        if (parseFloat($("#InvoiceRetention").val()) > 100) {
          $("#InvoiceRetention").val(100);
          $(".error-box").removeClass("hidden-elem");
          $(".exceed-limit").removeClass("hidden-elem");
        } else {
          $(".error-box").addClass("hidden-elem");
          $(".exceed-limit").addClass("hidden-elem");
        }
      });
    }, 500);

    // LOCAL STORAGE (showing saved retention value)
    var savedRet = localStorage.getItem("retention");
    console.log(savedRet);
    if (savedRet != 0) {
      $("#InvoiceRetention").val(savedRet);
    }
  });
</script>
