<script>
  function processProductById(productId, updateData) {
    // Step 1: Get the product by ID
    $.ajax({
      url: "/api2/products/" + productId + "?load_custom_data=1",
      type: "GET",
      success: function (product) {
        console.log("Product retrieved:", product);

        // Step 2: Filter products by criteria
        const filterParams = {
          prodId: product.id,
        };

        $.ajax({
          url: `/v2/api/entity/le_productsclone_productslist/list/1?filter[code]=${product.product_code}`,
          type: "GET",
          success: function (filteredProducts) {
            console.log("Filtered products:", filteredProducts);

            // Check if products were found
            if (filteredProducts && filteredProducts.data.length > 0) {
              // Found matching products, proceed with update
              const matchedProduct = filteredProducts.data[0];

              // Step 3: Update the product
              $.ajax({
                url: `/v2/api/entity/product/${matchedProduct.id}/fields`,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                  name: product.Product.name || "",
                  code: product.Product.product_code || "",
                  barcode: barcode || "",
                  field1: product.Product.ProductsCustomData[0].field_16 || "",
                  field2: product.Product.ProductsCustomData[0].field_21 || "",
                  field3: product.Product.ProductsCustomData[0].field_24 || "",
                }),
                success: function (updateResponse) {
                  console.log("Product updated successfully:", updateResponse);
                  showNotification("success", "Product updated successfully");
                },
                error: function (xhr, status, error) {
                  console.error("Error updating product:", error);
                  showNotification(
                    "error",
                    "Failed to update product: " + error
                  );
                },
              });
            } else {
              // No products found
              console.log("No matching products found");
              showNotification("warning", "No matching products found");
            }
          },
          error: function (xhr, status, error) {
            console.error("Error filtering products:", error);
            showNotification("error", "Failed to filter products: " + error);
          },
          complete: function () {},
        });
      },
      error: function (xhr, status, error) {
        console.error("Error getting product:", error);
        showNotification("error", "Failed to retrieve product: " + error);
      },
    });

    // Helper function to show notifications
    function showNotification(type, message) {
      // Remove any existing notifications
      $(".notification").remove();

      // Create notification element
      const notification = $(
        `<div class="notification notification-${type}">${message}</div>`
      );
      $("body").append(notification);

      // Auto-hide after 5 seconds
      setTimeout(function () {
        notification.fadeOut(300, function () {
          $(this).remove();
        });
      }, 5000);
    }
  }

  // Example usage:
  $("#updateProductButton").on("click", function () {
    const productId = window.location.pathname.split("/")[4];
    const updateData = {
      name: $("#productNameInput").val(),
      price: $("#productPriceInput").val(),
      stock: $("#productStockInput").val(),
      // Add any other fields to update
    };

    processProductById(productId, updateData);
  });
</script>
