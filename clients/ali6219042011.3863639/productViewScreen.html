<script>
  document.addEventListener("DOMContentLoaded", () => {
    const productId = window.location.pathname.split("/")[4];
    if (productId) processProductById(productId);
  });

  // Main process function
  async function processProductById(productId) {
    try {
      console.log("Processing product:", productId);

      // Get product and handle barcode
      const product = await fetchWithLogging(
        `/api2/products/${productId}?load_custom_data=1`
      );
      const newBarcode = `${productId}696365482`;
      let currentBarcode = product.data.Product.barcode;

      // Update barcode if missing
      if (!currentBarcode) {
        try {
          await postWithLogging(`/v2/api/entity/product/${productId}/fields`, {
            barcode: newBarcode,
          });
          currentBarcode = newBarcode;
        } catch (error) {
          console.warn(
            "Barcode update failed, continuing process:",
            error.message
          );
        }
      }

      // Check if product exists in clone system
      console.log({ product: product });

      const productCode = product.data.Product.product_code || "";
      console.log({ productCode: productCode });

      const cloneProducts = await fetchWithLogging(
        `/v2/api/entity/le_productsclone_productslist/list/1?filter[code]=${productCode}`
      );

      // Prepare payload
      const payload = createProductPayload(product.data, currentBarcode);

      // Update or create product in clone system
      if (cloneProducts.data.length > 0) {
        await postWithLogging(
          `/v2/api/entity/le_productsclone_productslist/${cloneProducts.data[0].id}/fields`,
          payload
        );
      } else {
        await postWithLogging(`/v2/api/entity/le_productsclone_productslist`, {
          ...payload,
          reference_id: 4,
        });
      }

      console.log("Product processing completed successfully");
    } catch (error) {
      console.error("Process failed:", error.message);
      console.error("Error details:", error);
    }
  }

  // Helper function to create product payload
  function createProductPayload(productData, barcode) {
    console.log({ productData: productData });

    const product = productData.Product;
    let customFields = { field_16: "", field_21: "", field_24: "" };

    customFields.field_16 = product.CustomModel.field_16;
    customFields.field_21 = product.CustomModel.field_21;
    customFields.field_24 = product.CustomModel.field_24;
    console.log({ customFields: customFields });

    return {
      name: product.name || "",
      code: product.product_code || "",
      barcode: barcode || "",
      field1: customFields.field_16 || "",
      field2: customFields.field_21 || "",
      field3: customFields.field_24 || "",
    };
  }

  // Reusable fetch with logging
  async function fetchWithLogging(url) {
    console.log(`GET: ${url}`);

    try {
      const response = await fetch(url);
      console.log(`Response: ${response.status}`);

      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

      const data = await response.json();
      return data;
    } catch (error) {
      console.error(`Fetch failed: ${url}`, error);
      throw error;
    }
  }

  // Reusable post with logging
  async function postWithLogging(url, payload) {
    console.log(`POST: ${url}`, payload);

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
      });

      console.log(`Response: ${response.status}`);

      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

      const data = await response.json();
      return data;
    } catch (error) {
      console.error(`Post failed: ${url}`, error);
      throw error;
    }
  }
</script>
