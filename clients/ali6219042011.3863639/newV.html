<style>
  .col-1 {
    position: relative !important;
  }

  .desc {
    display: block !important;
  }

  .p-list {
    border: 0;
    box-shadow: 0 0 7px 3px rgba(0, 0, 0, 0.1);
    width: 380px;
  }
  @media (max-width: 768px) {
    .p-list {
      width: 100% !important;
    }
  }

  .p-list input {
    border: medium none;
    display: block;
    font-size: 15px;
    padding: 5px 15px;
    width: 100%;
  }

  .s-list {
    background: none repeat scroll 0 0 #fff;
    z-index: 20000000000;
    position: absolute;
    list-style: none;
  }

  .p-list .p-list-ul {
    overflow: auto;
    max-height: 200px;
  }

  .p-list .p-list-ul li {
    padding: 0 10px;
    color: #3a3e63;
  }

  .s-list li {
    border: none;
    border-bottom: 1px solid #eee;
    display: block;
    float: none;
    height: auto;
    position: relative;
  }

  .hidden {
    display: none;
  }

  .p-left {
    float: right !important;
  }

  .m-r-x {
    margin-left: 5px;
  }

  .p-list li a h4 {
    padding: 0;
    margin: 0 0 0;
    font-size: 14px;
    max-width: 65%;
  }

  .p-list li a span {
    left: 15px;
    right: auto;
  }

  .p-list li a span {
    padding: 0;
    margin: 0 0 0;
    color: #888;
    font-size: 12px;
    float: right;
    padding-top: 12px;
    position: absolute;
    top: 23px;
  }
  .p-list .p-list-ul li a span.product-stock {
    top: 40px !important;
  }

  .p-list .p-list-ul li a {
    padding: 5px 10px 15px 10px !important;
    top: 5px;
  }

  .p-list li a span.v-click-span {
    left: 15px;
    right: auto;
  }

  .p-list li a span.v-click-span {
    padding: 0;
    margin: 0 0 0;
    color: #888;
    font-size: 14px;
    float: right;
    position: absolute;
    top: 10px;
  }

  .v-click {
    border: none;
    background: transparent;
    /* color: black; */
    margin-top: 8px;
    color: grey;
  }

  .p-list .p-list-ul li.active,
  .p-list .p-list-ul li:hover {
    background-color: #00b0ef;
  }

  .p-list .p-list-ul li.active *,
  .p-list .p-list-ul li:hover * {
    color: #fff;
  }

  .p-list li a .v-click:hover {
    color: #000099 !important;
    transform: scale(1.5);
  }

  .col-1 textarea,
  #itemsDescription #search_pro {
    direction: ltr;
    text-align: right;
  }
  /* .tare2 {
      display: none !important;
    } */

  #InvoiceProducts {
    display: none !important;
  }

  .invoice-items .table tr td {
    overflow: inherit !important;
  }
</style>
<script>
  // Templates
  const modalTemplate = `
    <div class="modal fade" id="myModalGeneral" tabindex="-1" role="dialog" aria-labelledby="myModalGeneralLabel">
      <div id="myModalGeneralSize" class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <button type="button" class="close-btn" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true"></span>
          </button>
          <div id="myModalGeneralheader" class="modal-header">
            <h4 class="modal-title" id="myModalGeneralLabel">الضرائب</h4>
          </div>
          <div class="modal-body">
            <iframe id="myModalGeneral_iframe" width="100%" height="100%" src="" frameborder="0" allowfullscreen=""></iframe>
          </div>
        </div>
      </div>
    </div>`;

  const productSearchTemplate = `
    <div class="p-list s-list" id="itemsDescription" style="position: relative; z-index: 1000;">
      <div class="p-2 bg-white d-flex justify-content-center align-items-center g-1">
        <input type="text" class="form-control" id="search_pro" value="" placeholder="البحث عن المنتجات ( بالوصف )">
      </div>
      <ul class="p-list-ul"></ul>
      <a href="#" id="addProductButton" class="add-p-link item-settings btn-block-s2020 btn-secondary-s2020 font-weight-bold fs-14 px-3 py-2 s2020 text-dark-blue">
        <i class="s2020 far fa-plus-circle text-success mr-2"></i>إضافة منتج جديد
      </a>
    </div>`;

  // State variables
  var clickedProduct = null;
  var debounceTimer = null;
  var searchActive = false;
  var activeTextarea = null;
  var preventClose = false;

  // Fetch product data based on search term
  async function searchProducts(term) {
    try {
      const encodedTerm = encodeURIComponent(term);
      const response = await fetch(
        `/v2/api/entity/le_productsclone_productslist/list/1?filter[or][name][like]=${encodedTerm}&filter[or][code][like]=${encodedTerm}&filter[or][barcode][like]=${encodedTerm}&filter[or][field3][like]=${encodedTerm}&filter[or][field2][like]=${encodedTerm}&filter[or][field1][like]=${encodedTerm}&filter[reference_id]=4&sort[name]=asc`
      );

      if (!response.ok) {
        throw new Error(`Search failed: ${response.status}`);
      }

      return await response.json();
    } catch (error) {
      console.error("Error searching products:", error);
      return { data: [] };
    }
  }

  // Render product search results
  function renderProductList(products) {
    const productList = $(".p-list-ul");
    productList.empty();

    if (!products || !products.length) {
      productList.append('<li class="no-results">لا توجد نتائج</li>');
      return;
    }

    products.forEach((product) => {
      productList.append(`
        <li>
          <a id="product-${
            product.id
          }" href="#9" class="product-link" data-sku="${product.barcode || ""}">
            <h4 class="product-name">${product.name || ""}</h4>
            <span class="v-click-span">
              <button title="تفاصيل البند" href="#" class="v-click fa fa-info-circle"></button>
            </span>
            <p class="product-code">${product.code || ""}</p>
            <span class="clearfix"></span>
          </a>
        </li>
      `);
    });
  }

  // Handle product selection
  function selectProduct(element) {
    // Find the parent product-link if we clicked on a child element
    const productLink = $(element).hasClass("product-link")
      ? $(element)
      : $(element).closest(".product-link");

    if (!productLink.length) {
      console.warn("Could not find product link element");
      return;
    }

    const barcode = productLink.attr("data-sku");
    if (!barcode) {
      console.warn("No barcode found on product link");
      return;
    }

    console.log("Product selected with barcode:", barcode);

    // Find related elements
    const $row = $(activeTextarea).closest("tr");
    $row.find(".select-item textarea").val("");

    // Call external function if defined
    if (typeof onReceiveBarCode === "function") {
      onReceiveBarCode(barcode);
    } else {
      console.warn("onReceiveBarCode function not defined");
    }

    // Close search results only after selection is processed
    setTimeout(() => {
      $("#itemsDescription").remove();
      searchActive = false;
    }, 100);
  }

  // Show product details modal
  function showProductDetails(productId) {
    $("#myModalGeneralSize").addClass("modal-dialog modal-md");
    $("#myModalGeneral_iframe").attr({
      style: "border: 0; height: 445px",
      src: `/owner/products/view/${productId}?info_screen=1&is_ajax=1`,
    });
    $("#myModalGeneralheader").hide();
    $("#myModalGeneral").modal("show");
  }

  // Show add product modal
  function showAddProductModal() {
    console.log("Showing add product modal");
    $("#myModalGeneralSize").addClass("modal-dialog modal-md");
    $("#myModalGeneral_iframe").attr({
      style: "border: 0; height: 445px",
      src: "/owner/products/add?box=1",
    });
    $("#myModalGeneralheader").hide();
    $("#myModalGeneral").modal("show");
  }

  // Create or update search box
  function setupSearchBox(textarea) {
    const $row = $(textarea).closest("tr");
    const $col = $row.find(".col-1");
    activeTextarea = textarea;

    // Remove any existing search boxes to prevent duplicates
    $("#itemsDescription").remove();

    // Add the search box
    $col.append(productSearchTemplate);

    // Set the search value from textarea
    const searchText = $(textarea).val().trim();
    $("#search_pro").val(searchText);

    // Make the search box visible
    const $searchBox = $("#itemsDescription");
    $searchBox.addClass("desc").show();

    // Set search as active
    searchActive = true;

    // Perform initial search if text exists
    if (searchText) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const result = await searchProducts(searchText);
        renderProductList(result.data || []);
      }, 300);
    }

    // Set focus on search box with a slight delay to prevent issues
    setTimeout(() => {
      $("#search_pro").focus();
    }, 100);
  }

  // Initialize the app
  $(document).ready(function () {
    // Append modal to body if it doesn't exist
    if ($("#myModalGeneral").length === 0) {
      $("body").append(modalTemplate);
    }

    // Handle focus/click on textarea
    $(document).on("focus click", ".col-1 textarea", function (e) {
      e.stopPropagation();
      setupSearchBox(this);

      // Make textarea editable
      $(this).removeAttr("readonly");
    });

    // Handle input in textarea
    $(document).on("input", ".col-1 textarea", function (e) {
      e.stopPropagation();
      const searchText = $(this).val().trim();

      // Update the search box if it exists
      if ($("#search_pro").length) {
        $("#search_pro").val(searchText);
      } else {
        // Create search box if it doesn't exist
        setupSearchBox(this);
      }

      // Perform search
      clearTimeout(debounceTimer);
      if (searchText) {
        debounceTimer = setTimeout(async () => {
          preventClose = true; // Prevent search from closing during update
          const result = await searchProducts(searchText);
          renderProductList(result.data || []);
          setTimeout(() => {
            preventClose = false;
          }, 500);
        }, 300);
      }
    });

    // Handle input in search box
    $(document).on("input", "#search_pro", function (e) {
      e.stopPropagation();
      const searchText = $(this).val().trim();

      // Update the textarea
      $(activeTextarea).val(searchText);

      // Perform search
      clearTimeout(debounceTimer);
      if (searchText) {
        debounceTimer = setTimeout(async () => {
          preventClose = true; // Prevent search from closing during update
          const result = await searchProducts(searchText);
          renderProductList(result.data || []);
          setTimeout(() => {
            preventClose = false;
          }, 500);
        }, 300);
      }
    });

    // FIXED: Handle clicks on product link and all its child elements
    $(document).on("click", ".product-link", function (e) {
      if (
        !$(e.target).hasClass("v-click") &&
        !$(e.target).closest(".v-click-span").length
      ) {
        e.preventDefault();
        e.stopPropagation();
        selectProduct(this);
      }
    });

    // Handle clicks on product name and code
    $(document).on("click", ".product-name, .product-code", function (e) {
      e.preventDefault();
      e.stopPropagation();
      selectProduct(this);
    });

    // Handle specific clicks on spans and paragraphs in product links
    $(document).on(
      "click",
      ".product-link span:not(.v-click-span), .product-link p",
      function (e) {
        e.preventDefault();
        e.stopPropagation();
        selectProduct(this);
      }
    );

    // Handle product details button click
    $(document).on("click", ".v-click, .v-click-span", function (e) {
      e.preventDefault();
      e.stopPropagation();

      const productLink = $(this).closest(".product-link");
      if (productLink.length) {
        const productId = productLink.attr("id").split("-")[1];
        if (productId) {
          clickedProduct = productId;
          showProductDetails(productId);
        }
      }
    });

    // Handle add product button
    $(document).on("click", "#addProductButton, .add-p-link", function (e) {
      console.log("Add product link clicked!");
      e.preventDefault();
      e.stopPropagation();
      showAddProductModal();
      return false;
    });

    // Stop event propagation for clicks inside the search box
    $(document).on(
      "mousedown mouseup click",
      "#itemsDescription, #search_pro",
      function (e) {
        if (
          !$(e.target).hasClass("product-link") &&
          !$(e.target).closest(".product-link").length
        ) {
          e.stopPropagation();
        }
      }
    );

    // Close search results when clicking outside
    $(document).on("click", function (e) {
      if (
        searchActive &&
        !preventClose &&
        !$(e.target).closest("#itemsDescription").length &&
        !$(e.target).closest(".col-1 textarea").length &&
        e.target.id !== "search-icon"
      ) {
        // Add a slight delay to ensure it wasn't an interaction with the search
        setTimeout(() => {
          if (!preventClose) {
            $("#itemsDescription").remove();
            searchActive = false;
          }
        }, 200);
      }
    });

    // Prevent search from closing when interacting with it
    $(document).on("mouseenter", "#itemsDescription", function () {
      preventClose = true;
    });

    $(document).on("mouseleave", "#itemsDescription", function () {
      setTimeout(() => {
        preventClose = false;
      }, 500);
    });
  });
</script>
