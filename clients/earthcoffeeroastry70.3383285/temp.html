    * {
      margin: 0;
      padding: 0;
      font-family: "Frutiger LT Arabic", "Cairo", "Tajawal" !important;
      box-sizing: border-box;
    }

    body {
      direction: rtl;
      text-align: right;
      font-size: 12px;
      font-family: "Frutiger LT Arabic", "Cairo", "Tajawal" !important;
    }

    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }

    .invoice-inner {
      margin: 0 10px;
      padding: 15px 0;
    }
    #listing_table {
      border: none !important;
      width: 85% !important;
      font-size: 10px !important;
      margin: 0 7.5% !important;
    }
    .listing-table:nth-child(2) {
      display: none;
    }
    #listing_table th,
    #listing_table td {
      border-bottom: 1px solid #590705;
      border-right: none !important;
      border-left: none !important;
      border-top: none !important;
      padding: 2px;
      text-align: center !important;
      font-weight: bold;
    }
    #listing_table th {
      color: #fff !important;
    }
    #listing_table td {
      color: #590705 !important;
    }
    #listing_table th:nth-child(odd) {
      background-color: #831b13 !important;
    }
    #listing_table th:nth-child(even) {
      background-color: #b7403d !important;
    }
    #listing_table td:nth-child(even) {
      background-color: #fff !important;
    }
    #listing_table td:nth-child(odd) {
      background-color: #f1e7e7 !important;
      color: #fff;
    }
    #listing_table th:nth-child(1) {
      width: 7%;
    }
    #listing_table th:nth-child(2) {
      width: 10%;
    }
    #listing_table th:nth-child(3) {
      width: 15%;
    }
    #listing_table th:nth-child(4) {
      width: 7%;
    }
    #listing_table th:nth-child(5) {
      width: 7%;
    }
    #listing_table th:nth-child(6) {
      width: 9%;
    }
    #listing_table th:nth-child(7) {
    }
    #listing_table th:nth-child(8) {
      width: 18%;
    }
    #listing_table th:nth-child(9) {
        width: 9%;
    }
    #listing_table th:nth-child(10) {
      width: 18%;
    }
  </style>

  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <div id="items-list">{%items_list%}</div>
      </div>
      <div style="display: none">
        <div id="discount">{%discount%}</div>
        <div id="item-discount">{%item-discount-total%}</div>
      </div>

      {%html_sticky_footer%}
    </div>
    <script>
      function addserials() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerHTML = "رقم <br> NO ";
        allRows[0].insertBefore(newTh, allRows[0].cells[0]);
        for (var i = 1; i < allRows.length; i++) {
          var newTd = document.createElement("td");
          newTd.innerText = i;
          allRows[i].insertBefore(newTd, allRows[i].cells[0]);
        }
      }
      try {
        addserials();
      } catch (error) {
        console.log(error);
      }
      function adddiscCol() {
        var allRows = document.querySelectorAll("#listing_table tr");
        if (allRows[0].cells.length == 8) {
          var newTh = document.createElement("th");
          newTh.innerHTML = "خصم <br> disc ";
          newTh.style.display = "none";
          allRows[0].insertBefore(newTh, allRows[0].cells[6]);
          for (var i = 1; i < allRows.length; i++) {
            var newTd = document.createElement("td");
            newTd.innerText = "0";
            newTd.style.display = "none";
            allRows[i].insertBefore(newTd, allRows[i].cells[6]);
          }
        }
      }
      try {
        adddiscCol();
      } catch (error) {
        console.log(error);
      }
      function addsubttlCol() {
        var allRows = document.querySelectorAll("#listing_table tr");
        var newTh = document.createElement("th");
        newTh.innerHTML = "المجموع قبل الضريبة <br>  Total before tax";
        allRows[0].insertBefore(newTh, allRows[0].cells[7]);
        for (var i = 1; i < allRows.length; i++) {
          var newTd = document.createElement("td");
          newTd.innerText =
            parseFloat(allRows[i].cells[4].innerText.replace(/,/g, "")) *
            parseFloat(allRows[i].cells[5].innerText.replace(/,/g, ""));
          allRows[i].insertBefore(newTd, allRows[i].cells[7]);
        }
      }
      try {
        addsubttlCol();
      } catch (error) {
        console.log(error);
      }
      function swaCols() {
        var allRows = document.querySelectorAll("#listing_table tr");
        for (var i = 0; i < allRows.length; i++) {
          var container = allRows[i].cells[3].innerHTML;
          allRows[i].cells[3].innerHTML = allRows[i].cells[4].innerHTML;
          allRows[i].cells[4].innerHTML = container;
        }
      }
      try {
        swaCols();
      } catch (error) {
        console.log(error);
      }
    </script>
