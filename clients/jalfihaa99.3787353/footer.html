<html>
  <head>
    <style>
      #banks {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
      }
      #banks td {
        border: 1px solid black;
        padding: 3px;
        text-align: right;
      }
    </style>
    <script>
      function subst() {
        // Decoding the invoice page url to detect page number
        var vars = {};
        var x = document.location.search.substring(1).split("&");
        for (var i in x) {
          var z = x[i].split("=", 2);
          vars[z[0]] = unescape(z[1]);
        }
        // Adding Pagination Text
        var x = [
          "frompage",
          "topage",
          "page",
          "webpage",
          "section",
          "subsection",
          "subsubsection",
        ];
        for (var i in x) {
          var y = document.getElementsByClassName(x[i]);
          for (var j = 0; j < y.length; ++j) y[j].textContent = vars[x[i]];
        }
      }
    </script>
  </head>
  <body style="border: 0; margin: 0" onload="subst()">
    <table id="banks">
      <tr>
        <td>البنك : مصرف الراجحى</td>
        <td>رقم الحساب : 525000010006080321343</td>
        <td>IBAN : SA3380000525608010321343</td>
      </tr>
      <tr>
        <td>البنك : البنك الأهلي السعودي</td>
        <td>رقم الحساب : 01400008957505</td>
        <td>IBAN : SA7310000001400008957505</td>
      </tr>
    </table>
    <table style="width: 100%">
      <tr>
        <td colspan="2">
          <!-- <div
            style="
              border-top: 2px solid rgb(255, 41, 41);
              text-align: right;
              padding: 4px;
              font-weight: bold;
            "
          >
            استلمت البضاعة كاملة و سليمة
          </div> -->
        </td>
      </tr>
      <tr>
        <td style="text-align: center; direction: ltr; width: 70%">
          <span class="page"></span> of <span class="topage"></span>
        </td>
        <!-- <td>اسم المستحدم : {%staff_member_name%}</td> -->
      </tr>
    </table>
  </body>
</html>
