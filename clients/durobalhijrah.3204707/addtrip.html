  <script>
    $(document).ready(function () {
      function validateInputs() {
        const $inputs = $(".mainform input");
        $(".err-msg").remove();
        let hasError = false;
        // Check each input for a value
        $inputs.each(function () {
          if (!$(this).val()) {
            if ($(this).attr("id") === "generalNotes") {
              return; // Skip to the next iteration
            }
            hasError = true;
            const $errorMsg = $(
              '<div class="err-msg" style="color:red;">.This field is required</div>'
            );
            $(this).after($errorMsg);
          }
        });
        return !hasError;
      }

      $("#sendtrip").on("click", function (e) {
        e.preventDefault();
        console.log(validateInputs());

        if (validateInputs()) {
          let flag1 = 0;

              "style",
              "display:inline-block; color:red;padding:0 25px"
            );

            flag1 = 0;
            $("#generalNameerror").attr("style", "display:none;");
          }
// استلمت البضاعة كاملة و سليمة

          if (flag1 == 0) {
            $("#sendtrip").attr("disabled", true);
            sendtrip();

          function findSimilarHotel(airportOption, hotelsData) {
            const hotelOptions = hotelsData;
            // const hotelOptions = [
            //   "من فضلك اختر",

            //   "المدينة المنورة Medina",

            const airportWords = airportOption.split(" ");
            // console.log({ airportWords: airportWords });
            console.log({ airportWords: airportWords });
            console.log({ hotelOptions: hotelOptions });
            // Iterate through hotel options to find a match
            for (const hotel of hotelOptions) {
              for (const word of airportWords) {
                if (
                  hotel.city2.includes(word) &&
                  word != "" &&
                  airportWords.indexOf("مطار") == -1
                ) {
                  return hotel.hotel;
                }
              }
            }
            return null;

          async function sendRoutesFn(tripId) {
            console.log(tripId);

            // let tripId = parseInt(window.location.pathname.split("/")[4]);
            async function PostRoutes() {
              try {
                const response = await fetch(
                  `/v2/api/entity/le_workflow-type-entity-4/${tripId}/4`,
                  {
                    method: "GET",
                    headers: {
                      apikey: "bceffccefa6ab4014732bb7093d284bc37794bf4",
                      Accept: "application/json",
                      "Content-Type": "application/json",
                    },
                  }
                );

                const data = await response.json();
                console.log("Response:", data);
                await AddRoutes(data);
                console.log("completed");

                console.error("Error:", error);
              }

            async function AddRoutes(workflowData) {
              let routes =
                workflowData["le_workflow-type-entity-4_custom_data"][
                  "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_transportations"
                ];

                ];
              // console.log({ routes: routes });

              if (routes.length > 0) {
                function creeatenusoks() {
                  let nusoksData =
                    workflowData["le_workflow-type-entity-4_custom_data"][
                      "le_custom_data_le_workflow-type-entity-4_le_custom_data_le_workflow-type-entity-4_nusuks"
                    ];
                  // console.log(nusoksData);
                  if (nusoksData.length > 0) {
                    let nusoksObject = {
                      nusuk_no: "",
                      passengers_no: 0,
                    };
