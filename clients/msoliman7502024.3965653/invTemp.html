<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Invoice Template</title>
  </head>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif !important;
      /* direction: rtl; */
    }

    body {
      background: transparent;
      /* direction: rtl; */
      text-align: right;
    }

    .invoice-wrap {
      width: 660px;
      margin: 0 auto;
      background: #fff;
      color: #000;
    }

    .invoice-inner {
      padding: 8px 0;
    }

    .invoice-address {
      border-top: 3px double #000000;
      margin: 35px 0;
      padding-top: 25px;
    }

    bold_title {
      font-weight: bold;
    }

    big_title {
      font-size: 17px;
      font-weight: 100;
    }

    .bussines-name {
      font-size: 17px;
      font-weight: 100;
    }

    .invoice-name {
      font-size: 18px;
      font-weight: 700;
    }

    .listing-table th {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
      text-align: right;
      padding: 6px 4px;
    }

    .listing-table td {
      border-bottom: 1px solid #555555;
      text-align: right;
      padding: 5px 6px;
      vertical-align: top;
    }

    .total-table td {
      border-right: 1px solid #555555;
    }

    .total-row {
      background-color: #e5e5e5;
      border-bottom: 1px solid #555555;
      border-top: 1px solid #555555;
      font-weight: bold;
    }

    .row-items {
      margin: 5px 0;
      display: block;
    }

    .notes-block {
      margin: 50px 0 0 0;
    }

    tr,
    td,
    th {
      page-break-inside: avoid !important;
    }

    #business_info {
      line-height: 1.4;
    }

    #listing_table {
      direction: ltr !important;
    }

    #listing_table tbody td {
      border-bottom: 1px solid #eee;
    }

    #label_subtotal {
      width: 65px;
    }

    #label_field3,
    #label_field4 {
      width: 55px;
    }

    #items-list > table:nth-child(2) tr td:nth-child(1) {
      width: 60%;
    }

    #listing_table th,
    #listing_table td {
      text-align: center;
      border: none;
      font-weight: normal;
    }

    #listing_table th:nth-child(2),
    #listing_table td:nth-child(2),
    #listing_table th:nth-child(1) {
      text-align: left;
    }

    #listing_table td:nth-child(2),
    #listing_table td:nth-child(1) {
      font-weight: bold;
      text-align: left;
    }

    #listing_table thead,
    #listing_table tbody {
      font-size: 10px;
    }

    #listing_table tbody tr td:last-child {
      font-weight: bold;
    }

    #listing_table th:nth-child(8),
    #listing_table th:nth-child(9) {
      font-size: 8px;
    }

    .qr-code img {
      margin-top: 10px;
      width: 80%;
    }

    .hidden {
      display: none;
    }

    table.listing-table:nth-child(2) {
      display: none;
    }

    /* 
     */
  </style>

  <body>
    <div class="invoice-wrap">
      {%html_sticky_header%}
      <div class="invoice-inner">
        <div id="items-list">{%items_list%}</div>
        <div class="notes-block">
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="font-style: italic"
                  class="editable-area"
                  id="footer"
                >
                  {%footer%}
                </div>
              </td>
            </tr>
          </table>
        </div>
        <br />
      </div>
      <div style="display: none">
        <div id="discount">{%discount%}</div>
        <div id="item-discount">{%item-discount-total%}</div>
        {%invoice_title%}
      </div>

      {%html_sticky_footer%}
    </div>
    <script>
      var currency = "";
      function detectCurrency() {
        var unitPrice = document.querySelector(
          "#listing_table tr td:nth-child(6)"
        );
        var price = unitPrice.innerText;
        if (price.indexOf("ر.س") > -1) {
          currency = " ر.س";
        } else if (price.indexOf("SR") > -1) {
          currency = " SR";
        }
      }

      function addThousandSeparator(num) {
        var parts = num.toString().split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return parts.join(".");
      }

      function hasDiscount() {
        var discountValue = document
          .getElementById("discount")
          .innerText.replace(/[^\d]/g, "");
        var itemDiscount = document
          .getElementById("item-discount")
          .innerText.replace(/[^\d]/g, "");
        var hasInvoiceDiscount = false;
        var hasItemDiscount = false;
        if (parseFloat(itemDiscount) != 0) {
          hasItemDiscount = true;
        }

        if (parseFloat(discountValue) != 0) {
          hasInvoiceDiscount = true;
        }

        return {
          invoiceDiscount: hasInvoiceDiscount,
          itemDiscount: hasItemDiscount,
        };
      }
      function isLabelUnitPriceAfterLabelQuantity() {
        var ths = document.getElementsByTagName("th");
        var label_unit_price, label_quantity;

        for (var i = 0; i < ths.length; i++) {
          if (ths[i].id == "label_unit_price") {
            label_unit_price = ths[i];
          } else if (ths[i].id == "label_quantity") {
            label_quantity = ths[i];
          }
        }

        if (label_unit_price && label_quantity) {
          var currentElement = label_quantity;
          while ((currentElement = currentElement.nextSibling)) {
            if (currentElement == label_unit_price) {
              return true;
            }
          }
        }
        return false;
      }
      function insertCol(index, colLabel, labelId, cellClass) {
        var tbl = document.getElementById("listing_table");

        for (i = 0; i < tbl.rows.length; i++) {
          var newCell = tbl.rows[i].insertCell(index);
          newCell.classList.add(cellClass);

          //  newCell.innerText = parseFloat(tax[i].innerText.replace(/,/g, "")) + parseFloat(total[i].innerText.replace(/,/g, ""))
        }
        var firstCell = tbl.rows[0].cells[index];
        firstCell.outerHTML = "<th id=" + labelId + ">" + colLabel + "</th>";
        // firstCell.id = labelId
        firstCell.style.cssText =
          "border-top:1px solid #000;font-weight:bold;text-align:center;background:#e5e5e5";
      }

      function swap(in1, in2, table_id) {
        var table = document.getElementById(table_id);
        for (var i = 0, row; (row = table.rows[i]); i++) {
          var cell1 = row.cells[in1];
          var cell2 = row.cells[in2];

          // Swap innerHTML
          var tempHTML = cell1.innerHTML;
          cell1.innerHTML = cell2.innerHTML;
          cell2.innerHTML = tempHTML;

          // Swap id
          var tempId = cell1.id;
          cell1.id = cell2.id;
          cell2.id = tempId;

          // Swap class
          var tempClass = cell1.className;
          cell1.className = cell2.className;
          cell2.className = tempClass;
        }
      }

      function resetColumnsClass(column_id, table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        var columnIndex = -1;
        for (var i = 0; i < thElements.length; i++) {
          if (thElements[i].id === column_id) {
            columnIndex = i;
            break;
          }
        }

        if (columnIndex !== -1) {
          for (var j = 1, row; (row = table.rows[j]); j++) {
            var cell = row.cells[columnIndex];
            if (cell) {
              cell.className = column_id;
            }
          }
        } else {
          console.log("Column with id " + column_id + " not found.");
        }
      }

      function resetTableColumns(table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        for (var i = 0; i < thElements.length; i++) {
          var thId = thElements[i].id;
          resetColumnsClass(thId, table_id);
        }
      }
      function handleDuplicateThIds(table_id) {
        var table = document.getElementById(table_id);
        var thElements = table.getElementsByTagName("th");
        var idTracker = {};

        for (var i = 0; i < thElements.length; i++) {
          var th = thElements[i];
          var thId = th.id;

          if (idTracker[thId]) {
            idTracker[thId].id = "discount-cell";
          } else {
            idTracker[thId] = th;
          }
        }
      }

      function calcInvoiceColumns() {
        var price = document.querySelectorAll(".label_unit_price");
        var qty = document.querySelectorAll(".label_quantity");
        var subTotal = document.querySelectorAll(".label_subtotal");
        var discColumn = document.querySelectorAll(".discount_th");
        if (!discColumn.length) {
          discColumn = document.querySelectorAll(".discount-cell");
        }
        var vatPercent = document.querySelectorAll(".label_field3");
        var vatCol = document.querySelectorAll(".label_field4");
        var total = document.querySelectorAll(".label_field5");

        var discountTotal = parseFloat(
          document.getElementById("discount").innerText.replace(/,/g, "")
        );
        if (isNaN(discountTotal)) {
          discountTotal = 0;
        }

        var sumSubtotal = 0;
        var sumItemsPrice = 0;
        var remaining = 1;
        var discountPercent = 0;

        for (var i = 0; i < subTotal.length; i++) {
          sumSubtotal += parseFloat(subTotal[i].innerText.replace(/,/g, ""));
          sumItemsPrice +=
            parseFloat(price[i].innerText.replace(/,/g, "")) *
            parseFloat(qty[i].innerText.replace(/,/g, ""));
        }

        if (discountTotal != 0) {
          discountPercent = discountTotal / sumSubtotal;
          remaining = 1 - discountPercent;
        }

        var invoiceSubtotalTd = document.querySelector(
          "#items-list table:nth-child(2) tr:first-child td:last-child"
        );
        var currentInvoiceSbutotal = parseFloat(
          invoiceSubtotalTd.innerText
            .replace(/,/g, "")
            .replace(/[^\d.]/g, "")
            .replace(/(\..*)\./g, "$1")
        );
        var invoiceDiscountValue = document
          .getElementById("discount")
          .innerText.replace(/[^\d.]/g, "");

        for (var i = 0; i < subTotal.length; i++) {
          var currentUnitPrice = parseFloat(
            price[i].innerText.replace(/,/g, "")
          );
          var itemQty = parseFloat(qty[i].innerText.replace(/,/g, ""));
          var discountInRow = 0;
          if (discColumn[i].innerText.indexOf("%") > -1) {
            discountInRow =
              (parseFloat(
                discColumn[i].innerText.replace("%", "").replace(/,/g, "")
              ) /
                100) *
              currentUnitPrice;
            console.log("discountInRow " + i);
            console.log(discountInRow);
          } else {
            discountInRow = parseFloat(
              discColumn[i].innerText.replace(/,/g, "")
            );
          }
          if (isNaN(discountInRow)) {
            discountInRow = 0;
          }

          var rowTotal = parseFloat(total[i].innerText.replace(/,/g, ""));

          var hasTax = true;

          var TaxPercentage = parseFloat(
            vatPercent[i].innerText.replace("%", "")
          );

          if (!parseInt(TaxPercentage)) {
            hasTax = false;
          }

          var newTotal = (
            parseFloat(total[i].innerText.replace(/,/g, "")) / remaining
          ).toFixed(2);
          subTotal[i].innerText = (
            parseFloat(total[i].innerText.replace(/,/g, "")) -
            parseFloat(vatCol[i].innerText.replace(/,/g, ""))
          )
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",");

          var checkIfTaxIsInclusive =
            newTotal ==
              parseFloat(subTotal[i].innerText.replace(/,/g, "")).toFixed(2) ||
            Math.abs(
              newTotal -
                parseFloat(subTotal[i].innerText.replace(/,/g, "")).toFixed(2)
            ) <= 0.1;
          var itemShare =
            parseFloat(subTotal[i].innerText.replace(/,/g, "")) /
            currentInvoiceSbutotal;
          var itemDiscountShareAmount = discountTotal * itemShare;
          console.log("itemDiscountShareAmount " + i);
          console.log(itemDiscountShareAmount);
          var itemDiscount =
            itemShare * parseFloat(invoiceDiscountValue) + discountInRow;
          // discColumn[i].innerText = itemDiscount.toFixed(3)

          if (!!checkIfTaxIsInclusive) {
            price[i].innerText = (
              parseFloat(subTotal[i].innerText.replace(/,/g, "")) / itemQty +
              itemTotalDiscount
            )
              .toFixed(3)
              .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          }
        }
      }

      try {
        detectCurrency();

        var mainTable = document.getElementById("listing_table");
        var colCount = mainTable.rows[0].cells;
        var PriceQuantityPlace = isLabelUnitPriceAfterLabelQuantity();
        handleDuplicateThIds("listing_table");
        if (colCount.length == 8) {
          insertCol(7, "Discount<br>خصومات", "discount_th", "discounts");
          swap(2, 5, "listing_table");
          swap(3, 6, "listing_table");
          swap(4, 8, "listing_table");
          swap(5, 7, "listing_table");
          swap(6, 7, "listing_table");
          swap(4, 5, "listing_table");
        } else {
          swap(2, 5, "listing_table");
          swap(3, 6, "listing_table");
          swap(4, 8, "listing_table");
          swap(5, 7, "listing_table");
          swap(6, 7, "listing_table");
          swap(4, 5, "listing_table");
        }

        resetTableColumns("listing_table");
        var hasInvoiceDiscount = hasDiscount();
        calcInvoiceColumns();
        // var sharedDiscount = calcSubtotalInc(PriceQuantityPlace);
        // if (hasInvoiceDiscount.invoiceDiscount) {
        //   console.log('has discount')
        //   calcDisCol(PriceQuantityPlace, sharedDiscount);
        // }

        if (
          !hasInvoiceDiscount.invoiceDiscount &&
          !hasInvoiceDiscount.itemDiscount
        ) {
          var mainTable = document.getElementById("listing_table");
          for (var i = 0; i < mainTable.rows.length; i++) {
            var tableCell = mainTable.rows[i].cells[4];
            tableCell.classList.add("hidden");
          }
        }
      } catch (err) {
        console.log(err);
      }

      // Custom code
      function removeColumn() {
        var table = document.getElementById("listing_table");
        var rows = table.rows;
        for (var i = 0; i < rows.length; i++) {
          console.log("Row");
          console.log(rows[i].children[6]);
          rows[i].children[6].style.display = "none";
        }
      }
      try {
        removeColumn();
      } catch (err) {
        console.log(err);
      }
      function addBorder() {
        var thead = document.querySelector("table#listing_table thead");
        var firstEmptyRow = document.createElement("tr");
        var secondEmptyRow = document.createElement("tr");
        var thirdEmptyRow = document.createElement("tr");
        var columns = thead.querySelectorAll("th").length;
        for (var i = 0; i < columns - 1; i++) {
          var td = document.createElement("td");
          secondEmptyRow.appendChild(td);
        }
        var tds = secondEmptyRow.querySelectorAll("td");
        for (var i = 0; i < tds.length; i++) {
          tds[i].style.height = "3px";
          tds[i].style.padding = "0";
          tds[i].style.border = "none";
        }
        firstEmptyRow.style.height = "5px";
        secondEmptyRow.style.height = "3px";
        thirdEmptyRow.style.height = "5px";
        secondEmptyRow.style.background = "#ff8000";
        thead.insertAdjacentElement("afterend", thirdEmptyRow);
        thead.insertAdjacentElement("afterend", secondEmptyRow);
        thead.insertAdjacentElement("afterend", firstEmptyRow);
      }
      try {
        addBorder();
      } catch (e) {
        console.log(e);
      }
    </script>
  </body>
</html>
